<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动控制原理</title>
  <style>
    html { scrollbar-gutter: stable; }
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #17201e;
      --muted: #6c7774;
      --line: #e1e8e6;
      --green: #0b9f7a;
      --green-dark: #08775b;
      --green-soft: #e9f8f3;
      --red: #d84c4c;
      --red-soft: #fff0ef;
      --amber: #956410;
      --amber-soft: #fff7e6;
      --shadow: 0 12px 34px rgba(24, 52, 44, .07);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.75;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(11, 159, 122, .24); outline-offset: 3px; }
    .topbar {
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    h1 { font-size: 19px; line-height: 1.35; margin: 0; }
    .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .mode-switch {
      display: flex;
      padding: 4px;
      background: #edf1f0;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .mode-btn, .order-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }
    .mode-btn.active, .order-btn.active { background: var(--text); color: white; box-shadow: 0 3px 10px rgba(0,0,0,.12); }
    .order-switch[hidden] { display: none; }
    #orderSwitch { display: none !important; } /* 正序/乱序入口隐藏，默认乱序 */
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 26px 24px 42px;
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .layout { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: start; }
    .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }
    /* 防止背题模式的长公式把卡片撑宽（手机端横移/缩放感） */
    .layout > * { min-width: 0; }
    mjx-container[display="true"] { max-width: 100%; overflow-x: auto; overflow-y: hidden; }

    .question-card { padding: 28px; min-height: 570px; align-self: stretch; display: flex; flex-direction: column; }

    .timer-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 11px; border-radius: 999px;
      background: #f1f5f3; color: var(--muted); font-size: 12px; font-weight: 500;
      border: 1px solid #e6ecea;
    }
    .timer-chip .timer-dot { background: #a9c3ba; width: 6px; height: 6px; animation: none; }
    .timer-chip.paused { opacity: .55; }
    .timer-chip b { font-variant-numeric: tabular-nums; font-weight: 600; color: #55625e; }
    .timer-chip .timer-sep { opacity: .5; }
    .chip-finish {
      border: 1px solid #e1e8e6; border-radius: 999px; background: #fff; color: var(--muted);
      padding: 2px 13px; font-size: 12px; font-weight: 600; cursor: pointer; line-height: 1.5;
    }
    .chip-finish:hover { color: var(--text); border-color: #cbdcd6; }
    @media (max-width: 580px) {
      .timer-chip { font-size: 11px; padding: 1px 9px; gap: 5px; }
      .chip-finish { font-size: 11px; padding: 1px 10px; }
    }
    .question-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; row-gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .question-meta .tags { min-width: 0; }
    .question-meta .meta-right { flex: 0 0 auto; margin-left: auto; gap: 10px; }
    .tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tag { padding: 3px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); font-size: 12px; font-weight: 700; }
    .star-tag { background: #fff4d6; color: #a86a00; }
    .counter { color: var(--muted); font-size: 22px; font-weight: 600; white-space: nowrap; letter-spacing: .5px; }
    .counter strong { color: var(--text); font-size: 22px; font-weight: 800; margin-right: 2px; }
    .question-text { font-size: 18px; font-weight: 650; line-height: 1.85; margin: 0 0 24px; overflow-wrap: anywhere; }
    .options { display: grid; gap: 12px; }
    .option {
      width: 100%;
      min-height: 52px;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: white;
      color: var(--text);
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
    }
    .answer-mode .option:not(:disabled):hover { border-color: var(--green); background: #f8fcfa; transform: translateY(-1px); }
    .option:disabled { cursor: default; opacity: 1; }
    .option-letter {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #f0f3f2;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-weight: 700;
      font-family: Arial, sans-serif;
    }
    .option-content { flex: 1; min-width: 0; overflow: visible; padding: 3px 0; display: flex; align-items: center; }
    .option { min-width: 0; }
    .blank-ans {
      display: inline-block;
      color: var(--green-dark);
      font-weight: 700;
      background: var(--green-soft);
      border-bottom: 2px solid rgba(11, 159, 122, .55);
      border-radius: 4px 4px 2px 2px;
      padding: 0 4px;
      margin: 0 1px;
      line-height: 1.35;
      white-space: nowrap;
    }
    .option-content mjx-container, .question-text mjx-container { max-width: 100%; }
    .option-content mjx-container svg, .question-text mjx-container svg { max-width: 100%; height: auto; }
    .option-content { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .option-content::-webkit-scrollbar { display: none; }
    .option .option-content, .option .option-status { color: var(--text); }
    .option-status { font-size: 12px; font-weight: 700; white-space: nowrap; }
    .option.correct { background: var(--green-soft); border-color: var(--green); }
    .option.correct .option-letter { background: var(--green); color: white; }
    .option.wrong { background: var(--red-soft); border-color: var(--red); }
    .option.wrong .option-letter { background: var(--red); color: white; }
    .option.muted { opacity: 1; }
    .solution {
      margin-top: 24px;
      border-radius: 16px;
      background: #f5f8f7;
      border-left: 4px solid var(--green);
      padding: 18px 20px;
      animation: appear .22s ease-out;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .solution-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .answer-line { font-size: 16px; font-weight: 800; color: var(--green-dark); }
    .answer-line .user-wrong { color: var(--red); margin-left: 10px; font-weight: 500; }
    .redo { border: 0; background: white; color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .recall-panel { padding: 28px 20px; border-radius: 16px; background: #f5f8f7; text-align: center; color: var(--muted); }
    .recall-panel p { margin: 0 0 15px; font-size: 14px; }
    .recall-btn { border: 0; border-radius: 999px; background: var(--text); color: white; padding: 9px 24px; cursor: pointer; }
    .self-check { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 12px 0; padding: 12px 14px; background: white; border-radius: 12px; }
    .self-check span { color: var(--muted); font-size: 13px; }
    .self-check div { display: flex; gap: 8px; }
    .self-check button { border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    .self-check button[data-grade="correct"] { background: var(--green-soft); color: var(--green-dark); }
    .self-check button[data-grade="wrong"] { background: var(--red-soft); color: var(--red); }
    .fill-result { margin-left: 10px; font-weight: 500; }
    .fill-result.good { color: var(--green-dark); }
    .fill-result.bad { color: var(--red); }
    .solution h2 { font-size: 15px; margin: 10px 0 6px; }
    .solution p { margin: 7px 0; font-size: 14px; color: #45514e; }
    .formula-box { margin: 10px 0; padding: 10px 13px; background: white; border-radius: 10px; overflow-x: auto; color: #26332f; }
    .caution { margin-top: 12px; padding: 11px 13px; border-radius: 11px; background: var(--amber-soft); color: #785313; font-size: 13px; }
    .caution strong { display: block; margin-bottom: 3px; }
    .question-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 26px; }
    .nav-btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 22px;
      background: #edf1f0;
      color: var(--text);
      cursor: pointer;
    }
    .nav-btn.primary { background: var(--text); color: white; }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .sidebar { display: grid; gap: 16px; position: sticky; top: 98px; }
    .sidebar > .mode-switch { width: 100%; }
    .sidebar > .mode-switch .mode-btn, .sidebar > .mode-switch .order-btn { flex: 1; padding-left: 10px; padding-right: 10px; }
    .panel { padding: 20px; }
    .panel-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 14px; font-size: 14px; }
    .panel-title span { color: var(--muted); font-size: 12px; font-weight: 400; }
    .question-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 36px; gap: 8px; max-height: 212px; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: #b8c4c0 transparent; }
    .question-grid::-webkit-scrollbar { width: 5px; }
    .question-grid::-webkit-scrollbar-thumb { background: #b8c4c0; border-radius: 999px; }
    .question-grid::-webkit-scrollbar-track { background: transparent; }
    .q-num {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
    }
    .q-num.current { border-color: var(--text); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
    .q-num.done { background: var(--green-soft); color: var(--green-dark); border-color: transparent; }
    .q-num.error { background: var(--red-soft); color: var(--red); border-color: transparent; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; color: var(--muted); font-size: 11px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d8dfdd; }
    .dot.done { background: var(--green); }
    .dot.error { background: var(--red); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-bottom: 16px; }
    .stat strong { display: block; font-size: 22px; line-height: 1.4; }
    .stat span { color: var(--muted); font-size: 11px; }
    .progress-track { height: 7px; border-radius: 99px; background: #edf1f0; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: var(--green); border-radius: inherit; transition: width .1s linear; }
    .progress-text { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 7px; }
    .reset {
      width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 14px; background: #f4f7f6; color: var(--text);
      font-weight: 600; font-size: 14px; cursor: pointer; transition: .2s;
    }
    .reset:hover { background: #e9f1ee; border-color: #cdded8; }
    .tip { color: var(--muted); font-size: 12px; text-align: center; margin: 18px 0 0; }
    .math { font-family: "Times New Roman", "Cambria Math", serif; font-style: italic; white-space: nowrap; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.25; margin: 0 .16em; }
    .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .24em .08em; }
    .frac > span:last-child { padding: .08em .24em 0; }
    .sqrt { display: inline-flex; align-items: stretch; white-space: nowrap; }
    .sqrt > span { border-top: 1px solid currentColor; padding: 0 .12em; }
    sup .frac { font-size: .85em; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; grid-template-columns: 1fr 1fr; }
      .sidebar > .mode-switch { grid-column: 1 / -1; }
      .question-card { min-height: auto; }
    }
    @media (max-width: 580px) {
      .topbar-inner { padding: 12px 15px; gap: 10px; }
      h1 { font-size: 16px; }
      .brand p { display: none; }
      .mode-btn, .order-btn { padding: 6px 9px; font-size: 12px; }
      .wrap { padding: 16px 13px 30px; }
      .question-card { padding: 20px 16px; border-radius: 18px; }
      .question-text { font-size: 16px; }
      .option { padding: 11px 12px; gap: 10px; }
      .sidebar { grid-template-columns: 1fr; }
      .panel { padding: 17px; }
      .question-grid { grid-template-columns: repeat(10, 1fr); gap: 5px; max-height: none; overflow: visible; padding-right: 0; }
      .q-num { border-radius: 7px; font-size: 12px; }
      .solution { padding: 15px; }
    }
  
    /* ===== LaTeX 公式字号 ===== */
    mjx-container { font-size: 1.08em; }
    mjx-container[display="true"] { font-size: 1.18em; }
    .option-content mjx-container { font-size: 1.08em; }
    .question-text { line-height: 2.05; }

    /* ===== 收藏 ===== */
    .meta-right { display: flex; align-items: center; gap: 14px; }
    .fav-btn { white-space: nowrap; flex: 0 0 auto; }
    .fav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 11px 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s, transform .15s;
      z-index: 3;
    }
    .fav-btn .fav-icon { font-size: 15px; line-height: 1; color: #aab5b1; transition: color .15s; }
    .fav-btn:hover { border-color: var(--amber); color: var(--amber); background: #fffdf6; }
    .fav-btn:hover .fav-icon { color: var(--amber); }
    .fav-btn.on { background: #fffdf4; border-color: #f0c94a; color: var(--muted); }
    .fav-btn.on .fav-icon { color: #ffb400; }
    .fav-btn:active { transform: scale(.95); }
    .fav-switch {
      display: flex;
      padding: 4px;
      background: #edf1f0;
      border-radius: 999px;
    }
    .fav-toggle {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }
    .fav-toggle .fav-toggle-icon { font-size: 15px; line-height: 1; color: #b9c2bf; transition: color .15s; }
    .fav-toggle .fav-count {
      min-width: 20px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #e2e8e6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .fav-toggle:hover:not(:disabled) { background: rgba(255,255,255,.65); color: var(--text); }
    .fav-toggle.on { background: var(--green); color: #fff; box-shadow: 0 3px 10px rgba(11,159,122,.25); }
    .fav-toggle.on .fav-toggle-icon { color: #ffd54f; }
    .fav-toggle.on .fav-count { background: rgba(255,255,255,.24); color: #fff; }
    .fav-toggle:disabled { opacity: .45; cursor: not-allowed; }
    .q-num { position: relative; }
    .q-num.fav::after {
      content: '★';
      position: absolute;
      top: -7px;
      right: -5px;
      font-size: 9px;
      color: #f0b400;
      line-height: 1;
    }
    .wrong-switch {
      position: relative;
      display: flex;
      align-items: center;
      padding: 4px;
      background: #f6eeee;
      border-radius: 999px;
    }
    .wrong-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: .18s;
    }
    .wrong-clear:hover:not(:disabled) { background: var(--red-soft); color: var(--red); }
    .wrong-clear:disabled { opacity: .35; cursor: default; }
    .wrong-toggle {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }
    .wrong-toggle .wrong-icon { color: var(--red); font-weight: 700; }
    .wrong-count {
      min-width: 20px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #ead9d7;
      color: #8b4a44;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .wrong-toggle.on { background: var(--red); color: #fff; box-shadow: 0 3px 10px rgba(216, 76, 76, .28); }
    .wrong-toggle.on .wrong-icon { color: #fff; }
    .wrong-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #fdeceb;
      color: #b3261e;
      font-size: 12px;
      font-weight: 700;
    }

/* ---- 移动端左右滑动切题 ---- */
@keyframes swipeInFromRight { from { opacity:.35; transform: translateX(38px); } to { opacity:1; transform:none; } }
@keyframes swipeInFromLeft  { from { opacity:.35; transform: translateX(-38px); } to { opacity:1; transform:none; } }
.question-card.swipe-anim-next { animation: swipeInFromRight .26s ease-out; }
.question-card.swipe-anim-prev { animation: swipeInFromLeft .26s ease-out; }
.swipe-hint { display:none; }
@media (max-width: 820px) {
  .swipe-hint {
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:12px; font-size:12px; color:var(--muted); letter-spacing:.04em; user-select:none;
  }
  .swipe-hint::before, .swipe-hint::after { content:""; width:18px; height:1px; background:var(--line); }
}

    /* ================= 计时练习 ================= */
    .timed-start {
      width: 100%; margin-top: 14px; border: 0; border-radius: 12px;
      padding: 11px 14px; background: var(--green); color: #fff;
      font-weight: 650; cursor: pointer; transition: .2s;
    }
    .timed-start:hover { background: var(--green-dark); }
    .timed-start:disabled { opacity: .55; cursor: default; }
    .timer-bar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px 9px 16px; border-radius: 999px;
      background: rgba(20, 28, 26, .93); color: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .28);
      z-index: 70; font-size: 13px; white-space: nowrap;
    }
    .timer-bar[hidden] { display: none; }
    .timer-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; animation: timedPulse 1.4s infinite; }
    @keyframes timedPulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .timer-label { opacity: .65; font-size: 12px; }
    #timerTotal { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: .5px; }
    #timerQuestion { font-variant-numeric: tabular-nums; }
    .timer-sep { opacity: .35; }
    #timedFinishBtn {
      border: 0; border-radius: 999px; background: #fff; color: #16201d;
      padding: 6px 13px; font-weight: 650; cursor: pointer;
    }
    .report-mask {
      position: fixed; inset: 0; z-index: 90; padding: 20px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(12, 18, 16, .5); backdrop-filter: blur(3px);
    }
    .report-mask[hidden] { display: none; }
    .report-card {
      width: min(880px, 100%);
      max-height: 86vh;                       /* 老浏览器兜底 */
      max-height: calc(100dvh - 32px);        /* 手机动态视口，保证底部圆角可见 */
      overflow: auto;
      background: #fff; border-radius: 20px; padding: 26px; position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
    }
    .report-close {
      position: absolute; right: 16px; top: 14px; width: 32px; height: 32px;
      border: 0; border-radius: 50%; background: #eef2f1; font-size: 18px; cursor: pointer;
    }
    .report-card h2 { margin: 0 0 6px; font-size: 20px; }
    .report-sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .report-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-bottom: 16px; }

 "前向通道；反馈通道", "analysis": "<p>前向通道从给定输入经控制器、被控对象到输出；反馈通道把输出量引回输入端与给定值比较。</p>", "must": true}, {"topic": "二阶系统指标", "type": "fill", "stem": "欠阻尼二阶系统单位阶跃响应中，超调量 \\(\\sigma\\)%=____；按 \\(\\pm5\\%\\) 误差时调节时间 \\(t_{s}\\)=____。", "answer": "\\(\\sigma\\%=e^{-\\frac{\\pi\\xi}{\\sqrt{1-\\xi^{2}}}}\\times100\\%\\)；\\(t_{s}=\\dfrac{3}{\\xi\\omega_{n}}\\)", "answerHtml": "\\(e^{-\\frac{\\pi\\xi}{\\sqrt{1-\\xi^{2}}}}\\times100\\%\\)；\\(\\dfrac{3}{\\xi\\omega_{n}}\\)", "analysis": "<p>超调量只由阻尼比 \\(\\xi\\) 决定；调节时间按误差带取：\\(\\pm5\\%\\) 时 \\(\\frac{3}{\\xi\\omega_{n}}\\)，\\(\\pm2\\%\\) 时 \\(\\frac{4}{\\xi\\omega_{n}}\\)。</p>"}, {"topic": "根轨迹绘制", "type": "fill", "stem": "根轨迹大部分的分离点和会合点都在实轴上，一般将根轨迹离开复平面进入实轴的点称为____。", "answer": "会合点", "answerHtml": "会合点", "analysis": "<p>根轨迹由复平面进入实轴的点称为会合点；由实轴进入复平面的点称为分离点。</p>"}, {"topic": "高阶系统", "type": "fill", "stem": "高阶系统的____由输入及系统传递函数决定，____的形式取决于传递函数的极点。", "answer": "稳态分量；瞬态分量", "answerHtml": "稳态分量；瞬态分量", "analysis": "<p>阶跃响应可分解为稳态分量和瞬态分量，瞬态分量由闭环极点决定。</p>"}, {"topic": "根轨迹绘制", "type": "fill", "stem": "根轨迹起始于开环传递函数的____，终止于开环传递函数的____或无穷远。", "answer": "极点；零点", "answerHtml": "极点；零点", "analysis": "<p>\\(n\\) 条分支始于 \\(n\\) 个开环极点，终于 \\(m\\) 个开环零点，其余 \\(n-m\\) 条趋向无穷远。</p>", "must": true}, {"topic": "频率特性", "type": "fill", "stem": "对数幅频特性曲线的纵坐标用 \\(L(\\omega)\\) 表示，\\(L(\\omega)=\\)____。", "answer": "\\(20\\lg A(\\omega)\\)", "answerHtml": "\\(20\\lg A(\\omega)\\)", "analysis": "<p>对数幅频特性 \\(L(\\omega)=20\\lg A(\\omega)\\)，单位 dB。</p>", "must": true}, {"topic": "频率特性", "type": "fill", "stem": "一阶微分环节传递函数 \\(G(s)=Ts+1\\)，其转折频率 \\(\\omega=\\)____，对数幅频特性斜率是____ dB/dec。", "answer": "\\(\\frac{1}{T}\\)；\\(+20\\)", "answerHtml": "\\(\\frac{1}{T}\\)；\\(+20\\,\\mathrm{dB/dec}\\)", "analysis": "<p>一阶微分环节在 \\(\\omega=\\frac{1}{T}\\) 处转折，斜率增加 \\(+20\\,\\mathrm{dB/dec}\\)。</p>"}, {"topic": "复合控制", "stem": "前馈补偿控制与反馈控制相结合，构成了（ ）。", "options": [["A", "复合控制"], ["B", "前馈控制"], ["C", "反馈控制"], ["D", "开环控制"]], "answer": "A", "analysis": "<p>前馈补偿与反馈控制同时使用称为复合控制。</p>", "must": true}, {"topic": "二阶系统指标", "stem": "临界阻尼二阶系统特征方程的特征根是（ ）。", "options": [["A", "复根"], ["B", "虚根"], ["C", "复数根"], ["D", "重根"]], "answer": "D", "analysis": "<p>\\(\\xi\\)=1 为临界阻尼，特征方程有两个相等的负实根。</p>"}, {"topic": "相位裕量", "stem": "工程上一般要求相位裕量在（ ）到（ ）之间。", "options": [["A", "10°，30°"], ["B", "30°，45°"], ["C", "30°，60°"], ["D", "60°，75°"]], "answer": "C", "analysis": "<p>工程上通常希望 \\(\\gamma\\) 在 30°～60° 之间，兼顾快速性与平稳性。</p>"}, {"topic": "稳态误差", "stem": "当输入为斜坡输入信号 \\(r(t)=v_{0}t\\) 时，对于Ⅰ型系统其稳态误差为（ ）。", "options": [["A", "0"], ["B", "\\(\\frac{v_{0}}{K}\\)"], ["C", "\\(K\\)"], ["D", "\\(+\\infty\\)"]], "answer": "B", "analysis": "<p>Ⅰ型系统对斜坡输入的静态速度误差系数 \\(K_{v}=K\\)，\\(e_{ss}=\\frac{v_{0}}{K_{v}}=\\frac{v_{0}}{K}\\)。</p>"}, {"topic": "频率特性", "stem": "若传递函数不含积分环节，设系统对数幅频特性低频渐近线高度为 \\(x\\) dB，则系统增益 \\(K\\)=（ ）。", "options": [["A", "\\(10^{\\frac{x}{20}}\\)"], ["B", "\\(10^{x}\\)"], ["C", "\\(\\lg x\\)"], ["D", "\\(\\lg(20x)\\)"]], "answer": "A", "analysis": "<p>低频段 \\(L=20\\lg K-20\\lg\\omega\\)，高度 \\(x=20\\lg K\\)，故 \\(K=10^{\\frac{x}{20}}\\)。</p>"}, {"topic": "二阶系统指标", "stem": "在典型二阶系统中，\\(\\xi\\) 越大，则 \\(\\gamma\\) 及系统相对稳定性如何变化（ ）。", "options": [["A", "\\(\\gamma\\) 越大，相对稳定性越高"], ["B", "\\(\\gamma\\) 越大，相对稳定性越低"], ["C", "\\(\\gamma\\) 越小，相对稳定性越高"], ["D", "\\(\\gamma\\) 越小，相对稳定性越低"]], "answer": "A", "analysis": "<p>\\(\\xi\\) 增大时超调减小、相位裕量 \\(\\gamma\\) 增大，相对稳定性提高。</p>"}, {"topic": "校正", "stem": "若已知某串联校正装置的传递函数为 \\(G_{c}(s)=2s\\)，则它是一种（ ）。", "options": [["A", "相位滞后校正"], ["B", "相位超前校正"], ["C", "微分调节器"], ["D", "积分调节器"]], "answer": "C", "analysis": "<p>\\(G_{c}(s)=2s\\) 为纯微分环节，属微分调节器，提供超前相角、增加阻尼。</p>"}, {"topic": "采样系统", "stem": "如果系统有连续信号，也有离散信号，且离散信号为脉冲序列，则此系统为（ ）。", "options": [["A", "连续系统"], ["B", "离散系统"], ["C", "非线性系统"], ["D", "采样系统"]], "answer": "D", "analysis": "<p>同时存在连续信号和离散信号的系统称为采样系统。</p>", "must": true}, {"topic": "线性系统性质", "type": "fill", "stem": "线性系统必须同时满足____和____两个性质；输入正弦信号时输出为同频率正弦，称为____。", "answer": "齐次性；叠加性；频率保持性", "answerHtml": "齐次性；叠加性；频率保持性", "analysis": "<p>线性系统满足齐次性和叠加性，并具有频率保持性，可用传递函数描述。</p>", "must": true}, {"topic": "结构图", "stem": "动态结构图中，把同一信号分成多路传出的符号是（ ）。", "options": [["A", "信号线"], ["B", "引出点"], ["C", "比较点"], ["D", "方框"]], "answer": "B", "analysis": "<p>引出点把同一信号分成几路；比较点对信号求和或求差；方框表示环节传递函数。</p>", "must": true}, {"topic": "传递函数定义", "type": "fill", "stem": "反馈控制系统的三种传递函数是____、____和____。", "answer": "开环传递函数；闭环传递函数；误差传递函数", "answerHtml": "开环传递函数；闭环传递函数；误差传递函数", "analysis": "<p>三者分母相同，均为 1+\\(G(s)\\)\\(H(s)\\)，即闭环特征多项式。</p>", "must": true}, {"topic": "梅森公式", "stem": "梅森增益公式中，系统传递函数 \\(P\\)=（ ）。", "options": [["A", "\\(\\frac{\\Delta}{\\Sigma P_{k}\\Delta_{k}}\\)"], ["B", "\\(\\Sigma P_{k}\\Delta_{k}\\)"], ["C", "\\(\\frac{\\Sigma P_{k}}{\\Delta}\\)"], ["D", "\\(\\frac{\\Sigma P_{k}\\Delta_{k}}{\\Delta}\\)"]], "answer": "D", "analysis": "<p>梅森公式为 \\(P=\\frac{\\Sigma P_{k}\\Delta_{k}}{\\Delta}\\)，其中 \\(P_{k}\\) 为第 k 条前向通道增益，\\(\\Delta\\) 为特征式，\\(\\Delta_{k}\\) 为余子式。</p>"}, {"topic": "根轨迹绘制", "type": "fill", "stem": "实轴上某区段成为根轨迹段的充要条件是该区段右侧实数开环零、极点总数为____。", "answer": "奇数", "answerHtml": "奇数", "analysis": "<p>实轴段判据：区段右侧实数开环零、极点个数之和为奇数时，该区段属于根轨迹。</p>"}, {"topic": "根轨迹绘制", "type": "fill", "stem": "\\(n\\) 阶系统有 \\(m\\) 个有限零点时，根轨迹渐近线有____条；渐近线与实轴交点 \\(\\sigma_{a}\\)=____。", "answer": "\\(n-m\\)；\\(\\sigma_{a}=\\frac{\\Sigma p_{i}-\\Sigma z_{i}}{n-m}\\)", "answerHtml": "\\(n-m\\)；\\(\\frac{\\Sigma p_{i}-\\Sigma z_{i}}{n-m}\\)", "analysis": "<p>\\(n-m\\) 条渐近线与实轴交于 \\(\\sigma_{a}=\\frac{\\Sigma p_{i}-\\Sigma z_{i}}{n-m}\\)，夹角为 \\(\\pm\\frac{(2k+1)\\pi}{n-m}\\)。</p>"}, {"topic": "稳态误差", "stem": "下列措施中，能减小稳态误差但会使稳定性变差的是（ ）。", "options": [["A", "提高开环增益"], ["B", "减小开环增益"], ["C", "降低系统型别"], ["D", "减小反馈深度"]], "answer": "A", "analysis": "<p>提高开环增益可减小稳态误差，但相位裕量减小、稳定性变差，需要折中。</p>", "must": true}, {"topic": "劳斯判据", "stem": "用劳斯判据时，若劳斯表某行首列元素为零而该行不全为零，应（ ）。", "options": [["A", "直接判定系统不稳定"], ["B", "用足够小的正数 \\(\\varepsilon\\) 代替该元素继续计算"], ["C", "用上一行构造辅助方程"], ["D", "重新排列特征方程"]], "answer": "B", "analysis": "<p>首列出现零时用足够小的正数 \\(\\varepsilon\\) 代替，继续列表，最后令 \\(\\varepsilon\\)\\(\\to\\)0 判断符号变化。</p>"}, {"topic": "奈奎斯特判据", "type": "fill", "stem": "奈奎斯特判据中 \\(Z\\)=\\(P\\)−2N，其中 \\(Z\\) 表示____，\\(P\\) 表示____，\\(N\\) 表示____。", "answer": "闭环右半平面极点数；开环右半平面极点数；包围 \\((-1,j0)\\) 的圈数（逆时针为正）", "answerHtml": "闭环右半平面极点数；开环右半平面极点数；包围 \\((-1,j0)\\) 的圈数（逆时针为正）", "analysis": "<p>\\(Z\\)=0 时闭环稳定；\\(Z\\)>0 表示闭环有右半平面极点，系统不稳定。</p>", "must": true}, {"topic": "幅值裕量", "type": "fill", "stem": "幅值裕量 \\(K_{g}\\)=____，其中 \\(\\omega_{g}\\) 称为____频率。", "answer": "\\(K_{g}=\\frac{1}{|G(j\\omega_{g})|}\\)；相位穿越", "answerHtml": "\\(\\frac{1}{|G(j\\omega_{g})|}\\)；相位穿越", "analysis": "<p>\\(\\omega_{g}\\) 为相角等于 −180° 的频率；\\(K_{g}\\)>1（dB 值为正）时闭环稳定。</p>"}, {"topic": "超前校正", "stem": "串联超前校正的主要作用是（ ）。", "options": [["A", "提高相位裕量和快速性"], ["B", "降低稳态误差"], ["C", "提高抗高频干扰能力"], ["D", "提高系统型别"]], "answer": "A", "analysis": "<p>超前校正提供正相角，提高相位裕量和截止频率，改善平稳性和快速性。</p>", "must": true}, {"topic": "采样定理", "type": "fill", "stem": "采样定理要求采样角频率 \\(\\omega_{s}\\) 与被采样信号最高频率 \\(\\omega_{max}\\) 的关系为____，否则会出现____现象。", "answer": "\\(\\omega_{s}\\ge2\\omega_{max}\\)；频率混叠", "answerHtml": "\\(\\omega_{s}\\ge2\\omega_{max}\\)；频率混叠", "analysis": "<p>采样频率过低时高频分量折叠到低频段，产生频率混叠，无法恢复原信号。</p>"}, {"topic": "保持器", "type": "fill", "stem": "零阶保持器采用____外推规律，其传递函数 \\(G_{h}(s)=\\)____。", "answer": "零阶；\\(G_{h}(s)=\\frac{1-e^{-Ts}}{s}\\)", "answerHtml": "零阶；\\(\\frac{1-e^{-Ts}}{s}\\)", "analysis": "<p>零阶保持器把采样值保持一个采样周期，简单且滞后小，是采样系统最常用的保持器。</p>"}, {"topic": "性能指标", "type": "fill", "stem": "控制系统的性能指标通常包括____、____和____三个方面。", "answer": "稳定性；快速性；准确性", "answerHtml": "稳定性；快速性；准确性", "analysis": "<p>稳定性反映系统能否正常工作；快速性用调节时间等衡量；准确性用稳态误差衡量。</p>", "must": true}, {"topic": "误差传递函数", "type": "fill", "stem": "反馈控制系统的误差传递函数 \\(\\frac{E(s)}{R(s)}=\\)____；闭环特征方程为____。", "answer": "\\(\\frac{1}{1+G(s)H(s)}\\)；\\(1+G(s)H(s)=0\\)", "answerHtml": "\\(\\frac{1}{1+G(s)H(s)}\\)；\\(1+G(s)H(s)=0\\)", "analysis": "<p>误差传递函数等于 1 除以 1 加开环传递函数；令分母为 0 即得闭环特征方程。</p>"}, {"topic": "稳态误差", "type": "fill", "stem": "Ⅱ 型系统在单位斜坡输入 \\(r(t)=t\\) 作用下的静态速度误差系数 \\(K_{v}=\\)____，稳态误差 \\(e_{ss}=\\)____。", "answer": "\\(K_{v}=\\infty\\)；\\(e_{ss}=0\\)", "answerHtml": "\\(\\infty\\)；\\(0\\)", "analysis": "<p>Ⅱ 型系统开环含两个积分环节，\\(K_{v}=\\lim_{s\\to0}sG(s)=\\infty\\)，故对斜坡输入无差；0 型为 \\(\\infty\\)、Ⅰ 型为 \\(\\frac{v_{0}}{K}\\)。</p>"}, {"topic": "二阶系统指标", "type": "fill", "stem": "欠阻尼二阶系统峰值时间 \\(t_{p}=\\)____；上升时间 \\(t_{r}=\\)____（用 \\(\\omega_{d}\\)、\\(\\beta\\) 表示，\\(\\beta=\\arccos\\xi\\)）。", "answer": "\\(t_{p}=\\dfrac{\\pi}{\\omega_{d}}\\)；\\(t_{r}=\\dfrac{\\pi-\\beta}{\\omega_{d}}\\)", "answerHtml": "\\(\\dfrac{\\pi}{\\omega_{d}}\\)；\\(\\dfrac{\\pi-\\beta}{\\omega_{d}}\\)", "analysis": "<p>峰值时间 \\(t_{p}=\\frac{\\pi}{\\omega_{d}}\\)；上升时间 \\(t_{r}=\\frac{\\pi-\\beta}{\\omega_{d}}\\)，其中 \\(\\omega_{d}=\\omega_{n}\\sqrt{1-\\xi^{2}}\\)，\\(\\beta=\\arccos\\xi\\)。</p>"}, {"topic": "频率特性", "type": "fill", "stem": "积分环节 \\(\\frac{1}{s}\\) 的对数幅频特性斜率为____ dB/dec；惯性环节 \\(\\frac{1}{Ts+1}\\) 在转折频率 \\(\\omega=\\frac{1}{T}\\) 处的幅值为____ dB。", "answer": "\\(-20\\)；\\(-3\\)", "answerHtml": "\\(-20\\)；\\(-3\\)", "analysis": "<p>积分环节 \\(L=-20\\lg\\omega\\)，斜率 \\(-20\\) dB/dec，过 \\(\\omega=1\\) 处为 0 dB；惯性环节在转折频率处 \\(L=-20\\lg\\sqrt{2}\\approx-3\\) dB，高频段 \\(-20\\) dB/dec。</p>"}, {"topic": "保持器", "type": "fill", "stem": "一阶保持器按____外推规律复现信号，其传递函数 \\(G_{h}(s)=\\)____。", "answer": "线性；\\(G_{h}(s)=T(1+Ts)\\left[\\frac{1-e^{-Ts}}{Ts}\\right]^{2}\\)", "answerHtml": "线性；\\(T(1+Ts)\\left[\\dfrac{1-e^{-Ts}}{Ts}\\right]^{2}\\)", "analysis": "<p>一阶保持器用相邻两个采样点连线（线性外推），精度高于零阶保持器，但相位滞后更大。</p>"}, {"topic": "性能指标", "stem": "控制系统的性能指标通常包括（　）。", "options": [["A", "稳定性、快速性、准确性"], ["B", "稳定性、经济性、可靠性"], ["C", "快速性、准确性、抗扰性"], ["D", "稳定性、连续性、可维修性"]], "answer": "A", "analysis": "<p>稳、快、准是三大基本性能指标。</p>"}, {"topic": "性能指标", "stem": "快速性主要用（　）衡量。", "options": [["A", "调节时间、上升时间等"], ["B", "稳态误差"], ["C", "超调量"], ["D", "幅值裕量"]], "answer": "A", "analysis": "<p>快速性看过渡过程长短，用 tr、tp、ts 衡量。</p>"}, {"topic": "性能指标", "stem": "系统稳定性是指（　）。", "options": [["A     const paperData = {"short": [{"stem": "自动控制系统按不同角度如何分类？", "answer": "按线性分：线性、非线性；按时变分：定常、时变；按信号分：连续、离散；按给定值分：恒值、随动、程序控制。", "bookOrder": 1, "kind": "简答", "paper": "背诵版", "hot": "重中之重", "must": true, "mnemonic": "巧记：四个角度——线性、时变、连续、给定值"}, {"stem": "对控制系统的性能要求有哪些？", "answer": "快速性：过渡过程短，\\(t_{r}\\)、\\(t_{p}\\)、\\(t_{s}\\) 小；准确性：稳态误差 \\(e_{ss}\\) 小；稳定性：受扰后能回到原平衡状态。", "bookOrder": 2, "kind": "简答", "paper": "背诵版", "hot": "重中之重", "must": true, "mnemonic": "巧记：三个字——快、准、稳"}, {"stem": "反馈控制系统有哪三种传递函数？", "answer": "闭环 \\(\\Phi(s)=\\dfrac{C(s)}{R(s)}=\\dfrac{G(s)}{1+G(s)H(s)}\\)；扰动 \\(\\Phi_{n}(s)=\\dfrac{C(s)}{N(s)}\\)，令 \\(R=0\\)；误差 \\(\\Phi_{e}(s)=\\dfrac{E(s)}{R(s)}=\\dfrac{1}{1+G(s)H(s)}\\)。", "bookOrder": 3, "kind": "简答", "paper": "背诵版", "hot": "重中之重", "must": true}, {"stem": "闭环极点位置与系统性能有什么关系？", "answer": "实部 \\(-\\zeta\\omega_{n}\\) 决定调节时间 \\(t_{s}\\)；虚部 \\(\\omega_{d}\\) 决定振荡频率与峰值时间；模 \\(\\omega_{n}\\) 是无阻尼自然振荡频率；夹角 \\(\\beta\\) 决定超调量 \\(\\sigma\\%\\)；左半平面稳定，右半平面不稳定。", "bookOrder": 4, "kind": "简答", "paper": "背诵版", "hot": "重中之重", "must": true, "mnemonic": "巧记：实部管快慢、虚部管振荡、模是 \\(\\omega_{n}\\)、夹角 \\(\\beta\\) 管超调、左右定稳定"}, {"stem": "主导极点的定义及作用是什么？", "answer": "定义：离虚轴最近、衰减最慢的那一对或那一个闭环极点，与其他极点距离近 5 倍以上且附近无闭环零点，其余极点衰减快、只影响起始细节；作用：决定动态过程，可降阶近似成一阶或二阶系统，越靠近虚轴则 \\(t_{s}\\) 越长、振荡越明显。", "bookOrder": 5, "kind": "简答", "paper": "背诵版", "hot": "重中之重", "must": true}, {"stem": "幅频特性的三个频段分别与系统性能有什么关系？", "answer": "低频段：反映稳态精度，增益越高、型别越高，\\(e_{ss}\\) 越小；中频段：反映稳定性与快速性，\\(\\omega_{c}\\) 越大响应越快，\\(\\gamma\\) 越大越平稳；高频段：反映抗高频干扰能力，衰减越快越好。", "bookOrder": 6, "kind": "简答", "paper": "背诵版", "hot": "重中之重", "must": true, "mnemonic": "巧记：低频管准、中频管稳和快、高频管抗干扰"}, {"stem": "超前校正装置的设计要点是什么？", "answer": "装置 \\(G_{c}(s)=\\dfrac{1+aTs}{1+Ts}\\)，\\(a>1\\)；相位超前使相位裕量 \\(\\gamma\\) 增大，平稳性好；正斜率段使剪切频率 \\(\\omega_{c}\\) 增大，响应快；最大超前角 \\(\\varphi_{m}=\\arcsin\\dfrac{a-1}{a+1}\\)，出现在 \\(\\omega_{m}=\\dfrac{1}{T\\sqrt{a}}\\)。", "bookOrder": 7, "kind": "简答", "paper": "背诵版", "hot": "重中之重", "must": true, "mnemonic": "巧记：抬相位裕量保稳、抬剪切频率保快"}, {"paper": 5, "kind": "简答", "stem": "系统的稳态误差由什么确定？改善系统稳态精度有哪些常用方法？", "answer": "稳态误差由系统的结构（型别，即开环传递函数中积分环节的个数）、参数（开环增益 \\(K\\)）和输入信号的形式（阶跃、斜坡、加速度及其大小）共同决定。改善稳态精度的常用方法：① 增大开环增益 \\(K\\)（受稳定性限制）；② 增加积分环节、提高系统型别（如 0 型→I 型→II 型）；③ 采用按输入或按扰动补偿的复合控制；④ 增大扰动作用点之前前向通道的增益，以减小扰动引起的误差。", "solution": "", "bookOrder": 8, "hot": "重中之重", "must": true, "mnemonic": "巧记：型别定台阶、增益定大小、输入定形状"}, {"paper": 5, "kind": "简答", "stem": "PID 控制器是串联还是并联在系统的前向通道中？三个环节各起什么作用？", "answer": "PID 控制器一般串联在系统的前向通道中，属串联校正。比例（P）环节提高响应速度、减小稳态误差；积分（I）环节提高系统型别、消除稳态误差，但对稳定性不利；微分（D）环节提供相位超前、改善动态性能、增大相位裕量。", "solution": "", "bookOrder": 9, "hot": "重中之重", "must": true}, {"paper": 6, "stem": "控制系统中有哪些典型环节？其传递函数的表达式是什么？", "answer": "常见典型环节有六种：比例环节、惯性环节、积分环节、微分环节、振荡环节、时滞环节；其传递函数分别为：比例 \\(K\\)，惯性 \\(\\frac{K}{Ts+1}\\)，积分 \\(\\frac{K}{s}\\)，微分 \\(Ks\\)，振荡 \\(\\frac{\\omega_{n}^{2}}{s^{2}+2\\zeta\\omega_{n}s+\\omega_{n}^{2}}\\)，时滞 \\(e^{-\\tau s}\\)。", "solution": "<p class=\"step\">比例环节：输出与输入成正比，无惯性、无延迟，传递函数为 \\(K\\)。</p><p class=\"step\">惯性环节：含一个储能元件，输出不能突变，传递函数为 \\(\\frac{K}{Ts+1}\\)（T 为时间常数）。</p><p class=\"step\">积分环节：输出是输入的积分，具有记忆和滞后作用，传递函数为 \\(\\frac{K}{s}\\)。</p><p class=\"step\">微分环节：输出反映输入的变化率，起超前作用，传递函数为 \\(Ks\\)。</p><p class=\"step\">振荡环节：含两个储能元件，阶跃响应可能振荡，传递函数为 \\(\\frac{\\omega_{n}^{2}}{s^{2}+2\\zeta\\omega_{n}s+\\omega_{n}^{2}}\\)。</p><p class=\"step\">时滞（延迟）环节：输出滞后输入一段时间 τ，传递函数为 \\(e^{-\\tau s}\\)。</p>", "bookOrder": 10, "bookPage": "第 2 章"}, {"paper": 6, "stem": "系统动态结构图的基本符号组成及等效变换的方法有哪些？", "answer": "基本符号有四种：信号线、引出点、比较点、方框；等效变换方法有：串联、并联、反馈连接，以及比较点和引出点的前后移动与互换。", "solution": "<p class=\"step\">信号线表示信号的传递方向；引出点（分支点）把同一信号分成几路；比较点（综合点）对信号求和或求差；方框内写环节的传递函数。</p><p class=\"step\">串联连接：各环节依次相乘，等效为一个环节。</p><p class=\"step\">并联连接：各支路传递函数相加。</p><p class=\"step\">反馈连接：按闭环传递函数公式化简（前向传递函数除以 1 加开环传递函数）。</p><p class=\"step\">比较点和引出点可以前移或后移：移动时需乘或除所跨越环节的传递函数；相邻比较点可互换，相邻引出点可互换，但引出点与比较点一般不能随意互换。</p>", "bookOrder": 11, "bookPage": "P30"}, {"paper": 5, "stem": "相位裕量和幅值裕量的定义和算式是什么？", "answer": "相位裕量：在幅值等于 1 的频率处，相角距 \\(-180^{\\circ}\\) 的余量，\\(\\gamma=180^{\\circ}+\\angle G(j\\omega_{c})\\)；幅值裕量：在相角等于 \\(-180^{\\circ}\\) 的频率处，幅值再放大多少倍才到 1，\\(K_{g}=\\frac{1}{|G(j\\omega_{g})|}\\)。\\(\\gamma>0\\)、\\(K_{g}>1\\) 时闭环稳定。 工程上要求 \\(\\gamma>0\\)，一般取 \\(30^{\\circ}\\sim60^{\\circ}\\)；\\(\\gamma\\) 越大相对稳定性越好，过大则影响快速性。", "solution": "", "bookOrder": 12}, {"paper": 5, "kind": "简答", "stem": "线性系统必须满足哪两个性质？输入正弦信号时输出有什么特点？", "answer": "线性系统必须同时满足叠加性和齐次性（即满足叠加原理）。输入正弦信号时，输出仍为同频率的正弦信号，只是幅值和相位发生变化（频率不变）。", "solution": "", "bookOrder": 13}, {"paper": 5, "kind": "简答", "stem": "控制系统稳定的充分必要条件是什么？", "answer": "闭环系统稳定的充分必要条件是：闭环传递函数的全部极点（即闭环特征方程的根）都位于 \\(s\\) 平面的左半平面（实部小于 0）；只要有一个极点落在右半平面，系统就不稳定。", "solution": "", "bookOrder": 14}, {"paper": 5, "kind": "简答", "stem": "对数幅频特性 \\(L(\\omega)\\) 的表达式是什么？横、纵坐标各如何分度？", "answer": "对数幅频特性 \\(L(\\omega)=20\\lg|G(j\\omega)|\\)（单位 dB）；横坐标按 \\(\\lg\\omega\\) 均匀分度（十倍频程），纵坐标按 dB 线性分度。", "solution": "", "bookOrder": 15}, {"paper": 5, "kind": "简答", "stem": "一阶保持器的外推规律和传递函数是什么？", "answer": "一阶保持器按线性外推规律复现信号（用相邻两个采样点的连线外推）；传递函数 \\(G_{h}(s)=T(1+Ts)\\left[\\dfrac{1-e^{-Ts}}{Ts}\\right]^{2}\\)。其精度高于零阶保持器，但相位滞后更大。", "solution": "", "bookOrder": 16}, {"paper": 5, "kind": "简答", "stem": "频域里判断系统稳定性的奈氏判据是什么？", "answer": "设开环系统在 s 右半平面有 P 个极点，则闭环稳定的充要条件是：当 ω 由 0→+∞ 变化时，开环奈氏曲线在 (−∞,−1) 负实轴段上逆时针包围 (−1,j0) 点的圈数为 N=P/2（等价于 Z=P−2N=0，闭环右半平面极点数为 0）。", "solution": "", "bookOrder": 17}, {"paper": 5, "kind": "简答", "stem": "采样系统稳定的充要条件是什么？z 与 s 有什么关系？", "answer": "采样系统闭环稳定的充要条件是：闭环脉冲传递函数的全部极点都位于 z 平面的单位圆内；z 与 s 的关系为 \\(z=e^{Ts}\\)，s 左半平面映射为 z 平面单位圆内。", "solution": "", "bookOrder": 18}], "calc": [{"paper": 5, "kind": "计算", "stem": "闭环系统的特征方程为 \\(s^{3}+20s^{2}+9s+200=0\\)，试用劳斯判据判断系统的稳定性。", "answer": "劳斯表第一列出现负值 −1，符号改变 2 次，说明有 2 个右半平面根，系统不稳定。", "solution": "<p class=\"step\">特征方程 \\(s^{3}+20s^{2}+9s+200=0\\)，按降幂排列系数：<br>\\(a_{3}=1\\)，\\(a_{2}=20\\)，\\(a_{1}=9\\)，\\(a_{0}=200\\)<br>列劳斯表：</p><div class=\"routh-wrap\"><table class=\"routh\"><thead><tr><th></th><th>第 1 列</th><th>第 2 列</th></tr></thead><tbody><tr><th>s<sup>3</sup></th><td>1</td><td>9</td></tr><tr><th>s<sup>2</sup></th><td>20</td><td>200</td></tr><tr><th>s<sup>1</sup></th><td>−1</td><td>0</td></tr><tr><th>s<sup>0</sup></th><td>200</td><td>0</td></tr></tbody></table></div><p class=\"step\">\\(s^{1}\\) 行按劳斯公式计算：\\(\\dfrac{20\\times9-1\\times200}{20}=-1\\)。</p><p class=\"step-sub\" style=\"margin:10px 0 0 60px;line-height:2;\">\\(s^{0}\\) 行 \\(s^{1}\\)、\\(s^{2}\\) 两行递推：\\(\\dfrac{(-1)\\times200-20\\times0}{-1}=200\\)，即原特征方程的常数项 \\(a_{0}=200\\)。</p><p class=\"step\">第一列 1、20、−1、200，符号改变 2 次，故有两个正实部根，系统不稳定。</p><p style=\"margin:12px 0 0 40px;line-height:2;font-weight:700;color:#0b9f7a;\">所以 劳斯表第一列符号改变 2 次，闭环系统不稳定。</p>", "hot": "重中之重", "must": true}, {"paper": 5, "kind": "计算", "stem": "闭环系统的特征方程为 \\(s^{4}+8s^{3}+18s^{2}+16s+5=0\\)，试用劳斯判据判断系统的稳定性。", "answer": "劳斯表第一列全为正值（1、8、16、\\(\\dfrac{27}{2}\\)、5），无符号改变，故无右半平面根，系统稳定。", "solution": "<p class=\"step\">特征方程 \\(s^{4}+8s^{3}+18s^{2}+16s+5=0\\)，按降幂排列系数：<br>\\(a_{4}=1\\)，\\(a_{3}=8\\)，\\(a_{2}=18\\)，\\(a_{1}=16\\)，\\(a_{0}=5\\)<br>列劳斯表：</p><div class=\"routh-wrap\"><table class=\"routh\"><thead><tr><th></th><th>第 1 列</th><th>第 2 列</th><th>第 3 列</th></tr></thead><tbody><tr><th>s<sup>4</sup></th><td>1</td><td>18</td><td>5</td></tr><tr><th>s<sup>3</sup></th><td>8</td><td>16</td><td>0</td></tr><tr><th>s<sup>2</sup></th><td>16</td><td>5</td><td>0</td></tr><tr><th>s<sup>1</sup></th><td>\\(\\dfrac{27}{2}\\)</td><td>0</td><td>0</td></tr><tr><th>s<sup>0</sup></th><td>5</td><td>0</td><td>0</td></tr></tbody></table></div><p class=\"step\">\\(s^{2}\\) 行：\\(\\dfrac{8\\times18-1\\times16}{8}=16\\)，\\(\\dfrac{8\\times5-0}{8}=5\\)。</p><p class=\"step\">\\(s^{1}\\) 行：\\(\\dfrac{16\\times16-8\\times5}{16}=\\dfrac{27}{2}\\)。</p><p class=\"step-sub\" style=\"margin:10px 0 0 60px;line-height:2;\">\\(s^{0}\\) 行 \\(s^{1}\\)、\\(s^{2}\\) 两行递推：\\(\\dfrac{\\frac{27}{2}\\times5-16\\times0}{\\frac{27}{2}}=5\\)，即原特征方程的常数项 \\(a_{0}=5\\)。</p><p class=\"step\">第一列 1、8、16、\\(\\dfrac{27}{2}\\)、5 全为正，无符号改变，说明没有右半平面根，系统稳定。</p><p style=\"margin:12px 0 0 40px;line-height:2;font-weight:700;color:#0b9f7a;\">则 劳斯表第一列全为正、无符号改变，闭环系统稳定。</p>", "hot": "重中之重", "must": true}, {"paper": 6, "kind": "综合", "stem": "已知系统的开环传递函数为 \\(G(s)H(s)=\\frac{K_{r}(s+2)}{s(s+1)}\\)（\\(K_{r}>0\\)）。(1) 画出系统的根轨迹，标出分离点和会合点；(2) 当增益 \\(K_{r}\\) 为何值时，复数特征根的实部为 −2？求出此根。", "answer": "实轴段 \\((-∞,-2]\\) 与 \\([-1,0]\\)；分离点 \\(s=-2+\\sqrt{2}≈-0.59\\)，会合点 \\(s=-2-\\sqrt{2}≈-3.41\\)；实部为 −2 时 \\(K_{r}=3\\)，特征根 \\(s=-2±j\\sqrt{2}\\)。", "solution": "<div class=\"subq\"><p class=\"subq-title\">（1）根轨迹</p><p class=\"step\">开环极点与开环零点：</p><p class=\"step-sub\" style=\"margin:10px 0 0 60px;line-height:2;\">开环极点：令分母 \\(s(s+1)=0\\)，得 \\(0\\)、\\(-1\\)</p><p class=\"step-sub\" style=\"margin:4px 0 0 60px;line-height:2;\">开环零点：令分子 \\(s+2=0\\)，得 \\(-2\\)。</p><p class=\"step-sub\" style=\"margin:6px 0 0 60px;line-height:2;\">分子前的增益 \\(K_{r}\\) 只是根轨迹的参变量，不影响零、极点位置</p><p class=\"step\">实轴根轨迹段：右侧开环零、极点总数为奇数的线段为根轨迹，故为 \\((-\\infty,-2]\\) 与 \\([-1,0]\\)；渐近线沿负实轴。</p><p class=\"step\">复数段为圆：根轨迹上的点必须满足相角条件<br>\\(\\angle(s+2)-\\angle s-\\angle(s+1)=\\pm180^{\\circ}\\)；<br>把 \\(s=x+jy\\) 代入这条相角条件，整理后得到 \\((x+2)^{2}+y^{2}=2\\)，<br>也就是以零点 \\(-2\\) 为圆心、半径 \\(\\sqrt{2}\\) 的圆，圆与实轴的两个交点正是分离点 \\(-0.59\\) 和会合点 \\(-3.41\\)。</p><p class=\"step-sub\" style=\"margin:10px 0 0 60px;line-height:2;\">考试时可直接记结论：两极点 + 一个零点时，复数段是以该零点为圆心的圆（本题半径 \\(\\sqrt{2}\\)），不必每次从头推导。</p><p class=\"step\">按根轨迹作图规则画出根轨迹：</p><figure class=\"exam-fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4NjAgNDgwIiB3aWR0aD0iODYwIiBoZWlnaHQ9IjQ4MCIgZm9udC1mYW1pbHk9IlRpbWVzIE5ldyBSb21hbiwgU2ltU3VuLCBzZXJpZiI+CjxkZWZzPjxtYXJrZXIgaWQ9ImEiIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSIxMCIgcmVmWD0iOCIgcmVmWT0iMy4yIiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wLDAgTDgsMy4yIEwwLDYuNCB6IiBmaWxsPSIjMWExYTFhIi8+PC9tYXJrZXI+PC9kZWZzPgo8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZmZmIi8+CjxwYXRoIGQ9Ik0xMTAsMjE1IEw  \\(n=3\\) 为开环极点个数（\\(0,-1,-3\\)），\\(m=0\\) 为开环零点个数（无零点）。</p><p class=\"step\">方向：沿与实轴成 \\(\\dfrac{(2k+1)\\pi}{3}\\) 的方向（即 \\(\\pm60^{\\circ}\\)、\\(180^{\\circ}\\)）趋向无穷远。</p><p class=\"subq-title\">实轴的交点及夹角</p><p class=\"step\">交点：\\(\\sigma_{a}=\\dfrac{0-1-3}{3}=-\\dfrac{4}{3}\\)。</p><p class=\"step\">夹角：\\(\\varphi_{a}=\\dfrac{(2k+1)\\pi}{3}=\\pm60^{\\circ},\\ 180^{\\circ}\\)。</p></div><div class=\"subq\"><p class=\"subq-title\">（2）分离点</p><p class=\"step\">特征方程 \\(s(s+1)(s+3)+K=0\\)，得 \\(K=-(s^{3}+4s^{2}+3s)\\)。</p><p class=\"step\">令 \\(\\dfrac{\\mathrm{d}K}{\\mathrm{d}s}=-(3s^{2}+8s+3)=0\\)，解得 \\(s_{1,2}=\\dfrac{-4\\pm\\sqrt{7}}{3}\\)，即 \\(-0.451\\) 与 \\(-2.215\\)。</p><p class=\"step\">只有 \\(s=-0.451\\) 落在实轴根轨迹段 \\([-1,0]\\) 上，为分离点；\\(-2.215\\) 不在根轨迹上，舍去。</p></div><div class=\"subq\"><p class=\"subq-title\">（3）与虚轴交点</p><p class=\"step\">特征方程 \\(s^{3}+4s^{2}+3s+K=0\\)，列劳斯表：\\(s^{3}\\) 行 \\(1,\\ 3\\)，\\(s^{2}\\) 行 \\(4,\\ K\\)，\\(s^{1}\\) 行 \\(\\dfrac{12-K}{4}\\)，\\(s^{0}\\) 行 \\(K\\)。</p><p class=\"step\">临界稳定条件 \\(\\dfrac{12-K}{4}=0\\)，得 \\(K=12\\)；由辅助方程 \\(4s^{2}+K=0\\) 得 \\(s=\\pm j\\sqrt{3}\\)。</p><p class=\"step\">根轨迹图：起于 \\(0,-1,-3\\)，实轴 \\([-1,0]\\) 上在 \\(-0.451\\) 处分离后进入复平面，沿 \\(\\pm60^{\\circ}\\) 渐近线趋向无穷远，在 \\(K=12\\) 时穿过 \\(s=\\pm j\\sqrt{3}\\)，\\(K>12\\) 后进入右半平面。</p></div><p style=\"margin:12px 0 0 40px;line-height:2;font-weight:700;color:#0b9f7a;\">因此 实轴根轨迹段为 \\([-1,0]\\)、\\((-\\infty,-3]\\)；分离点 \\(s\\approx-0.451\\)；与虚轴交点 \\(s=\\pm j\\sqrt{3}\\)，临界增益 \\(K=12\\)。</p>", "hot": "重中之重", "must": true}, {"paper": 6, "kind": "综合", "stem": "<p>一闭环系统的动态结构图如下。</p><p>（1）当 \\(R(s)=\\frac{1}{s}\\)、超调量 \\(\\sigma\\%=20\\%\\)、调节时间 \\(t_{s}=1.8\\,\\mathrm{s}\\)（\\(\\Delta=5\\%\\)）时，试确定参数 \\(K_{1}\\) 和 \\(\\tau\\) 的值；</p><p>（2）当输入信号分别为 \\(r(t)=\\varepsilon(t)\\)、\\(r(t)=t\\)、\\(r(t)=\\frac{1}{2}t^{2}\\) 时，试求系统的稳态误差。</p><figure class=\"exam-fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDYwIDQyMCIgd2 \frac{K_{1}}{\\tau K_{1}}=\\frac{1}{\\tau}\\approx4.0\\)，\\(e_{ss}=\\frac{1}{K_{v}}\\approx0.25\\)。</p><p class=\"step\">抛物线输入 \\(r(t)=\\frac{1}{2}t^{2}\\)：I 型系统的加速度误差为无穷大，\\(e_{ss}=\\infty\\)。</p></div><p style=\"margin:12px 0 0 40px;line-height:2;font-weight:700;color:#0b9f7a;\">故 \\(K_{1}\\approx13.4\\)、\\(\\tau\\approx0.25\\)；阶跃、斜坡、抛物线输入下的稳态误差分别为 \\(0\\)、\\(0.25\\)、\\(\\infty\\)。</p>", "must": true, "hot": "重中之重"}, {"paper": 5, "kind": "计算", "stem": "已知系统的 \\(G(jω)H(jω)\\) 曲线如下图所示，其中 \\(P\\) 为开环不稳定极点的个数（\\(P=2\\)），试用奈奎斯特稳定判据判断系统的稳定性。<figure class=\"exam-fig\"><img src=\"data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MzEiIGhlaWdodD0iNDE2IgogICAgIHZpZXdCb3g9IjAgMCA4MzEgNDE2IiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idGl0bGUgZGVzYyI+CiAgPHRpdGxlIGlkPSJ0aXRsZSI+TnlxdWlzdCBkaWFncmFtLCBQID0gMjwvdGl0bGU+CiAgPGRlc2MgaWQ9ImRlc2MiPkNsZWFuIHZlY3RvciByZWRyYXcgb2YgYSBOeXF1aXN0IHBsb3Qgd2l0aCBhIGxhcmdlIGxvb3AgYXJvdW5kIC0xCiAgYW5kIGEgc21hbGxlciBsb29wIG5lYXIgdGhlIG9yaWdpbiwgbGFiZWxsZWQgUD0yLCBvbWVnYSBmcm9tIDAgdG8gaW5maW5pdHkuPC9kZXNjPgogIDxnIHNoYXBlLXJlbmRlcmluZz0iZ2VvbWV0cmljUHJlY2lzaW9uIj4KICAgIDxyZWN0IHg9IjAiIHk9IjAiIHdpZHRoPSI4MzEiIGhlaWdodD0iNDE2IiBmaWxsPSIjZmZmZmZmIi8+PGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMGIwYjBiIiBzdHJva2Utd2lkdGg9IjMuOSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIj48cGF0aCBkPSJNNzUsMjIxLjIgSDU4OCIvPjxwYXRoIGQ9Ik0zNDAuNSwzOTYgVjQxIi8+PC9nPjxwYXRoIGQ9Ik01OTIsMjIxLjIgTDU3OCwyMTUuNiBMNTc4LDIyNi44IEw1OTIsMjIxLjIgWiIgZmlsbD0iIzBiMGIwYiIvPjxwYXRoIGQ9Ik0zNDAuNSwyOSBMMzM0LjgsNDMuNSBMMzQ2LjIsNDMuNSBaIiBmaWxsPSIjMGIwYjBiIi8+PHBhdGggZD0iTTMwMywyODAgQzMwMi42MSwyNzkuMjIgMzAwLjY1LDI3NS4zIDMwMCwyNzQgQzI5OS4zNSwyNzIuNyAyOTguNTIsMjcxLjA0IDI5OCwyNzAgQzI5Ny40OCwyNjguOTYgMjk2LjUyLDI2Ny4xNyAyOTYsMjY2IEMyOTUuNDgsMjY0LjgzIDI5NC41MiwyNjIuMyAyOTQsMjYxIEMyOTMuNDgsMjU5LjcgMjkyLjUyLDI1Ny40MyAyOTIsMjU2IEMyOTEuNDgsMjU0LjU3IDI5MC41MiwyNTEuNjkgMjkwLDI1MCBDMjg5LjQ4LDI0OC4zMSAyODguMzksMjQ0Ljk1IDI4OCwyNDMgQzI4Ny42MSwyN 29\\,\\mathrm{rad/s}\\)；<br>与标准式 \\(s^{2}+2\\xi\\omega_{n}s+\\omega_{n}^{2}\\) 对照：\\(K=\\omega_{n}^{2}\\approx18.4\\)；由 \\(2\\xi\\omega_{n}=2+K\\tau\\) 得 \\(\\tau=\\dfrac{2\\xi\\omega_{n}-2}{K}\\approx0.22\\)。</p><p style=\"margin:12px 0 0 40px;line-height:2;font-weight:700;color:#0b9f7a;\">故 \\(K\\approx18.4\\)，\\(\\tau\\approx0.22\\)。</p>", "hot": "重中之重", "must": true}, {"paper": 5, "kind": "综合", "stem": "设单位负反馈系统的开环传递函数为 \\(G(s)=\\frac{K}{s(s+10)}\\)。(1) K 多大时阻尼比 \\(ζ=0.5\\)？(2) 当输入单位阶跃信号时，求调节时间 \\(t_{s}\\)（Δ=5%）和稳态误差。", "answer": "(1) \\(K=100\\)；(2) \\(t_{s}=0.6\\,\\mathrm{s}\\)，\\(e_{ss}=0\\)。", "solution": "<div class=\"subq\"><p class=\"subq-title\">（1）由 ζ=0.5 求 K</p><p class=\"step\">闭环特征方程 \\(s^{2}+10s+K=0\\)，与标准式对比得 \\(ω_{n}^{2}=K\\)，\\(2ζω_{n}=10\\)。</p><p class=\"step\">当 \\(ζ=0.5\\) 时 \\(2×0.5×ω_{n}=10\\)，得 \\(ω_{n}=10\\)，故 \\(K=ω_{n}^{2}=100\\)。</p></div><div class=\"subq\"><p class=\"subq-title\">（2）求调节时间和稳态误差</p><p class=\"step\">调节时间 \\(t_{s}=\\frac{3}{ζω_{n}}=\\frac{3}{5}=0.6\\,\\mathrm{s}\\)（±5%）。</p><p class=\"step\">\\(G(s)=\\frac{100}{s(s+10)}\\) 为Ⅰ型系统，阶跃输入下 \\(K_{p}=∞\\)，所以 \\(e_{ss}=0\\)。</p></div><p style=\"margin:12px 0 0 40px;line-height:2;font-weight:700;color:#0b9f7a;\">所以 \\(K=100\\)；调节时间 \\(t_{s}=0.6\\,\\mathrm{s}\\)；单位阶跃输入下 \\(e_{ss}=0\\)。</p>"}, {"paper": 5, "kind": "计算", "stem": "已知控制系统结构图如下，试用梅森公式求系统传递函数 \\(\\frac{C(s)}{R(s)}\\)。<figure class=\"exam-fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAwIDg4MCIgd2lkdGg9IjE4MDAiIGhlaWdodD0iODgwIj4NCjxkZWZzPjxtYXJrZXIgaWQ9ImEiIG1hcmtlcldpZHRoPSIxMSIgbWFya2VySGVpZ2h0PSIxMSIgcmVmWD0iOSIgcmVmWT0iMy42IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wLDAgTDksMy42IEwwLDcuMiB6IiBmaWxsPSIjMWExYTFhIi8+PC9tYXJrZXI+PC9kZWZzPg0KPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI2ZmZiIvPg0KPHRleHQgeD0iODUiIHk9IjQwMiIgdGV4dC1hbmNob3I9ImVuZCIgZm9udC1zaXplPSIzNiIgc3R5bGU9ImZvbnQtc3R5bGU6aXRhbGljOyIgZm9udC1mYW1pbHk9IlRpbWVzIE5ldyBSb21hbiwgU2ltU3VuL
