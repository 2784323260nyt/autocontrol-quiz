\(Z\\) 及稳定性为（　）。", "options": [["A", "\\(Z=0\\)，闭环稳定"], ["B", "\\(Z=2\\)，不稳定"], ["C", "\\(Z=4\\)，不稳定"], ["D", "\\(Z=1\\)，不稳定"]], "answer": "A", "analysis": "<p>按本课程约定逆时针为正，\\(N=1\\)。由 \\(Z=P-2N=2-2\\times1=0\\)，闭环在右半平面无极点，系统稳定。</p><p>正确选项：\\(Z=0\\)，闭环稳定。</p>"}, {"topic": "28考点·奈氏判据", "stem": "某最小相位系统的开环右半平面极点数 \\(P=1\\)，其幅相曲线顺时针包围 \\((-1,j0)\\) 点 1 圈（逆时针为正），则闭环右半平面极点数 \\(Z\\) 为（　）。", "options": [["A", "0"], ["B", "1"], ["C", "3"], ["D", "\\(-1\\)"]], "answer": "C", "analysis": "<p>顺时针为负，故 \\(N=-1\\)。由 \\(Z=P-2N=1-2\\times(-1)=3\\)，闭环有 3 个右半平面极点，系统不稳定。</p><p>正确选项：\\(Z=3\\)。</p>"}, {"topic": "28考点·Bode反求传函", "stem": "某最小相位系统的开环对数幅频特性渐近线：低频段为水平线且 \\(20\\lg K=26\\)，转折频率依次为 \\(2\\,\\mathrm{rad/s}\\) 和 \\(20\\,\\mathrm{rad/s}\\)，斜率由 \\(0\\) 变为 \\(-20\\)、再变为 \\(-40\\,\\mathrm{dB/dec}\\)。该系统的开环传递函数为（　）。", "options": [["A", "\\(G(s)=\\frac{20}{(0.5s+1)(0.05s+1)}\\)"], ["B", "\\(G(s)=\\frac{2}{(0.5s+1)(20s+1)}\\)"], ["C", "\\(G(s)=\\frac{20}{(2s+1)(20s+1)}\\)"], ["D", "\\(G(s)=\\frac{200}{(0.5s+1)(0.05s+1)}\\)"]], "answer": "A", "analysis": "<p>低频段水平说明是 0 型系统，\\(20\\lg K=26\\Rightarrow K\\approx20\\)。转折频率处斜率依次额外下降 \\(-20\\,\\mathrm{dB/dec}\\)，对应两个惯性环节，时间常数 \\(T_{1}=\\frac{1}{2}=0.5\\)、\\(T_{2}=\\frac{1}{20}=0.05\\)。</p><p>正确选项：\\(G(s)=\\frac{20}{(0.5s+1)(0.05s+1)}\\)。</p>"}, {"topic": "28考点·Bode反求传函", "stem": "承上题 \\(G(s)=\\frac{20}{(0.5s+1)(0.05s+1)}\\)，在截止频率 \\(\\omega_{c}\\approx 25\\,\\mathrm{rad/s}\\) 处，该系统的相位裕量约为（　）。", "options": [["A", "\\(43^{\\circ}\\)"], ["B", "\\(-43^{\\circ}\\)"], ["C", "\\(22^{\\circ}\\)"], ["D", "\\(67^{\\circ}\\)"]], "answer": "A", "analysis": "<p>\\(\\varphi(\\omega_{c})=-\\arctan(0.5\\times25)-\\arctan(0.05\\times25)\\approx-85.4^{\\circ}-51.3^{\\circ}=-136.7^{\\circ}\\)。</p><p>\\(\\gamma=180^{\\circ}+\\varphi(\\omega_{c})\\approx43.3^{\\circ}>0\\)，闭环稳定。</p><p>正确选项：\\(43^{\\circ}\\)。</p>"}, {"type": "fill", "topic": "28考点·采样定理", "stem": "为不失真地复现连续信号，采样角频率应满足________；否则会出现________现象。", "answer": "ωs≥2ωmax；频谱混叠", "answerHtml": "为不失真地复现连续信号，采样角频率应满足<strong>\\(\\omega_{s}\\ge 2\\omega_{max}\\)</strong>；否则会出现<strong>频谱混叠</strong>现象。", "analysis": "<p>采样定理：采样角频率 \\(\\omega_{s}\\) 必须不小于连续信号最高频率 \\(\\omega_{max}\\) 的 2 倍。若采样频率过低，采样后高频成分会折叠到低频段，即发生频谱混叠，信号无法无失真恢复。</p>"}, {"topic": "28考点·采样定理", "stem": "某连续信号所含最高频率为 \\(100\\,\\mathrm{Hz}\\)，按采样定理，最低采样频率应为（　）。", "options": [["A", "\\(50\\,\\mathrm{Hz}\\)"], ["B", "\\(100\\,\\mathrm{Hz}\\)"], ["C", "\\(200\\,\\mathrm{Hz}\\)"], ["D", "\\(400\\,\\mathrm{Hz}\\)"]], "answer": "C", "analysis": "<p>采样定理：\\(f_{s}\\ge 2f_{max}=2\\times100=200\\,\\mathrm{Hz}\\)。</p><p>正确选项：\\(200\\,\\mathrm{Hz}\\)。</p>"}, {"type": "fill", "topic": "2025真题·填空", "stem": "系统的输入量为 \\(r(t)\\)，其复频域表达式为 \\(R(s)\\)，输出量为 \\(c(t)\\)，其复频域表达式为 \\(C(s)\\)，则系统的传递函数 \\(G(s)=\\)________。", "answer": "C(s)/R(s)", "answerHtml": "系统的传递函数 \\(G(s)=\\frac{C(s)}{R(s)}\\)（零初始条件下输出与输入拉氏变换之比）。", "analysis": "<p>传递函数定义：零初始条件下，输出量的拉氏变换与输入量的拉氏变换之比。</p><p><strong>记忆要点：</strong>输出比输入、零初始条件。</p>"}, {"type": "fill", "topic": "2025真题·填空", "stem": "一阶系统的单位阶跃响应曲线中，按 ±5% 误差时的调节时间 \\(t_s=\\)________；按 ±2% 误差时 \\(t_s=\\)________。", "answer": "3T；4T", "answerHtml": "按 ±5% 误差：<strong>\\(t_{s}=3T\\)</strong>；按 ±2% 误差：<strong>\\(t_{s}=4T\\)</strong>（\\(T\\) 为时间常数）。", "analysis": "<p>一阶系统 \\(t_s\\) 与 \\(T\\) 成正比：5% 取 3T，2% 取 4T。</p>"}, {"type": "fill", "topic": "2025真题·填空", "stem": "根轨迹在复数起点处的切线与正实轴方向的夹角称为________角，在复数终点处与正实轴的夹角称为________角。", "answer": "起始；终止", "answerHtml": "复数起点处称<strong>起始角</strong>（出射角），复数终点处称<strong>终止角</strong>（入射角）。", "analysis": "<p>起始角/终止角由相角条件求得，用于判断根轨迹离开极点、进入零点的方向。</p>"}, {"type": "fill", "topic": "2025真题·填空", "stem": "根轨迹方程可分解为________条件和________条件。", "answer": "幅值；相角", "answerHtml": "根轨迹方程可分解为<strong>幅值条件</strong>和<strong>相角条件</strong>。", "analysis": "<p>幅值条件：\\(|G(s)H(s)|=1\\)；相角条件：\\(\\angle G(s)H(s)=\\pm(2k+1)180^{\\circ}\\)。</p>"}, {"type": "fill", "topic": "2025真题·填空", "stem": "开环对数幅频特性的低频段反映了系统的________性能。", "answer": "稳态", "answerHtml": "低频段（\\(\\omega\\to0\\)）反映系统的<strong>稳态</strong>性能。", "analysis": "<p>低频段高度与斜率决定系统型别（0/Ⅰ/Ⅱ型）和稳态误差。</p>"}, {"type": "fill", "topic": "2025真题·填空", "stem": "对数幅频特性曲线的横坐标用 \\(\\omega\\) 标识，但按照________均匀分度。", "answer": "lgω（对数）", "answerHtml": "按 <strong>\\(\\lg\\omega\\)</strong> 均匀分度（十倍频程等宽）。", "analysis": "<p>横轴按 \\(\\lg\\omega\\) 线性刻度，故频率每增大 10 倍，横轴距离相等（dec）。</p>"}, {"topic": "2025真题·单选", "stem": "闭环传递函数的特征方程是指：闭环传递函数的（　）等于零的方程。", "options": [["A", "分子"], ["B", "分母"], ["C", "零点"], ["D", "极点"]], "answer": "B", "analysis": "<p>闭环传递函数 \\(\\Phi(s)=\\frac{G(s)}{1+G(s)H(s)}\\)，其分母 \\(1+GH=0\\) 即为特征方程。</p><p>正确选项：分母。</p>"}, {"topic": "2025真题·单选", "stem": "确定根轨迹上点的充要条件是满足 \\(\\angle G(s)H(s)=\\)（　）。", "options": [["A", "\\(-1\\)"], ["B", "\\(1\\)"], ["C", "\\(\\pm(2k+1)\\frac{\\pi}{2}\\,(k=0,1,2,\\cdots)\\)"], ["D", "\\(\\pm(2k+1)\\pi\\,(k=0,1,2,\\cdots)\\)"]], "answer": "D", "analysis": "<p>根轨迹的相角条件：\\(\\angle G(s)H(s)=\\pm(2k+1)\\pi\\)，即奇数个 180°。</p><p>正确选项：\\(\\pm(2k+1)\\pi\\)。</p>"}, {"topic": "2025真题·单选", "stem": "相位裕量可衡量系统的相对稳定性，当 \\(\\gamma&lt;0^{\\circ}\\) 时，闭环系统是（　）。", "options": [["A", "不稳定"], ["B", "临界稳定"], ["C", "稳定"], ["D", "判断不出来"]], "answer": "A", "analysis": "<p>最小相位系统：\\(\\gamma&gt;0\\) 稳定，\\(\\gamma=0\\) 临界稳定，\\(\\gamma&lt;0\\) 不稳定。</p><p>正确选项：不稳定。</p>"}, {"topic": "2025真题·单选", "stem": "校正装置常用的比例、积分与微分控制规律的表示方法是（　）。", "options": [["A", "PDI"], ["B", "IDP"], ["C", "IPD"], ["D", "PID"]], "answer": "D", "analysis": "<p>比例（P）、积分（I）、微分（D）组合写作 PID。</p><p>正确选项：PID。</p>"}];

    const paperData = {"short": [{"paper": 1, "stem": "反馈控制系统有哪三种传递函数？各自的物理含义是什么？", "answer": "开环传递函数\\( G_{1}G_{2}H\\)、<br>闭环传递函数\\( Φ(s)=\\frac{G_{1}G_{2}}{(1+G_{1}G_{2}H)}\\)、<br>误差传递函数\\( Φ_{e}(s)=\\frac{1}{(1+G_{1}G_{2}H)}\\)。", "solution": "<p class=\"step\">根据开环传递函数是主反馈断开时前向通道与反馈通道传递函数之积，可得 \\(G_{1}G_{2}H\\) 决定开环频率特性与根轨迹。</p><p class=\"step\">由闭环传递函数是输出与输入之比可知由结构图化简得 \\(Φ(s)=\\frac{G_{1}G_{2}}{(1+G_{1}G_{2}H)}\\)，它描述系统跟踪给定输入的能力；同理扰动输入时为 \\(Φ_{n}(s)=\\frac{G_{2}}{(1+G_{1}G_{2}H)}\\)。</p><p class=\"step\">误差传递函数是误差与输入之比，所以 \\(Φ_{e}(s)=\\frac{1}{(1+G_{1}G_{2}H)}\\)；三者的分母都是 \\(1+G_{1}G_{2}H\\)，所以稳定性相同。</p>"}, {"paper": 1, "stem": "写出二阶欠阻尼系统超调量 σ%、上升时间 \\(t_{r}\\)、峰值时间 \\(t_{p}\\) 的计算公式，并说明它们与 ζ、\\(ω_{n}\\) 的关系。", "answer": "\\(σ\\%=e^{-πζ/\\sqrt{1-ζ^{2}}}\\times 100\\%\\)；<br>\\(t_{r}=\\frac{(π-β)}{ω_{d}}\\)；<br>\\(t_{p}=\\frac{π}{ω_{d}}\\)，其中\\( β=\\arccosζ\\)，\\(ω_{d}=ω_{n}\\sqrt{1-ζ^{2}}\\)。", "solution": "<p class=\"step\">二阶欠阻尼系统的阶跃响应是衰减振荡，因此超调量只由阻尼比决定：\\(σ\\%=e^{-πζ/\\sqrt{1-ζ^{2}}}\\times100\\%\\)，ζ 越大 σ% 越小。</p><p class=\"step\">由于振荡的周期由阻尼振荡频率 \\(ω_{d}\\) 决定，因此 \\(t_{r}=\\frac{π-β}{ω_{d}}\\)、\\(t_{p}=\\frac{π}{ω_{d}}\\)，其中 \\(β=\\arccosζ\\)、\\(ω_{d}=ω_{n}\\sqrt{1-ζ^{2}}\\)。</p><p class=\"step\"> \\(ω_{d}\\) 越大响应越快，可见， \\(ω_{n}\\) 越大、ζ 越小则 \\(t_{r}\\)、\\(t_{p}\\) 越小；但 ζ 减小会使 σ% 增大，所以快速性与平稳性互相矛盾。</p>"}, {"paper": 1, "stem": "绘制根轨迹时，渐近线有几条？其与实轴的交点、夹角如何计算？分离点（会合点）又如何确定？", "answer": "渐近线 n−m 条；<br>\\(σ_{a}=\\frac{(Σp_{i}-Σz_{j})}{(n-m)}\\)，\\(φ_{a}=\\frac{(2k+1)180^{\\circ}}{(n-m)}\\)；<br>分离点由\\( dK_{r}/ds=0 \\)求出，且须满足\\( K_{r}&gt;0 \\)并落在根轨迹段上。", "solution": "<p class=\"step\">开环有 n 个极点、m 个有限零点，所以渐近线有 \\(n-m\\) 条。</p><p class=\"step\">各渐近线交于实轴上同一点且在圆周上均匀分布，因此 \\(σ_{a}=\\frac{Σp_{i}-Σz_{j}}{n-m}\\)、\\(φ_{a}=\\frac{(2k+1)180^{\\circ}}{n-m}\\)。</p><p class=\"step\">分离点是根轨迹在实轴上的重根点，从而由 \\(\\frac{dK_{r}}{ds}=0\\) 求候选值，再检验 \\(K_{r}&gt;0\\) 且落在实轴根轨迹段上。</p>"}, {"paper": 1, "stem": "梅森增益公式中 Δ 与\\( Δ_{k}\\) 分别表示什么？如何判断回路与前向通道是否接触？", "answer": "\\(Δ=1-ΣL_{a}+ΣL_{b}L_{c}-\\dots \\)为特征式；<br>\\(Δ_{k}\\) 为第 k 条前向通道的余子式，即删去与该通道接触的回路后剩下的 Δ 部分；<br>共用同一节点即接触。", "solution": "<p class=\"step\"> Δ 是独立回路增益的代数和（正负交替）并计入互不接触回路乘积，据此， \\(Δ=1-ΣL_{a}+ΣL_{b}L_{c}-\\dots\\)。</p><p class=\"step\"> \\(Δ_{k}\\) 要排除与第 k 条前向通道接触的回路，所以删去这些回路后剩下的 Δ 就是 \\(Δ_{k}\\)；若全不接触则 \\(Δ_{k}=Δ\\)。</p><p class=\"step\">回路与前向通道共用节点（或支路）即为接触，因此只有完全不共用节点的回路才计入 \\(Δ_{k}\\)。</p>"}, {"paper": 2, "stem": "简述劳斯稳定判据的判断步骤，并说明首列元素为零和出现全零行时分别如何处理。", "answer": "列劳斯表，首列变号次数即右半平面根数，全为正则稳定；<br>首元为零用 ε 代替，全零行用辅助方程求导后的系数替换。", "solution": "<p class=\"step\">稳定性由特征根在 s 平面的位置决定，进而先按降幂排列系数列出劳斯表。</p><p class=\"step\">劳斯表第一列的符号改变次数等于右半平面根数，由此可见，第一列全为正时系统稳定。</p><p class=\"step\">首列元素为零会导致下一行除零，所以用一个足够小的正数 ε 代替该元素，最后令 ε→0 判断符号。</p><p class=\"step\">全零行说明存在对称根（可能含纯虚根），因此取上一行构造辅助方程并求导，用导数系数替换全零行继续列表。</p>"}, {"paper": 2, "stem": "零阶保持器与一阶保持器的外推规律有何不同？各有什么优缺点？", "answer": "零阶保持器常值外推、输出阶梯波，简单但复现精度低、有半个周期滞后；<br>一阶保持器线性外推、输出折线，精度较高但滞后更大、实现复杂。", "solution": "<p class=\"step\">根据零阶保持器只把当前采样值保持一个周期，可得输出是阶梯波，传递函数 \\(G_{h}(s)=\\frac{1-e^{-Ts}}{s}\\)。</p><p class=\"step\">由一阶保持器用前两个采样值作线性外推可知输出是折线，复现精度比零阶高。</p><p class=\"step\">零阶保持器结构简单、应用最广，所以最常用，但它有约半个采样周期的平均滞后；一阶精度高但滞后更大、实现复杂、抗噪差。</p>"}, {"paper": 2, "stem": "什么是超前校正？它的主要作用是什么？", "answer": "采用\\( G_{c}(s)=\\frac{(1+αTs)}{(1+Ts)}\\)（\\(α&gt;1\\)）的串联校正，<br>利用其正相角增大相位裕量，<br>提高平稳性与快速性，<br>但会抬高高频增益。", "solution": "<p class=\"step\">超前校正 \\(G_{c}(s)=\\frac{1+αTs}{1+Ts}\\)（\\(α&gt;1\\)）的零点转折频率 \\(\\frac{1}{αT}\\) 低于极点转折频率 \\(\\frac{1}{T}\\)，因此中频段提供正相角。</p><p class=\"step\">由于最大超前角出现在两个转折频率的几何中点，因此 \\(φ_{m}=\\arcsin\\frac{α-1}{α+1}\\)、\\(ω_{m}=\\frac{1}{T\\sqrt{α}}\\)。</p><p class=\"step\">正相角提高了相位裕量，可见，相对稳定性和快速性改善；但高频增益被抬高，所以抗高频噪声能力下降。</p>"}, {"paper": 2, "stem": "PID 控制器中 P、I、D 三个环节各起什么作用？", "answer": "P 按比例反映误差、提高快速性但有余差；<br>I 积分消除稳态误差但降低稳定性；<br>D 微分预判误差变化、增大阻尼、抑制超调但放大噪声。", "solution": "<p class=\"step\">比例环节输出与误差成正比，所以增大 \\(K_{p}\\) 可提高响应速度、减小误差，但过大会振荡且仍留稳态误差。</p><p class=\"step\">积分环节对误差不断累加，因此只要还有误差就继续修正，能消除阶跃稳态误差；但引入 90° 相角滞后，所以稳定性变差。</p><p class=\"step\">微分环节按误差变化率输出，从而有超前预判作用，能增大阻尼、减小超调；但微分放大噪声，所以一般不单独使用。</p><p class=\"step\">三者都串接在偏差点之后、被控对象之前，据此，按对象特性组合成 PID 控制器使用。</p>"}, {"paper": 3, "stem": "动态结构图有哪四种基本符号？结构图等效变换应遵循什么原则？", "answer": "信号线、方框、综合点、引出点；<br>变换前后输入输出关系不变，串联相乘、并联相加、反馈用闭环公式。", "solution": "<p class=\"step\">动态结构图要表示信号和环节，所以由信号线、方框、综合点、引出点四种基本符号组成。</p><p class=\"step\">等效变换不能改变输入输出之间的传递关系，因此串联相乘、并联相加、反馈用 \\(\\frac{G}{1±GH}\\)。</p><p class=\"step\">移动综合点或引出点会改变支路信号，进而移动时要在支路上补乘或除以相应的传递函数。</p>"}, {"paper": 3, "stem": "系统的稳态误差由哪些因素决定？改善稳态精度有哪些方法？各有什么副作用？", "answer": "由系统型别、开环增益、输入信号形式决定；<br>提高型别、增大增益、引入前馈/复合控制；<br>副作用是稳定裕量下降、动态性能变差。", "solution": "<p class=\"step\">稳态误差由系统型别（积分环节个数）、开环增益和输入信号形式共同决定，所以分析误差先看这三个因素。</p><p class=\"step\">型别和增益决定误差系数，所以提高型别、增大开环增益可减小 ess，采用前馈/复合控制可从结构上抵消误差。</p><p class=\"step\">提高型别和增益会降低相位裕量，因此动态性能变差甚至不稳定；前馈补偿需要已知对象模型，所以常与超前/迟后校正配合使用。</p>"}, {"paper": 3, "stem": "对最小相位系统，为什么幅值裕量\\( K_{g}&lt;1 \\)时闭环系统不稳定？", "answer": "\\(ω_{g}\\) 处相角已达\\( -180^{\\circ}\\)，<br>\\(Kg&lt;1 \\)即\\( A(ω_{g})&gt;1\\)，<br>负反馈变为正反馈且环路增益大于 1，<br>扰动被不断放大。", "solution": "<p class=\"step\">根据 \\(K_{g}=\\frac{1}{A(ω_{g})}\\)，可得 \\(K_{g}&lt;1\\) 等价于 \\(A(ω_{g})&gt;1\\)。</p><p class=\"step\">由在 \\(ω_{g}\\) 处相角已达 \\(-180^{\\circ}\\)，负反馈变成正反馈可知环路增益大于 1 时扰动被逐圈放大，闭环不稳定。</p><p class=\"step\"> \\(K_{g}=1\\) 时等幅振荡、\\(K_{g}&gt;1\\) 时扰动逐圈衰减，所以判稳条件为 \\(K_{g}&gt;1\\)。</p>"}, {"paper": 3, "stem": "采样控制系统的数学基础包括哪些内容？", "answer": "采样定理（\\(ω_{s}\\ge 2ω_{max}\\)）、<br>z 变换、<br>差分方程、<br>脉冲传递函数，以及\\( |z|&lt;1 \\)的稳定性判据。", "solution": "<p class=\"step\">要不失真地复现连续信号，因此采样角频率须满足 \\(ω_{s}\\ge2ω_{max}\\)，否则发生频谱混叠。</p><p class=\"step\">由于 z 变换把采样序列变成 z 域表达式，因此它是分析采样系统的工具。</p><p class=\"step\">差分方程描述输入输出序列之间的关系（对应连续系统的微分方程），可见，常与脉冲传递函数 \\(G(z)=\\frac{C(z)}{R(z)}\\) 一起使用。</p><p class=\"step\">系统稳定性由闭环极点决定，所以稳定条件是全部闭环极点 \\(|z_{i}|&lt;1\\)。</p>"}, {"paper": 4, "stem": "系统动态结构图由哪几种基本符号组成？等效变换有哪些基本方法？", "answer": "基本符号：信号线、引出点（分支点）、比较点（综合点）、方框。等效变换：串联相乘、并联相加、反馈 \\(\\frac{G}{1\\pm GH}\\)。", "solution": "<p class=\"step\">结构图要表示信号与环节，因此基本符号为信号线、引出点、比较点、方框。</p><p class=\"step\">等效变换要保持传递关系不变，从而串联相乘、并联相加、反馈用 \\(\\frac{G}{1±GH}\\)。</p>"}, {"paper": 4, "stem": "自动控制系统有哪些分类方法？", "answer": "按控制方式：开环、闭环；按系统特性：线性、非线性；按输入信号：定值控制、随动控制、程序控制。", "solution": "<p class=\"step\">控制方式不同，据此，分为开环控制与闭环控制；系统特性不同，所以分为线性系统与非线性系统；输入信号变化规律不同，因此分为定值、随动、程序控制系统。</p>"}, {"paper": 4, "stem": "主导极点的定义及在根轨迹分析法中的作用是什么？", "answer": "主导极点：离虚轴最近、对动态响应影响最大（通常实部绝对值最小）的闭环极点。作用：可用二阶近似估算超调量、调节时间等动态指标，并据此调整根轨迹使性能满足要求。", "solution": "<p class=\"step\">距虚轴最近、实部绝对值最小的极点衰减最慢，进而它对动态响应影响最大，称为主导极点，系统可近似为二阶。</p><p class=\"step\"> σ%、ts 等指标由主导极点参数决定，由此可见，可用其估算性能，并通过改变增益或加入校正来调整主导极点位置。</p>"}, {"paper": 4, "stem": "相位裕量和幅值裕量的定义与算式是什么？", "answer": "相位裕量 \\(\\gamma=180^{\\circ}+\\varphi(\\omega_c)\\)，在截止频率处衡量相角离 -180° 的余量；幅值裕量 \\(K_g=\\frac{1}{|G(j\\omega_g)H(j\\omega_g)|}\\)，在相角穿越频率处取幅值的倒数。", "solution": "<p class=\"step\">在截止频率 \\(ω_{c}\\) 处开环幅值为 1，所以相位裕量 \\(γ=180^{\\circ}+φ(ω_{c})\\) 衡量相角离 \\(-180^{\\circ}\\) 的余量。</p><p class=\"step\">在相角穿越频率 \\(ω_{g}\\) 处相角为 \\(-180^{\\circ}\\)，因此幅值裕量 \\(K_{g}=\\frac{1}{|G(jω_{g})H(jω_{g})|}\\)；用分贝表示为 \\(K_{g}(\\mathrm{dB})=-20\\lg|GH(jω_{g})|\\)。</p>"}], "calc": [{"paper": 1, "stem": "已知控制系统结构图如图 1 所示，试用梅森增益公式求传递函数 \\(\\frac{C(s)}{R(s)}\\)。（6 分） <figure class=\"fig\"><svg viewBox=\"0 0 660 235\" width=\"650\" height=\"231\" xmlns=\"http://www.w3.org/2000/svg\"> <defs><marker id=\"ar1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#111\"/></marker></defs> <g fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"18\" y1=\"84\" x2=\"49\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"73\" y1=\"84\" x2=\"90\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"150\" y1=\"84\" x2=\"169\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"193\" y1=\"84\" x2=\"210\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"270\" y1=\"84\" x2=\"299\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"323\" y1=\"84\" x2=\"340\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"400\" y1=\"84\" x2=\"427\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"451\" y1=\"84\" x2=\"468\" y2=\"84\" marker-end=\"url(#ar1)\"/> <line x1=\"528\" y1=\"84\" x2=\"556\" y2=\"84\" marker-end=\"url(#ar1)\"/> <circle cx=\"62\" cy=\"84\" r=\"11\" fill=\"#fff\"/><circle cx=\"182\" cy=\"84\" r=\"11\" fill=\"#fff\"/> <circle cx=\"312\" cy=\"84\" r=\"11\" fill=\"#fff\"/><circle cx=\"440\" cy=\"84\" r=\"11\" fill=\"#fff\"/> <rect x=\"92\" y=\"68\" width=\"58\" height=\"32\" fill=\"#fff\"/><rect x=\"212\" y=\"68\" width=\"58\" height=\"32\" fill=\"#fff\"/> <rect x=\"342\" y=\"68\" width=\"58\" height=\"32\" fill=\"#fff\"/><rect x=\"470\" y=\"68\" width=\"58\" height=\"32\" fill=\"#fff\"/> <path d=\"M270,84 L270,150 L182,150 L182,97\" marker-end=\"url(#ar1)\"/> <path d=\"M556,84 L556,190 L440,190 L440,97\" marker-end=\"url(#ar1)\"/> <path d=\"M35,84 L35,30 L440,30 L440,71\" marker-end=\"url(#ar1)\"/> </g> <g fill=\"#111\" font-size=\"13\" font-family=\"SimSun, serif\" text-anchor=\"middle\"> <text x=\"121\" y=\"89\">G<tspan font-size=\"10\" dy=\"3\">1</tspan></text> <text x=\"241\" y=\"89\">G<tspan font-size=\"10\" dy=\"3\">2</tspan></text> <text x=\"371\" y=\"89\">G<tspan font-size=\"10\" dy=\"3\">3</tspan></text> <text x=\"499\" y=\"89\">G<tspan font-size=\"10\" dy=\"3\">4</tspan></text> <text x=\"400\" y=\"24\">G<tspan font-size=\"10\" dy=\"3\">5</tspan></text> <text x=\"215\" y=\"144\">H<tspan font-size=\"10\" dy=\"3\">1</tspan></text> <text x=\"492\" y=\"184\">H<tspan font-size=\"10\" dy=\"3\">2</tspan></text> <text x=\"62\" y=\"89\" font-size=\"12\">Σ</text><text x=\"182\" y=\"89\" font-size=\"12\">Σ</text> <text x=\"312\" y=\"89\" font-size=\"12\">Σ</text><text x=\"440\" y=\"89\" font-size=\"12\">Σ</text> <text x=\"10\" y=\"89\">R</text><text x=\"566\" y=\"89\">C</text> <text x=\"56\" y=\"76\" font-size=\"11\">+</text><text x=\"176\" y=\"76\" font-size=\"11\">+</text> <text x=\"306\" y=\"76\" font-size=\"11\">+</text><text x=\"434\" y=\"76\" font-size=\"11\">+</text> <text x=\"176\" y=\"104\" font-size=\"11\">−</text><text x=\"434\" y=\"104\" font-size=\"11\">−</text> </g> </svg><figcaption>图 1</figcaption></figure>", "answer": "\\(\\frac{C(s)}{R(s)}=\\frac{[G_{1}G_{2}G_{3}G_{4}+G_{5}G_{4}(1+G_{2}H_{1})]}{[1+G_{2}H_{1}+G_{4}H_{2}+G_{2}G_{4}H_{1}H_{2}]}\\)。", "solution": "<p class=\"step\">根据 \\(G_{2}\\)、\\(G_{4}\\) 处各有一个局部反馈，可得两个独立回路为 \\(L_{1}=-G_{2}H_{1}\\)、\\(L_{2}=-G_{4}H_{2}\\)。</p><p class=\"step\">由 \\(L_{1}\\) 与 \\(L_{2}\\) 中间隔着 \\(G_{3}\\)、无公共节点（互不接触）可知特征式 \\(Δ=1-ΣL_{a}+ΣL_{b}L_{c}-…=1+G_{2}H_{1}+G_{4}H_{2}+G_{2}G_{4}H_{1}H_{2}\\)。</p><p class=\"step\"> \\(P_{1}=G_{1}G_{2}G_{3}G_{4}\\) 与两个回路都接触，所以 \\(Δ_{1}=1\\)； \\(P_{2}=G_{5}G_{4}\\) 只与 \\(L_{2}\\) 接触，因此 \\(Δ_{2}=1+G_{2}H_{1}\\)。</p><p class=\"step\">由于梅森公式为 \\(P=\\frac{ΣP_{k}Δ_{k}}{Δ}\\)，因此 \\(\\frac{C(s)}{R(s)}=\\frac{G_{1}G_{2}G_{3}G_{4}+G_{5}G_{4}(1+G_{2}H_{1})}{1+G_{2}H_{1}+G_{4}H_{2}+G_{2}G_{4}H_{1}H_{2}}\\)。</p>", "kind": "计算"}, {"paper": 1, "stem": "已知闭环系统的特征方程为 \\(s^{4}+3s^{3}+6s^{2}+12s+8=0\\)，试用劳斯判据判断系统的稳定性，并说明运动形式。（6 分）", "answer": "第一列全为正，无右半平面根；<br>存在一对纯虚根 ±j2，系统临界稳定，作等幅振荡；<br>其余根为 −1、−2。", "solution": "<p class=\"step\">特征方程为 \\(s^{4}+3s^{3}+6s^{2}+12s+8=0\\)，据此按系数降幂列劳斯表：</p><table class=\"routh\"><thead><tr><th></th><th>第 1 列</th><th>第 2 列</th><th>第 3 列</th></tr></thead><tbody>\n<tr><th>s<sup>4</sup></th><td>1</td><td>6</td><td>8</td></tr>\n<tr><th>s<sup>3</sup></th><td>3</td><td>12</td><td>0</td></tr>\n<tr><th>s<sup>2</sup></th><td>2</td><td>8</td><td></td></tr>\n<tr><th>s<sup>1</sup></th><td>0（全零行）→ 4</td><td>0</td><td></td></tr>\n<tr><th>s<sup>0</sup></th><td>8</td><td></td><td></td></tr>\n</tbody></table><p class=\"step\"> \\(s^{1}\\) 行全为零，所以取 \\(s^{2}\\) 行构造辅助方程 \\(2s^{2}+8=0\\)，即 \\(s^{2}+4=0\\)，解得 \\(s=\\pm j2\\)。</p><p class=\"step\">辅助方程求导得 \\(4s\\)，因此用系数 4、0 代替全零行，继续算得 \\(s^{0}\\) 行：\\((4×8-2×0)/4=8\\)。</p><p class=\"step\">第一列 1、3、2、4、8 符号改变 0 次，故右半平面无根；又存在纯虚根 \\(\\pm j2\\)，据此，系统临界稳定、作等幅振荡。</p><p class=\"step\"> \\((s^{2}+4)(s^{2}+3s+2)=(s^{2}+4)(s+1)(s+2)\\)，所以其余根为 \\(s=-1、-2\\)。</p>", "kind": "计算"}, {"paper": 1, "stem": "某最小相位系统的开环幅相曲线如图 2 所示，图中箭头为 ω 由 0 增大到 ∞ 的方向，P 为开环右半平面极点数（P=2）。试用奈奎斯特稳定判据判断闭环系统的稳定性。（6 分） <figure class=\"fig\"><svg viewBox=\"0 0 380 240\" width=\"360\" height=\"227\" xmlns=\"http://www.w3.org/2000/svg\"> <defs><marker id=\"ar2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#111\"/></marker></defs> <g fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"40\" y1=\"150\" x2=\"336\" y2=\"150\" marker-end=\"url(#ar2)\"/> <line x1=\"140\" y1=\"222\" x2=\"140\" y2=\"42\" marker-end=\"url(#ar2)\"/> <path d=\"M330,150 C330,84 236,50 172,72\" marker-end=\"url(#ar2)\"/> <path d=\"M172,72 C110,94 82,142 104,176\" marker-end=\"url(#ar2)\"/> <path d=\"M104,176 C132,214 222,208 260,168\" marker-end=\"url(#ar2)\"/> <path d=\"M260,168 C284,142 279,116 252,106\" marker-end=\"url(#ar2)\"/> <circle cx=\"112\" cy=\"150\" r=\"2.5\" fill=\"#111\"/> </g> <g fill=\"#111\" font-size=\"13\" font-family=\"SimSun, serif\"> <text x=\"344\" y=\"155\">Re</text><text x=\"146\" y=\"40\">Im</text> <text x=\"88\" y=\"170\">−1</text> <text x=\"300\" y=\"140\" font-size=\"12\">ω=0</text><text x=\"150\" y=\"132\" font-size=\"12\">ω→∞</text> </g> </svg><figcaption>图 2</figcaption></figure>", "answer": "曲线逆时针包围 (−1,j0) 一圈，N=1；<br>Z=P−2N=2−2=0，闭环系统稳定。", "solution": "<p class=\"step\">图中幅相曲线逆时针包围 \\((-1,j0)\\) 点 1 圈，因此按本课程约定（逆时针为正）\\(N=1\\)。</p><p class=\"step\">因为题给开环右半平面极点数 \\(P=2\\)，代入奈奎斯特判据得 \\(Z=P-2N=2-2×1=0\\)。</p><p class=\"step\"> \\(Z=0\\) 表示闭环在右半平面没有极点，进而闭环系统稳定。</p>", "kind": "计算"}, {"paper": 1, "stem": "设单位负反馈系统的开环传递函数为 \\(G(s)=\\frac{K}{s(Ts+1)}\\)（\\(K&gt;0\\)，\\(T&gt;0\\)）。要求系统的超调量\\( σ\\%=4.3\\%\\)，调节时间 \\(t_{s}=1.5 s\\)（\\(Δ=5\\%\\)）。（共 8 分） <div class=\"formula\"><span class=\"fwrap\">（1）确定参数 T 和 K；（4 分） （2）求峰值时间\\( t_{p}\\) 和单位斜坡输入下的稳态误差\\( e_{ss}\\)。（4 分）</span>", "answer": "\\(T=0.25\\)，\\(K=2\\)；<br>\\(t_{p}=π/2\\)≈1.57 s，\\(e_{ss}=0.5\\)。", "solution": "<p class=\"step\"> \\(G(s)=\\frac{K}{s(Ts+1)}\\) 的闭环特征方程为 \\(Ts^{2}+s+K=0\\)，可化成标准式 \\(s^{2}+\\frac{1}{T}s+\\frac{K}{T}=0\\)，与 \\(s^{2}+2ζω_{n}s+ω_{n}^{2}=0\\) 对比得 \\(2ζω_{n}=\\frac{1}{T}\\)、\\(ω_{n}^{2}=\\frac{K}{T}\\)。</p><p class=\"step\"> \\(σ\\%=4.3\\%=e^{-πζ/\\sqrt{1-ζ^{2}}}\\)，所以解得 \\(ζ=0.707\\)。</p><p class=\"step\"> \\(t_{s}=\\frac{3}{ζω_{n}}=1.5\\)，因此 \\(ζω_{n}=2\\)、\\(ω_{n}=2.83\\,\\mathrm{rad/s}\\)。</p><p class=\"step\">依据 \\(\\frac{1}{T}=2ζω_{n}=4\\)，于是 \\(T=0.25\\)；由 \\(\\frac{K}{T}=ω_{n}^{2}=8\\)可知 \\(K=2\\)。</p><p class=\"step\"> \\(ω_{d}=ω_{n}\\sqrt{1-ζ^{2}}=2\\,\\mathrm{rad/s}\\)，所以 \\(t_{p}=\\frac{π}{ω_{d}}=\\frac{π}{2}≈1.57\\,\\mathrm{s}\\)。</p><p class=\"step\">是Ⅰ型系统，因此 \\(K_{v}=\\lim_{s→0}sG(s)=K=2\\)，单位斜坡输入下 \\(e_{ss}=\\frac{1}{K_{v}}=0.5\\)。</p>", "kind": "综合"}, {"paper": 1, "stem": "已知系统的开环传递函数为 \\(G(s)H(s)=\\frac{K_{r}}{s(s+3)(s+6)}\\)（\\(K_{r}&gt;0\\)）。（共 8 分） <div class=\"formula\"><span class=\"fwrap\">（1）绘制根轨迹，求分离点、渐近线，并说明是否存在会合点；（5 分） （2）求系统临界稳定时的\\( K_{r}\\) 及振荡频率。（3 分）</span>", "answer": "实轴段 (−3,0) 与\\( (-\\infty ,-6)\\)；<br>\\(σ_{a}=-3\\)，\\(φ_{a}=\\pm 60^{\\circ}\\)、\\(180^{\\circ}\\)；<br>分离点\\( s=-3+\\sqrt{3}\\)≈−1.268（\\(K_{r}\\)≈10.4），无会合点；<br>临界\\( K_{r}=162\\)，\\(ω=3\\sqrt{2}\\)≈4.24 rad/s。", "solution": "<p class=\"step\">由于开环极点 0、-3、-6，无有限零点，因此 \\(n-m=3\\)，即渐近线 3 条。</p><p class=\"step\">实轴段判据是“右侧零极点数之和为奇数”，可见，实轴根轨迹段为 \\((-3,0)\\) 与 \\((-∞,-6)\\)。</p><p class=\"step\">三条渐近线交于同一点且夹角均分，所以 \\(σ_{a}=-3\\)、\\(φ_{a}=\\pm60^{\\circ}、180^{\\circ}\\)。</p><p class=\"step\">分离点由 \\(\\frac{dK_{r}}{ds}=0\\) 确定（\\(K_{r}=-s(s+3)(s+6)\\)），因此解得分离点 \\(s=-3+\\sqrt{3}≈-1.268\\)，此时 \\(K_{r}≈10.4\\)。</p><p class=\"step\">根轨迹与虚轴交点要求 \\(s=jω\\) 满足特征方程，从而算得临界 \\(K_{r}=162\\)，对应虚轴交点。</p>", "kind": "综合"}, {"paper": 1, "stem": "某最小相位系统的开环对数幅频特性渐近线如图 3 所示，低频段为水平线，L(1)=26 dB。（共 10 分） <div class=\"formula\"><span class=\"fwrap\">（1）写出系统的开环传递函数；（5 分） （2）求相位裕量并判断闭环稳定性。（5 分）</span> <figure class=\"fig\"><svg viewBox=\"0 0 540 265\" width=\"520\" height=\"255\" xmlns=\"http://www.w3.org/2000/svg\"> <g fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"55\" y1=\"200\" x2=\"505\" y2=\"200\"/> <line x1=\"60\" y1=\"215\" x2=\"60\" y2=\"45\"/> <line x1=\"60\" y1=\"200\" x2=\"480\" y2=\"200\" stroke-dasharray=\"4 3\" stroke-width=\".8\"/> <polyline points=\"60,148 242,148 382,188 470,232\"/> </g> <g fill=\"#111\" font-size=\"12\" font-family=\"SimSun, serif\"> <text x=\"530\" y=\"204\">ω</text><text x=\"64\" y=\"40\">L/dB</text> <text x=\"52\" y=\"204\">O</text><text x=\"47\" y=\"151\">26</text> <text x=\"50\" y=\"203\" font-size=\"11\">0</text> <text x=\"56\" y=\"219\">0.1</text><text x=\"196\" y=\"219\">1</text><text x=\"236\" y=\"219\">2</text><text x=\"372\" y=\"219\">20</text><text x=\"468\" y=\"219\">100</text> <text x=\"300\" y=\"160\" font-size=\"12\">−20 dB/dec</text> <text x=\"392\" y=\"214\" font-size=\"12\">−40 dB/dec</text> <text x=\"120\" y=\"140\" font-size=\"12\">20lgK=26</text> </g> <g stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"242\" y1=\"194\" x2=\"242\" y2=\"206\"/><line x1=\"382\" y1=\"194\" x2=\"382\" y2=\"206\"/> <line x1=\"196\" y1=\"194\" x2=\"196\" y2=\"206\"/><line x1=\"60\" y1=\"194\" x2=\"60\" y2=\"206\"/> </g> </svg><figcaption>图 3</figcaption></figure>", "answer": "\\(G(s)=\\frac{20}{[(0.5s+1)(0.05s+1)]}\\)；<br>渐近线截止频率约 28 rad/s，\\(ω_{c}\\)≈25 rad/s，γ≈\\(43^{\\circ}&gt;0\\)，闭环稳定。", "solution": "<p class=\"step\">低频段为水平线（斜率 0），据此，是 0 型系统； \\(L(1)=26\\,\\mathrm{dB}\\)，所以 \\(20\\lg K=26\\)，得 \\(K≈20\\)。</p><p class=\"step\">斜率依次由 0 变为 −20、−40 dB/dec，因此对应两个惯性环节，转折频率 2 与 20 rad/s，即 \\(T_{1}=0.5\\)、\\(T_{2}=0.05\\)。</p><p class=\"step\">转折频率与环节对应，进而 \\(G(s)=\\frac{20}{(0.5s+1)(0.05s+1)}\\)。</p><p class=\"step\">渐近线与 0 dB 线交点约 28 rad/s、实际 \\(ω_{c}≈25\\,\\mathrm{rad/s}\\)，由此可见，由 \\(\\gamma=180^{\\circ}+\\varphi(\\omega_{c})\\) 算得 \\(\\gamma≈43^{\\circ}&gt;0\\)，闭环稳定。</p>", "kind": "综合"}, {"paper": 2, "stem": "设单位负反馈随动系统的前向通道传递函数为 \\(G(s)=\\frac{25}{s(s+2)}\\)，现引入输出速度反馈\\( K_{t}s \\)构成内环（\\(K_{t}&gt;0\\)）。（共 8 分） <div class=\"formula\"><span class=\"fwrap\">（1）\\(K_{t}=0\\)（无速度反馈）时，求 ζ、σ% 和\\( t_{s}\\)（\\(Δ=5\\%\\)）；（4 分） （2）若要求\\( ζ=0.6\\)，求\\( K_{t}\\)，并求此时的 σ%、\\(t_{s}\\)，说明速度反馈的作用。（4 分）</span>", "answer": "\\(K_{t}=0\\)：\\(ζ=0.2\\)，\\(σ\\%=52.7\\%\\)，\\(t_{s}=3 s\\)；<br>\\(ζ=0.6 \\)时\\( K_{t}=0.16\\)，\\(σ\\%=9.5\\%\\)，\\(t_{s}=1 s\\)，速度反馈增大阻尼、减小超调、缩短调节时间。", "solution": "<p class=\"step\"> \\(K_{t}s\\) 构成内环，所以内环闭环传递函数为 \\(\\frac{25}{s^{2}+(2+25K_{t})s}\\)；外层是单位负反馈，因此闭环特征方程为 \\(s^{2}+(2+25K_{t})s+25=0\\)。</p><p class=\"step\">根据与标准式比较得 \\(ω_{n}=5\\)、\\(2ζω_{n}=2+25K_{t}\\)，可得 \\(K_{t}=0\\) 时 \\(ζ=0.2\\)，算出 \\(σ\\%≈52.7\\%\\)、\\(t_{s}=3\\,\\mathrm{s}\\)。</p><p class=\"step\">由要求 \\(ζ=0.6\\)可知 \\(2+25K_{t}=2ζω_{n}=6\\)，得 \\(K_{t}=0.16\\)；此时 \\(σ\\%≈9.5\\%\\)、\\(t_{s}=1\\,\\mathrm{s}\\)。</p><p class=\"step\">速度反馈增大了阻尼，所以超调减小、调节时间缩短。</p>", "kind": "综合"}, {"paper": 2, "stem": "已知系统的开环传递函数为 \\(G(s)H(s)=\\frac{K_{r}(s+5)}{s(s+1)}\\)（\\(K_{r}&gt;0\\)）。（共 8 分） <div class=\"formula\"><span class=\"fwrap\">（1）绘制根轨迹，求分离点与会合点；（5 分） （2）求闭环极点为复数且实部为 −2 时的\\( K_{r}\\) 及闭环极点。（3 分）</span>", "answer": "实轴段 (−1,0) 与\\( (-\\infty ,-5)\\)；<br>分离点\\( -5+2\\sqrt{5}\\)≈−0.528（\\(K_{r}\\)≈0.056），会合点\\( -5-2\\sqrt{5}\\)≈−9.472（\\(K_{r}\\)≈17.9）；<br>复根实部为 −2 时\\( K_{r}=3\\)，极点为\\( -2\\pm j\\sqrt{11}\\)。", "solution": "<p class=\"step\">开环极点 0、-1，零点 -5，因此 \\(n-m=1\\)，渐近线沿负实轴。</p><p class=\"step\">由于实轴段判据为右侧零极点数之和为奇数，因此实轴段为 \\((-1,0)\\) 与 \\((-∞,-5)\\)。</p><p class=\"step\"> \\(K_{r}=-\\frac{s(s+1)}{s+5}\\)，令 \\(\\frac{dK_{r}}{ds}=0\\) 得 \\(s=-5\\pm2\\sqrt{5}\\)，可见，分离点 -0.528、会合点 -9.472。</p><p class=\"step\">要求闭环复数根的实部为 -2，所以代入实部条件得 \\(K_{r}=3\\)，对应极点为 \\(-2\\pm j\\sqrt{2}\\)。</p>", "kind": "综合"}, {"paper": 2, "stem": "某最小相位系统的开环对数幅频特性渐近线如图 6 所示，低频段斜率为 −20 dB/dec，过点 (1,18 dB)。（共 10 分） <div class=\"formula\"><span class=\"fwrap\">（1）写出系统的开环传递函数；（5 分） （2）求相位裕量并判断闭环稳定性。（5 分）</span> <figure class=\"fig\"><svg viewBox=\"0 0 540 285\" width=\"520\" height=\"274\" xmlns=\"http://www.w3.org/2000/svg\"> <g fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"55\" y1=\"200\" x2=\"505\" y2=\"200\"/> <line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"50\"/> <line x1=\"60\" y1=\"200\" x2=\"480\" y2=\"200\" stroke-dasharray=\"4 3\" stroke-width=\".8\"/> <polyline points=\"158,152 242,176 424,228 470,255\"/> </g> <g fill=\"#111\" font-size=\"12\" font-family=\"SimSun, serif\"> <text x=\"530\" y=\"204\">ω</text><text x=\"64\" y=\"46\">L/dB</text> <text x=\"52\" y=\"204\">O</text> <text x=\"50\" y=\"203\" font-size=\"11\">0</text> <text x=\"56\" y=\"219\">0.1</text><text x=\"188\" y=\"219\">1</text><text x=\"236\" y=\"219\">2</text><text x=\"414\" y=\"219\">40</text><text x=\"466\" y=\"219\">100</text> <text x=\"158\" y=\"144\" font-size=\"12\">18 dB</text> <text x=\"268\" y=\"188\" font-size=\"12\">−20 dB/dec</text> <text x=\"360\" y=\"212\" font-size=\"12\">−40 dB/dec</text> </g> <g stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"242\" y1=\"194\" x2=\"242\" y2=\"206\"/><line x1=\"424\" y1=\"194\" x2=\"424\" y2=\"206\"/> <line x1=\"200\" y1=\"194\" x2=\"200\" y2=\"206\"/> </g> </svg><figcaption>图 6</figcaption></figure>", "answer": "\\(G(s)=\\frac{8}{[s(0.5s+1)(0.025s+1)]}\\)；<br>\\(ω_{c}\\)≈3.75 rad/s，γ≈\\(22.7^{\\circ}&gt;0\\)，闭环稳定但裕量偏小。", "solution": "<p class=\"step\">低频段斜率为 −20 dB/dec，因此是Ⅰ型系统；低频渐近线过 \\((1,18\\,\\mathrm{dB})\\)，从而 \\(20\\lg K=18\\)，得 \\(K≈8\\)。</p><p class=\"step\">斜率由 −20 变为 −40、−60 dB/dec，据此，对应两个惯性环节，转折频率 2 与 40 rad/s，即 \\(T_{1}=0.5\\)、\\(T_{2}=0.025\\)。</p><p class=\"step\">转折频率与环节对应，所以 \\(G(s)=\\frac{8}{s(0.5s+1)(0.025s+1)}\\)。</p><p class=\"step\">令 \\(|G(jω_{c})|=1\\) 解得 \\(ω_{c}≈3.75\\,\\mathrm{rad/s}\\)，因此 \\(\\gamma=180^{\\circ}+\\varphi(\\omega_{c})≈22.7^{\\circ}&gt;0\\)，闭环稳定但裕量偏小。</p>", "kind": "综合"}, {"paper": 3, "stem": "设单位负反馈系统的开环传递函数为 \\(G(s)=\\frac{K}{s(s+4)}\\)（\\(K&gt;0\\)），输入为斜坡信号 \\(r(t)=t\\)。（共 8 分） <div class=\"formula\"><span class=\"fwrap\">（1）若要求稳态误差\\( e_{ss}\\le 0.05\\)，确定 K 的取值范围；（3 分） （2）取满足要求的最小 K，求 ζ、σ% 和\\( t_{s}\\)（\\(Δ=5\\%\\)）；（3 分） （3）说明能否仅靠增大 K 同时满足精度与动态性能要求。（2 分）</span>", "answer": "\\(K\\ge 80\\)；<br>取\\( K=80 \\)时 ζ≈0.224，σ%≈48.6%，\\(t_{s}=1.5 s\\)；<br>仅靠增大 K 不能兼顾，精度提高但超调急剧增大。", "solution": "<p class=\"step\"> \\(G(s)=\\frac{K}{s(s+4)}\\) 是Ⅰ型系统，进而 \\(K_{v}=\\lim_{s→0}sG(s)=\\frac{K}{4}\\)，单位斜坡输入下 \\(e_{ss}=\\frac{1}{K_{v}}=\\frac{4}{K}\\)。</p><p class=\"step\">要求 \\(e_{ss}\\le0.05\\)，由此可见， \\(\\frac{4}{K}\\le0.05\\)，得 \\(K\\ge80\\)。</p><p class=\"step\">取 \\(K=80\\) 时闭环特征方程 \\(s^{2}+4s+80=0\\)，所以 \\(ω_{n}≈8.94\\)、\\(ζ≈0.224\\)，进而 \\(σ\\%≈48.6\\%\\)、\\(t_{s}=1.5\\,\\mathrm{s}\\)。</p><p class=\"step\">只增大 K 会同时减小误差又增大超调，因此精度与平稳性不能兼顾。</p>", "kind": "综合"}, {"paper": 3, "stem": "已知系统的开环传递函数为 \\(G(s)H(s)=\\frac{K_{r}(s+3)}{s(s+5)}\\)（\\(K_{r}&gt;0\\)）。（共 8 分） <div class=\"formula\"><span class=\"fwrap\">（1）绘制根轨迹，说明分离点、会合点是否存在，并写出两条分支的走向；（5 分） （2）判断闭环响应是否会出现超调，并说明\\( K_{r}\\) 增大时闭环极点的移动方向。（3 分）</span>", "answer": "实轴段 (−3,0) 与 (−∞,−5)；<br>无分离点、无会合点；<br>一条分支由 0 趋向 −3，另一条由 −5 趋向 −∞；<br>闭环极点恒为两个不等负实根，无超调。", "solution": "<p class=\"step\">根据开环极点 0、-5，零点 -3，可得 \\(n-m=1\\)，渐近线沿负实轴。</p><p class=\"step\">由实轴段判据可知实轴段为 \\((-3,0)\\) 与 \\((-∞,-5)\\)。</p><p class=\"step\"> \\(K_{r}=-\\frac{s(s+5)}{s+3}\\)，令 \\(\\frac{dK_{r}}{ds}=0\\) 得 \\(s^{2}+6s+15=0\\)，判别式 \\(36-60&lt;0\\)，所以无实根，即无分离点、会合点。</p><p class=\"step\">一条分支由 0 趋向 -3、另一条由 -5 趋向 -∞，因此闭环极点恒为两个不等负实根，系统无超调。</p>", "kind": "综合"}, {"paper": 3, "stem": "某最小相位系统的开环对数幅频特性渐近线如图 9 所示，低频段斜率为 −40 dB/dec，过点 (1,26 dB)。（共 10 分） <div class=\"formula\"><span class=\"fwrap\">（1）写出系统的开环传递函数；（5 分） （2）求相位裕量并判断闭环稳定性。（5 分）</span> <figure class=\"fig\"><svg viewBox=\"0 0 540 300\" width=\"520\" height=\"289\" xmlns=\"http://www.w3.org/2000/svg\"> <g fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"55\" y1=\"200\" x2=\"505\" y2=\"200\"/> <line x1=\"60\" y1=\"240\" x2=\"60\" y2=\"50\"/> <line x1=\"60\" y1=\"200\" x2=\"480\" y2=\"200\" stroke-dasharray=\"4 3\" stroke-width=\".8\"/> <polyline points=\"158,124 200,148 340,228 430,283\"/> </g> <g fill=\"#111\" font-size=\"12\" font-family=\"SimSun, serif\"> <text x=\"530\" y=\"204\">ω</text><text x=\"64\" y=\"46\">L/dB</text> <text x=\"52\" y=\"204\">O</text> <text x=\"50\" y=\"203\" font-size=\"11\">0</text> <text x=\"56\" y=\"219\">0.1</text><text x=\"190\" y=\"219\">1</text><text x=\"330\" y=\"219\">10</text><text x=\"466\" y=\"219\">100</text> <text x=\"204\" y=\"140\" font-size=\"12\">26 dB</text> <text x=\"168\" y=\"108\" font-size=\"12\">−40 dB/dec</text> <text x=\"330\" y=\"252\" font-size=\"12\">−60 dB/dec</text> </g> <g stroke=\"#111\" stroke-width=\"1.2\"> <line x1=\"200\" y1=\"194\" x2=\"200\" y2=\"206\"/><line x1=\"340\" y1=\"194\" x2=\"340\" y2=\"206\"/> </g> </svg><figcaption>图 9</figcaption></figure>", "answer": "\\(G(s)=\\frac{20}{[s^{2}(0.1s+1)]}\\)；<br>\\(ω_{c}=\\sqrt{20}\\)≈4.47 rad/s，γ≈\\(-24.1^{\\circ}&lt;0\\)，闭环不稳定。", "solution": "<p class=\"step\">由于低频段斜率为 −40 dB/dec，因此是Ⅱ型系统；低频渐近线过 \\((1,26\\,\\mathrm{dB})\\)，可见， \\(20\\lg K=26\\)，得 \\(K≈20\\)。</p><p class=\"step\">斜率由 −40 变为 −60 dB/dec，所以对应一个惯性环节，转折频率 10 rad/s，即 \\(T=0.1\\)。</p><p class=\"step\">Ⅱ型系统含两个积分环节和一个惯性环节，因此 \\(G(s)=\\frac{20}{s^{2}(0.1s+1)}\\)。</p><p class=\"step\">令 \\(A(ω_{c})=1\\) 得 \\(ω_{c}=10^{0.65}≈4.47\\,\\mathrm{rad/s}\\)，从而 \\(\\gamma=180^{\\circ}-180^{\\circ}-\\arctan(0.1ω_{c})≈-24.1^{\\circ}&lt;0\\)，闭环不稳定。</p>", "kind": "综合"}, {"paper": 5, "kind": "教材", "stem": "<b>教材习题 3-17（原题）</b>：某控制系统结构如图 3-83（测速反馈 + 单位反馈），其开环传递函数等效为 \\(G(s)=\\frac{K_{1}}{s^{2}+K_{1}τs}\\)，闭环传递函数 \\(Φ(s)=\\frac{K_{1}}{s^{2}+K_{1}τs+K_{1}}\\)。<br>要求：(1) 已知 \\(σ\\%=20\\%\\)、\\(t_{s}=1.8\\,\\mathrm{s}\\)（±5% 误差），求 \\(K_{1}\\) 和 \\(τ\\)；(2) 求 \\(r(t)=1(t)\\)、\\(r(t)=t\\)、\\(r(t)=\\frac{1}{2}t^{2}\\) 三种输入下的稳态误差。", "answer": "① 由 σ%=20% 得 ζ=0.45；由 \\(t_{s}=\\frac{3}{ζω_{n}}=1.8\\) 得 \\(ω_{n}=3.7\\,\\mathrm{rad/s}\\)，故 \\(K_{1}=ω_{n}^{2}=13.7\\)、\\(τ=\\frac{2ζω_{n}}{K_{1}}\\approx0.24\\)；② \\(e_{ss1}=0\\)，\\(e_{ss2}=τ≈0.24\\)，\\(e_{ss3}=∞\\)。", "solution": "<p class=\"step\"> \\(Φ(s)=\\frac{K_{1}}{s^{2}+K_{1}τs+K_{1}}\\) 与标准式对比，据此， \\(ω_{n}^{2}=K_{1}\\)、\\(2ζω_{n}=K_{1}τ\\)。</p><p class=\"step\"> \\(σ\\%=20\\%=e^{-πζ/\\sqrt{1-ζ^{2}}}\\)，所以解得 \\(ζ=0.45\\)。</p><p class=\"step\"> \\(t_{s}=\\frac{3}{ζω_{n}}=1.8\\)，因此 \\(ω_{n}=3.7\\,\\mathrm{rad/s}\\)，进而 \\(K_{1}=ω_{n}^{2}=13.7\\)、\\(τ=\\frac{2ζω_{n}}{K_{1}}≈0.24\\)。</p><p class=\"step\"> \\(G(s)=\\frac{K_{1}}{s(s+K_{1}τ)}\\) 为Ⅰ型系统，进而 \\(e_{ss1}=0\\)、\\(e_{ss2}=τ≈0.24\\)、\\(e_{ss3}=∞\\)。</p>"}, {"paper": 5, "kind": "教材", "stem": "<b>教材习题 5-17（原题）</b>：某最小相位系统的开环对数幅频特性如下图所示，要求：(1) 写出系统开环传递函数；(2) 利用相位裕量判断系统稳定性；(3) 将其对数幅频特性向右平移十倍频，试讨论对系统性能的影响。<figure style=\"margin:14px 0;text-align:center\"><svg viewBox=\"0 0 540 250\" width=\"510\" height=\"236\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"><line x1=\"55\" y1=\"205\" x2=\"500\" y2=\"205\"/><line x1=\"55\" y1=\"205\" x2=\"55\" y2=\"25\"/><line x1=\"55\" y1=\"125\" x2=\"500\" y2=\"125\" stroke-dasharray=\"4 4\" stroke=\"#999\"/><polyline points=\"55,35 155,125 395,125 470,165\" stroke=\"#0b9f7a\" stroke-width=\"2.2\"/><line x1=\"155\" y1=\"205\" x2=\"155\" y2=\"125\" stroke-dasharray=\"3 3\" stroke=\"#999\"/><line x1=\"395\" y1=\"205\" x2=\"395\" y2=\"125\" stroke-dasharray=\"3 3\" stroke=\"#999\"/></g><g fill=\"#111\" font-size=\"12\"><text x=\"8\" y=\"210\">0</text><text x=\"20\" y=\"130\">0</text><text x=\"14\" y=\"40\">L(ω)/dB</text><text x=\"470\" y=\"225\">ω/(rad/s)</text><text x=\"60\" y=\"222\">0.01</text><text x=\"146\" y=\"222\">0.1</text><text x=\"385\" y=\"222\">20</text><text x=\"200\" y=\"70\">-20 dB/dec</text><text x=\"250\" y=\"150\">-40 dB/dec</text><text x=\"400\" y=\"195\">-60 dB/dec</text></g></svg></figure>", "answer": "① \\(G(s)=\\frac{10}{s(10s+1)(0.05s+1)}\\)；② 近似取 \\(G(s)≈\\frac{1}{s^{2}}\\) 得 \\(ω_{c}≈1\\,\\mathrm{rad/s}\\)，\\(γ=180^{\\circ}-90^{\\circ}-\\arctan10-\\arctan0.05≈2.85^{\\circ}>0\\)，闭环稳定；③ 右移十倍频后 \\(G(s)=\\frac{100}{s(s+1)(0.005s+1)}\\)，\\(ω_{c}=10\\)、\\(γ\\) 不变，稳定性不变、快速性变好。", "solution": "<p class=\"step\">低频段斜率为 −20 dB/dec、转折频率 0.1 与 20 rad/s，由此可见， \\(G(s)=\\frac{10}{s(10s+1)(0.05s+1)}\\)。</p><p class=\"step\">近似 \\(G(s)≈\\frac{1}{s^{2}}\\)，所以令 \\(\\left|\\frac{1}{ω^{2}}\\right|=1\\) 得 \\(ω_{c}=1\\,\\mathrm{rad/s}\\)。</p><p class=\"step\"> \\(\\gamma=180^{\\circ}-90^{\\circ}-\\arctan10-\\arctan0.05≈2.85^{\\circ}&gt;0\\)，因此闭环稳定。</p><p class=\"step\">根据右移十倍频只改变时间常数、不改变相频曲线形状，可得 \\(\\gamma\\) 不变、稳定性不变，而 \\(ω_{c}\\) 增大到 10，快速性变好。</p>"}, {"paper": 5, "kind": "教材", "stem": "<b>教材习题 4-3（原题）</b>：已知开环传递函数 \\(G(s)=\\frac{K_{r}(s+1.5)(s+5.5)}{s(s+1)(s+5)}\\)，要求用解析法绘制系统的根轨迹（标出起点、终点、实轴段、渐近线与分离/会合点，并画出大致图形）。", "answer": "① 起点：开环极点 \\(0,-1,-5\\)；终点：开环零点 \\(-1.5,-5.5\\) 及 1 条无穷远分支（\\(n-m=1\\)）；② 实轴段：\\((-1,0)\\)、\\((-5,-1.5)\\)、\\((-∞,-5.5)\\)；③ 渐近线 1 条，沿负实轴方向（\\(180^{\\circ}\\)）；④ 分离点/会合点由 \\(dK_{r}/ds=0\\) 求得；⑤ 图形：两条分支在实轴段上分离、会合，形成围绕零点的环状曲线（教材图）。", "solution": "<p class=\"step\">由 \\(n=3\\)（极点 0、-1、-5）、\\(m=2\\)（零点 -1.5、-5.5）可知起点为极点、终点为零点，另有 \\(n-m=1\\) 条分支趋向无穷远。</p><p class=\"step\">实轴段判据为右侧零极点数之和为奇数，所以实轴段为 \\((-1,0)\\)、\\((-5,-1.5)\\)、\\((-∞,-5.5)\\)。</p><p class=\"step\">渐近线只有 1 条，因此沿负实轴方向（\\(180^{\\circ}\\)）。</p><p class=\"step\">由于分离/会合点由 \\(\\frac{dK_{r}}{ds}=0\\) 求出，因此取 \\(K_{r}&gt;0\\) 的有效解即可确定位置。</p><p class=\"step\">按相角条件逐点描迹，可见，根轨迹为围绕零点的环状曲线（教材图）。</p>"}]};

    // 老师钦定的 28 条考点对应的题（当前题库全部覆盖）；后续新增扩展题只需从集合中去掉下标
    const STARRED_28 = new Set(questions.map((_, i) => i));

    const state = {
      section: 'quiz',
      current: 0,
      mode: 'answer',
      orderMode: 'random',
      order: questions.map((_, index) => index),
      answers: {},
      revealed: false,
      optionOrders: {},
      favorites: loadFavorites(),
      wrong: loadWrong(),
      visited: new Set(),
      poolMode: 'all'
    };
    const questionCard = document.getElementById('questionCard');
    const questionGrid = document.getElementById('questionGrid');

    function currentQuestionId() { return state.order[state.current]; }
    function currentQuestion() { return questions[currentQuestionId()]; }

    // 当前练习题库：全部题目，或仅收藏
    function poolIds() {
      if (state.poolMode === 'fav') return Array.from(state.favorites).sort((a, b) => a - b);
      if (state.poolMode === 'wrong') return wrongOrderIds();
      return questions.map((_, i) => i);
    }
    function buildOrder(mode) {
      let ids = poolIds();
      if (mode === 'random' && state.poolMode !== 'wrong') {
        for (let i = ids.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ids[i], ids[j]] = [ids[j], ids[i]];
        }
      }
      state.order = ids;
      state.optionOrders = {};
      state.current = 0;
      state.revealed = false;
    }
    function toggleFavPractice() {
      if (state.poolMode === 'fav') {
        state.poolMode = 'all';
        buildOrder(state.orderMode);
        render();
        return;
      }
      if (!state.favorites.size) return;
      state.poolMode = 'fav';
      buildOrder(state.orderMode);
      render();
    }

    // 乱序模式：只打乱选项“内容”的顺序，显示字母始终按 A、B、C、D 排列
    function optionLayout(q) {
      if (q.type === 'fill') return [];
      if (state.orderMode !== 'random') {
        return q.options.map(([key, text]) => ({ disp: key, orig: key, text }));
      }
      const id = currentQuestionId();
      if (!state.optionOrders[id]) {
        const keys = q.options.map(o => o[0]);
        for (let i = keys.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [keys[i], keys[j]] = [keys[j], keys[i]];
        }
        state.optionOrders[id] = keys;
      }
      const map = {};
      q.options.forEach(([key, text]) => { map[key] = text; });
      return state.optionOrders[id].map((orig, pos) => ({ disp: 'ABCD'[pos], orig, text: map[orig] }));
    }

    function correctDisplay(q) {
      if (q.type === 'fill') return '';
      const hit = optionLayout(q).find(o => o.orig === q.answer);
      return hit ? hit.disp : q.answer;
    }

    function chosenDisplay(q) {
      const chosen = state.answers[currentQuestionId()];
      if (!chosen || q.type === 'fill') return chosen;
      const hit = optionLayout(q).find(o => o.orig === chosen);
      return hit ? hit.disp : chosen;
    }

    function isCorrect(q, record) {
      return q.type === 'fill' ? record === 'correct' : record === q.answer;
    }

    function optionClass(key, q) {
      const correct = correctDisplay(q);
      if (state.mode === 'recite') return key === correct ? 'correct' : 'muted';
      if (!state.answers[currentQuestionId()]) return '';
      if (key === correct) return 'correct';
      if (key === chosenDisplay(q)) return 'wrong';
      return 'muted';
    }

    // 填空：答案填进空里，但保留下划线原来的长度（答案显示在横线上方）
    function fillStemWithAnswers(q) {
      const stem = q.stem || '';
      const blanks = (stem.match(/_{2,}/g) || []).length;
      if (!blanks || !(q.answer || q.answerHtml)) return stem;
      let parts = [];
      const html = q.answerHtml || '';
      const strongs = Array.from(html.matchAll(/<strong>([\s\S]*?)<\/strong>/g)).map((m) => m[1]);
      if (strongs.length >= blanks) {
        parts = strongs.slice(0, blanks);
      } else {
        const maths = Array.from(html.matchAll(/<span class="math">([\s\S]*?)<\/span>/g)).map((m) => m[1]);
        if (maths.length >= blanks) {
          parts = maths.slice(0, blanks);
        } else {
          const raw = (q.answer || '').split(/[；;]/).map((s) => s.trim()).filter(Boolean);
          if (raw.length >= blanks) parts = raw.slice(0, blanks);
        }
      }
      if (!parts.length) parts = [q.answer || ''];
      let i = 0;
      return stem.replace(/_{2,}/g, (m) => (i < parts.length
        ? '<span class="blank-ans">' + parts[i++] + '</span>'
        : m));
    }

    // 公式字号自适应：题干里的公式与文字同号，选项里的复杂公式略放大，解析里适中
    function tuneMathScale(root) {
      if (!root) return;
      const els = Array.from(root.querySelectorAll('mjx-container'));
      if (!els.length) return;
      const COMPLEX = '[data-mml-node="mfrac"], [data-mml-node="msqrt"], [data-mml-node="mroot"], [data-mml-node="munderover"], [data-mml-node="munder"], [data-mml-node="mtable"]';
      const optionHasComplex = els.some((el) => el.closest('.option-content') && el.querySelector(COMPLEX));
      els.forEach((el) => {
        const inStem = !!el.closest('.question-text');
        const inOption = !!el.closest('.option-content');
        const complex = !!el.querySelector(COMPLEX);
        let size;
        if (inStem) size = el.getAttribute('display') === 'true' ? '1.05em' : '1em';
        else if (inOption) size = optionHasComplex ? '1.12em' : '1em';
        else size = complex ? '1.05em' : '1em';
        el.style.fontSize = size;
      });
    }

    // 公式过宽时自动缩小，避免撑出卡片
    function fitMathWidth(root) {
      if (!root) return;
      root.querySelectorAll('.option-content, .question-text, .solution').forEach((box) => {
        const avail = box.clientWidth - 2;
        if (avail <= 20) return;
        box.querySelectorAll('mjx-container').forEach((el) => {
          const w = el.getBoundingClientRect().width;
          if (w > avail) {
            const cur = parseFloat(getComputedStyle(el).fontSize) || 16;
            el.style.fontSize = Math.max(10, cur * (avail / w) * 0.98) + 'px';
          }
        });
      });
    }

    function questionHTML() {
      const q = currentQuestion();
      const isFill = q.type === 'fill';
      const chosen = state.answers[currentQuestionId()];
      const showSolution = state.mode === 'recite' || Boolean(chosen) || (isFill && state.revealed);
      const correctLetter = isFill ? '' : correctDisplay(q);
      const pickedLetter = isFill ? '' : chosenDisplay(q);
      const options = isFill ? '' : optionLayout(q).map(({ disp, text }) => {
        const cls = optionClass(disp, q);
        let status = '';
        if (showSolution && disp === correctLetter && !(state.mode === 'answer' && pickedLetter === disp)) status = '<span class="option-status">正确答案</span>';
        if (state.mode === 'answer' && pickedLetter === disp && disp !== correctLetter) status = '<span class="option-status">你的选择</span>';
        return `<button type="button" class="option ${cls}" data-option="${disp}" ${state.mode === 'recite' || chosen ? 'disabled' : ''} aria-label="选项 ${disp}"><span class="option-letter">${disp}</span><span class="option-content">${text}</span>${status}</button>`;
      }).join('');

      const isFav = state.favorites.has(currentQuestionId());
      const responseArea = isFill
        ? (showSolution ? '' : '<div class="recall-panel"><p>先独立回忆各空内容，再核对参考答案。</p><button type="button" class="recall-btn" id="revealBtn">显示答案</button></div>')
        : `<div class="options ${state.mode === 'answer' ? 'answer-mode' : ''}">${options}</div>`;
      const answerContent = isFill ? (q.answerHtml || q.answer) : correctLetter;
      const choiceResult = !isFill && state.mode === 'answer' && pickedLetter && pickedLetter !== correctLetter
        ? `<span class="user-wrong">你的选择：${pickedLetter}</span>` : '';
      const fillResult = isFill && chosen
        ? `<span class="fill-result ${chosen === 'correct' ? 'good' : 'bad'}">自评：${chosen === 'correct' ? '答对' : '需复习'}</span>` : '';
      const selfCheck = isFill && state.mode === 'answer' && showSolution && !chosen
        ? '<div class="self-check"><span>根据刚才的回忆情况自评</span><div><button type="button" data-grade="correct">我答对了</button><button type="button" data-grade="wrong">需要复习</button></div></div>' : '';
      const solution = showSolution ? `<div class="solution">
        <div class="solution-head">
          <div class="answer-line">${isFill ? '参考答案' : '正确答案'}：${answerContent}${choiceResult}${fillResult}</div>
          ${state.mode === 'answer' && chosen ? '<button type="button" class="redo" id="redoBtn">重做本题</button>' : ''}
        </div>
        ${selfCheck}
        <h2>解题思路</h2>
        ${q.analysis}
        ${q.caution ? `<div class="caution"><strong>题目校注</strong>${q.caution}</div>` : ''}
      </div>` : '';

      return `<div class="question-meta">
        <div class="tags"><span class="tag">${isFill ? '填空题' : '单选题'}</span>${STARRED_28.has(currentQuestionId()) ? '<span class="tag star-tag">🌟 28条考点</span>' : ''}${wrongCountOf(currentQuestionId()) ? `<span class="wrong-chip">错 ${wrongCountOf(currentQuestionId())} 次</span>` : ''}${timed.active ? `<span class="timer-chip" id="timerChip"><i class="timer-dot"></i><b id="chipTotal">00:00</b><span class="timer-sep">·</span>本题 <b id="chipQ">0s</b></span><button type="button" class="chip-finish" id="chipPause" title="暂停计时">暂停</button><button type="button" class="chip-finish" id="chipFinish" title="结束计时并生成报告">结束</button>` : ''}</div>
        <div class="meta-right">
          <div class="counter"><strong>${String(state.current + 1).padStart(2, '0')}</strong> / ${state.order.length}</div>
          <button type="button" class="fav-btn ${isFav ? 'on' : ''}" id="favBtn" aria-pressed="${isFav}" aria-label="${isFav ? '取消收藏' : '收藏本题'}" title="${isFav ? '取消收藏' : '收藏本题'}"><span class="fav-icon">${isFav ? '★' : '☆'}</span><span class="fav-text">收藏</span></button>
        </div>
      </div>
      <div class="question-text">${isFill && showSolution ? fillStemWithAnswers(q) : q.stem}</div>
      ${responseArea}
      ${solution}
      <div class="question-actions">
        <button type="button" class="nav-btn" id="prevBtn" ${state.current === 0 ? 'disabled' : ''}>上一题</button>
        <button type="button" class="nav-btn primary" id="nextBtn" ${state.current === state.order.length - 1 ? 'disabled' : ''}>下一题</button>
      </div>
      <div class="swipe-hint" aria-hidden="true">左右滑动切换题目</div>`;
    }

    function bindQuestionEvents() {
      questionCard.querySelectorAll('[data-option]').forEach(btn => btn.addEventListener('click', () => chooseAnswer(btn.dataset.option)));
      const chipFinish = document.getElementById('chipFinish');
      if (chipFinish) chipFinish.addEventListener('click', finishTimed);
      const chipPause = document.getElementById('chipPause');
      if (chipPause) chipPause.addEventListener('click', togglePauseTimed);
      const favBtn = document.getElementById('favBtn');
      if (favBtn) favBtn.addEventListener('click', toggleFavorite);
      questionCard.querySelectorAll('[data-grade]').forEach(btn => btn.addEventListener('click', () => {
        const id = currentQuestionId();
        const grade = btn.dataset.grade;
        state.answers[id] = grade;
        recordWrongResult(id, grade === 'correct');
        handleWrongAfterAnswer(id, grade === 'correct');
        timedFreezeCurrent();
        state.revealed = true;
        render();
      }));
      document.getElementById('prevBtn').addEventListener('click', () => { autoStartTimed(); goTo(state.current - 1); });
      document.getElementById('nextBtn').addEventListener('click', () => { autoStartTimed(); goTo(state.current + 1); });
      const reveal = document.getElementById('revealBtn');
      if (reveal) reveal.addEventListener('click', () => { state.revealed = true; render(); });
      const redo = document.getElementById('redoBtn');
      if (redo) redo.addEventListener('click', () => {
        delete state.answers[currentQuestionId()];
        state.revealed = false;
        render();
      });
    }

    let questionRenderSeq = 0;
    let pendingScrollAnchor = null;
    let mathGaveUp = false;
    function renderQuestionSmooth() {
      const seq = ++questionRenderSeq;
      const html = questionHTML();
      const plain = () => {
        if (seq !== questionRenderSeq) return;
        questionCard.innerHTML = html;
        bindQuestionEvents();
        tuneMathScale(questionCard);
        fitMathWidth(questionCard);
        if (typeof timed !== 'undefined' && timed.active) updateTimerUI();
        document.body.classList.add('math-ready');
        if (pendingScrollAnchor !== null) {
          const top = questionCard.getBoundingClientRect().top;
          if (Math.abs(top - pendingScrollAnchor) > 1) window.scrollBy(0, top - pendingScrollAnchor);
          pendingScrollAnchor = null;
        }
      };
      const ready = (window.MathJax && MathJax.startup && MathJax.startup.promise)
        ? MathJax.startup.promise
        : Promise.resolve();
      ready.then(() => {
      if (seq !== questionRenderSeq) return;
      if (!window.MathJax || typeof MathJax.typesetPromise !== 'function') {
        // 公式引擎还没加载好：先不渲染原始 LaTeX，等引擎就绪后再渲染（期间显示“公式加载中”）
        if (!mathGaveUp) return;
        plain();
        return;
      }
      const holder = document.createElement('div');
      holder.className = 'question-card';
      holder.setAttribute('aria-hidden', 'true');
      holder.style.position = 'absolute';
      holder.style.left = '-99999px';
      holder.style.top = '0';
      holder.style.width = questionCard.getBoundingClientRect().width + 'px';
      holder.style.visibility = 'hidden';
      holder.innerHTML = html;
      document.body.appendChild(holder);
      const finish = () => {
        if (seq !== questionRenderSeq) { holder.remove(); return; }
        tuneMathScale(holder);
        fitMathWidth(holder);
        questionCard.innerHTML = holder.innerHTML;
        holder.remove();
        bindQuestionEvents();
        if (typeof timed !== 'undefined' && timed.active) updateTimerUI();
        document.body.classList.add('math-ready');
        if (pendingScrollAnchor !== null) {
          const top = questionCard.getBoundingClientRect().top;
          if (Math.abs(top - pendingScrollAnchor) > 1) window.scrollBy(0, top - pendingScrollAnchor);
          pendingScrollAnchor = null;
        }
      };
      MathJax.typesetPromise([holder]).then(finish).catch(() => { holder.remove(); if (seq === questionRenderSeq) plain(); });
      });
    }

    // ================= 顶部：选填 / 简答 / 计算 =================
    const PAPER_NAMES = ['预测卷一', '预测卷二', '预测卷三', '2025真题卷', '教材习题'];
    function switchSection(sec) {
      if (sec === state.section) return;
      state.section = sec;
      document.querySelectorAll('.top-tab').forEach((b) => b.classList.toggle('active', b.dataset.section === sec));
      const isQuiz = sec === 'quiz';
      document.querySelector('main.wrap').hidden = !isQuiz;
      document.getElementById('paperView').hidden = isQuiz;
      document.getElementById('startMask').hidden = true;
      if (!isQuiz && timed.active && !timed.paused) togglePauseTimed();
      if (!isQuiz) renderPaper(sec);
      window.scrollTo({ top: 0 });
    }
    // 解题步骤按顺序编号（①②③…），并去掉原文重复的（1）（2）
    const SOL_NOS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
    function numberSolutionSteps(html) {
      const src = String(html || '');
      if (!src) return src;
      const count = (src.match(/<p class="step">/g) || []).length;
      if (count < 1) return src;
      let i = 0;
      return src.replace(/<p class="step">([\s\S]*?)<\/p>/g, (m, inner) => {
        const body = inner.replace(/^\s*(（\d+）|\(\d+\)|\d+[.、]\s*|[①-⑳])\s*/, '');
        const no = SOL_NOS[i] || ((i + 1) + '.');
        i++;
        return '<p class="step"><b class="sol-no">' + no + '</b>' + body + '</p>';
      });
    }

    function renderPaper(sec) {
      if (sec === 'exam') {
        document.getElementById('paperTitle').textContent = '2025-2026 学年第一学期 · 自动控制原理考核试题';
        document.getElementById('paperSub').textContent = '原卷 5 页 · 左右滑动查看，可双指放大';
        let html = '<div class="exam-tip">这是老师发的原卷（含答案痕迹）：一、填空 10 题；二、单选 10 题；三、简答 4 题；四、计算 3 题；五、综合 3 题。</div>';
        for (let n = 1; n <= 5; n++) {
          html += '<div class="exam-page"><img src="exam2025/exam2025-' + n + '.jpg" loading="lazy" alt="真题第 ' + n + ' 页"></div>';
        }
        document.getElementById('paperList').innerHTML = html;
        return;
      }
      const rawList = paperData[sec] || [];
      // 简单的排前面：按题干+答案+解析的文字量、公式量、图形量估算难度
      const weight = (it) => {
        const all = (it.stem + it.answer + it.solution).replace(/<[^>]+>/g, '');
        const figs = (it.stem.match(/<figure/g) || []).length + (it.solution.match(/<figure/g) || []).length;
        const formulas = (it.stem + it.answer + it.solution).match(/\\\(/g);
        return all.length + figs * 380 + (formulas ? formulas.length : 0) * 45 + (it.kind === '综合' ? 260 : 0);
      };
      const list = rawList.slice().sort((a, b) => weight(a) - weight(b));
      const labelOf = (it) => rawList.filter((x) => x.paper === it.paper && (x.kind || '') === (it.kind || '')).indexOf(it) + 1;
      document.getElementById('paperTitle').textContent = sec === 'short' ? '简答题' : '计算题（含综合题）';
      document.getElementById('paperSub').textContent = '共 ' + list.length + ' 题 · 已按由易到难排序 · 点「显示答案」看参考答案与解题步骤';
      document.getElementById('paperList').innerHTML = list.map((it, idx) => {
        const kind = it.kind || '简答';
        // 多个要点上下排，一眼看清
        const cleanPart = (s) => s.replace(/^(<br\s*\/?>|\s)+/i, '').replace(/(<br\s*\/?>|\s)+$/i, '').trim();
        // 只按全角“；”拆分；ASCII “;” 可能是 &gt; 等实体的组成部分，不能拆
        let parts = String(it.answer || '').split('；').map(cleanPart).filter(Boolean);
        // 一句话里含“定义…。作用…”这类多个完整句子时，也拆成多行
        if (parts.length === 1) {
          const sents = String(it.answer || '').split(/(?<=。)/).map(cleanPart).filter((s) => s.replace(/[。\s]/g, '').length > 0);
          if (sents.length > 1) parts = sents;
        }
        const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
        const stripNum = (s) => s.replace(/^[①-⑳]\s*/, '').replace(/^（\d+）\s*/, '').replace(/^\d+[.、]\s*/, '');
        const ansHtml = parts.length > 1
          ? parts.map((s, i) => '<div class="paper-key-line"><span class="paper-key-no">' + (CIRCLED[i] || (i + 1) + '.') + '</span>' + stripNum(s) + '</div>').join('')
          : it.answer;
        return '<article class="paper-card">' +
          '<div class="paper-meta"><span class="paper-star" title="老师 28 条考点覆盖">🌟</span>' + (PAPER_NAMES[it.paper - 1] || '预测卷') + ' · ' + kind + ' ' + labelOf(it) + '</div>' +
          '<div class="paper-q">' + it.stem + '</div>' +
          '<div class="paper-actions"><button type="button" class="paper-toggle" data-i="' + idx + '">显示答案</button></div>' +
          '<div class="paper-ans" hidden><div class="paper-key"><b class="paper-key-label">参考答案：</b>' + ansHtml + '</div><div class="paper-sol"><b class="paper-sol-title">解题步骤：</b>' + numberSolutionSteps(it.solution) + '</div></div>' +
          '</article>';
      }).join('');
      document.querySelectorAll('#paperList .paper-toggle').forEach((btn) => {
        btn.addEventListener('click', () => {
          const ans = btn.closest('.paper-card').querySelector('.paper-ans');
          const show = ans.hidden;
          ans.hidden = !show;
          btn.textContent = show ? '收起答案' : '显示答案';
        });
      });
      typesetPaper();
    }
    function typesetPaper() {
      const el = document.getElementById('paperList');
      if (!el) return;
      (function run() {
        if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
          MathJax.typesetPromise([el]).then(() => { tuneMathScale(el); }).catch(() => {});
        } else {
          setTimeout(run, 150);
        }
      })();
    }

    function renderNavigation() {
      questionGrid.innerHTML = state.order.map((questionId, i) => {
        const q = questions[questionId];
        const answer = state.answers[questionId];
        const status = answer ? (isCorrect(q, answer) ? 'done' : 'error') : '';
        const fav = state.favorites.has(questionId) ? 'fav' : '';
        return `<button type="button" class="q-num ${i === state.current ? 'current' : ''} ${status} ${fav}" data-index="${i}" aria-label="第 ${i + 1} 题">${i + 1}</button>`;
      }).join('');
      questionGrid.querySelectorAll('[data-index]').forEach(btn => btn.addEventListener('click', () => goTo(Number(btn.dataset.index))));
    }

    function renderStats() {
      const inPool = new Set(state.order);
      const entries = Object.entries(state.answers).filter(([i]) => inPool.has(Number(i)));
      const answered = entries.length;
      const correct = entries.filter(([i, a]) => isCorrect(questions[i], a)).length;
      const total = state.order.length || 1;
      const visited = Array.from(state.visited).filter((i) => inPool.has(i)).length;
      document.getElementById('answeredStat').textContent = answered;
      document.getElementById('correctStat').textContent = correct;
      document.getElementById('rateStat').textContent = answered ? `${Math.round(correct / answered * 100)}%` : '—';
      document.getElementById('progressBar').style.width = `${Math.min(visited / total, 1) * 100}%`;
      document.getElementById('progressText').textContent = `${visited} / ${state.order.length}`;
      document.getElementById('modeLabel').textContent = state.mode === 'answer' ? '答题模式' : '背题模式';
    }


    function loadFavorites() {
      try {
        const raw = localStorage.getItem('autocontrol-quiz-favorites-v1');
        const arr = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(arr) ? arr : []);
      } catch (e) { return new Set(); }
    }

    function saveFavorites() {
      try { localStorage.setItem('autocontrol-quiz-favorites-v1', JSON.stringify(Array.from(state.favorites))); } catch (e) {}
    }

    function loadWrong() {
      try {
        const raw = localStorage.getItem('autocontrol-quiz-wrong-v1');
        const obj = raw ? JSON.parse(raw) : {};
        if (!obj || typeof obj !== 'object') return {};
        const out = {};
        Object.keys(obj).forEach((k) => { const n = Number(obj[k]) || 0; if (n > 0) out[k] = n; });
        return out;
      } catch (e) { return {}; }
    }
    function saveWrong() {
      try { localStorage.setItem('autocontrol-quiz-wrong-v1', JSON.stringify(state.wrong)); } catch (e) {}
    }
    function wrongCountOf(id) { return state.wrong[id] || 0; }
    function wrongOrderIds() {
      return Object.keys(state.wrong)
        .map(Number)
        .filter((id) => state.wrong[id] > 0)
        .sort((a, b) => state.wrong[b] - state.wrong[a] || a - b);
    }
    function recordWrongResult(id, correct) {
      if (correct) {
        if (state.wrong[id]) { delete state.wrong[id]; saveWrong(); }
      } else {
        state.wrong[id] = (state.wrong[id] || 0) + 1;
        saveWrong();
      }
      renderWrong();
    }
    function handleWrongAfterAnswer(id, correct) {
      if (state.poolMode !== 'wrong') return;
      if (!correct) return;
      const idx = state.order.indexOf(id);
      const rest = wrongOrderIds();
      if (!rest.length) {
        state.poolMode = 'all';
        buildOrder(state.orderMode);
        return;
      }
      state.order = rest;
      state.current = Math.max(0, Math.min(idx, rest.length - 1));
      state.revealed = false;
    }
    function toggleWrongPractice() {
      if (state.poolMode === 'wrong') {
        state.poolMode = 'all';
        buildOrder(state.orderMode);
        render();
        return;
      }
      if (!wrongOrderIds().length) return;
      state.poolMode = 'wrong';
      // 进入错题集时清掉这些题的旧作答，方便重新做一遍（答对即消除）
      wrongOrderIds().forEach((id) => { delete state.answers[id]; });
      buildOrder(state.orderMode);
      render();
    }
    function renderWrong() {
      const btn = document.getElementById('wrongPracticeBtn');
      const count = document.getElementById('wrongCount');
      if (!btn || !count) return;
      const n = wrongOrderIds().length;
      const inWrong = state.poolMode === 'wrong';
      count.textContent = n;
      btn.disabled = !inWrong && n === 0;
      btn.classList.toggle('on', inWrong);
      btn.title = inWrong ? '退出错题集，回到全部题目' : (n ? '进入错题集：按答错次数从多到少复习' : '还没有错题');
      const clearBtn = document.getElementById('wrongClearBtn');
      if (clearBtn) clearBtn.disabled = n === 0;
    }
    function clearWrongCollection() {
      if (!wrongOrderIds().length) return;
      if (!window.confirm('确定清空错题集吗？清空后无法恢复。')) return;
      state.wrong = {};
      saveWrong();
      if (state.poolMode === 'wrong') {
        state.poolMode = 'all';
        buildOrder(state.orderMode);
      }
      render();
    }

    function updateFavButton() {
      const btn = document.getElementById('favBtn');
      if (!btn) return;
      const isFav = state.favorites.has(currentQuestionId());
      btn.classList.toggle('on', isFav);
      btn.setAttribute('aria-pressed', String(isFav));
      btn.setAttribute('title', isFav ? '取消收藏' : '收藏本题');
      btn.setAttribute('aria-label', isFav ? '取消收藏' : '收藏本题');
      const icon = btn.querySelector('.fav-icon');
      if (icon) icon.textContent = isFav ? '★' : '☆';
    }

    function toggleFavorite() {
      const id = currentQuestionId();
      const removed = state.favorites.has(id);
      if (removed) state.favorites.delete(id);
      else state.favorites.add(id);
      saveFavorites();
      // 收藏夹刷题模式下取消收藏：本题从当前套题中移除
      if (state.poolMode === 'fav' && removed) {
        const idx = state.order.indexOf(id);
        state.order = state.order.filter(x => x !== id);
        if (!state.order.length) {
          state.poolMode = 'all';
          buildOrder(state.orderMode);
        } else {
          state.current = Math.max(0, Math.min(idx, state.order.length - 1));
          state.revealed = false;
        }
        render();
        return;
      }
      // 只更新收藏相关元素，不重绘题目卡片，避免 MathJax 重新排版引起的位移/缩放
      updateFavButton();
      const navBtn = questionGrid.querySelector('.q-num[data-index="' + state.current + '"]');
      if (navBtn) navBtn.classList.toggle('fav', state.favorites.has(id));
      renderFavorites();
    }

    function renderFavorites() {
      const count = document.getElementById('favCount');
      const btn = document.getElementById('favPracticeBtn');
      if (!count || !btn) return;
      const n = state.favorites.size;
      const inFav = state.poolMode === 'fav';
      count.textContent = n;
      btn.classList.toggle('on', inFav);
      btn.disabled = !inFav && n === 0;
      const icon = btn.querySelector('.fav-toggle-icon');
      if (icon) icon.textContent = inFav ? '★' : '☆';
      btn.title = inFav ? '退出收藏夹，回到全部题目' : (n ? '进入收藏夹，只刷已收藏的题目' : '还没有收藏的题目');
    }

    function typesetMath() {
      if (!window.MathJax) return;
      var target = document.getElementById('questionCard');
      var run = function () {
        if (MathJax.typesetPromise) MathJax.typesetPromise([target]).catch(function () {});
      };
      if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
      else run();
    }

    function render() {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === state.mode));
      document.querySelectorAll('.order-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.order === state.orderMode));
      document.getElementById('orderSwitch').hidden = true; /* 正序/乱序入口已隐藏，默认乱序 */
      state.visited.add(currentQuestionId());
      renderQuestionSmooth();
      renderNavigation();
      renderFavorites();
      renderWrong();
      renderStats();
    }

    function chooseAnswer(dispKey) {
      if (state.mode !== 'answer' || currentQuestion().type === 'fill' || state.answers[currentQuestionId()]) return;
      autoStartTimed();
      const q = currentQuestion();
      const id = currentQuestionId();
      const hit = optionLayout(q).find(o => o.disp === dispKey);
      const orig = hit ? hit.orig : dispKey;
      state.answers[id] = orig;
      const correct = orig === q.answer;
      recordWrongResult(id, correct);
      handleWrongAfterAnswer(id, correct);
      timedFreezeCurrent();
      render();
    }

    function setOrder(mode) {
      if (mode === state.orderMode) return; // 点当前顺序按钮不重置
      const hasRecords = Object.keys(state.answers).length > 0 || state.visited.size > 0;
      if (hasRecords && !window.confirm('切换题目顺序会重新开始，清空本次的作答记录和完成进度，确定吗？')) return;
      if (timed.active) { timedNoteCurrent(); timed.qStartAt = Date.now(); }
      const previousOrder = state.order.join(',');
      state.orderMode = mode;
      state.optionOrders = {};
      // 正序/乱序互相切换 = 重新开始（清空作答与进度）
      state.answers = {};
      state.visited = new Set();
      buildOrder(mode);
      if (mode === 'random' && state.order.length > 1 && state.order.join(',') === previousOrder) {
        buildOrder(mode);
      }
      render();
    }


    /* ================= 计时练习 ================= */
    const timed = { active: false, paused: false, pausedAt: 0, startedAt: 0, endedAt: 0, qStartAt: 0, qId: null, currentDone: false, per: {}, timerId: 0 };

    function fmtClock(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    function fmtDur(ms) {
      const total = Math.max(0, Math.round(ms / 1000));
      if (total < 60) return total + 's';
      const m = Math.floor(total / 60);
      const s = total % 60;
      return s ? m + 'm' + String(s).padStart(2, '0') + 's' : m + '分钟';
    }
    function timedNoteCurrent() {
      if (!timed.active) return;
      const now = timed.paused ? timed.pausedAt : Date.now();
      const id = currentQuestionId();
      if (!timed.qStartAt) { timed.qStartAt = now; return; }
      if (timed.qId === id && timed.currentDone) { timed.qStartAt = now; return; }
      timed.per[id] = (timed.per[id] || 0) + (now - timed.qStartAt);
      timed.qStartAt = now;
    }
    // 作答后：本题停止计时（不再累加），直到切到下一题
    function timedFreezeCurrent() {
      if (!timed.active) return;
      timedNoteCurrent();
      timed.currentDone = true;
      timed.qId = currentQuestionId();
      timed.qStartAt = timed.paused ? timed.pausedAt : Date.now();
      updateTimerUI();
    }
    // 切换到新题：重新开始计本题用时
    function timedStartNewQuestion() {
      if (!timed.active) return;
      timed.qId = currentQuestionId();
      timed.currentDone = false;
      timed.qStartAt = timed.paused ? timed.pausedAt : Date.now();
    }
    function updateTimerUI() {
      if (!timed.active) return;
      const now = timed.paused ? timed.pausedAt : Date.now();
      const elTotal = document.getElementById('chipTotal');
      const elQ = document.getElementById('chipQ');
      if (elTotal) elTotal.textContent = fmtClock(now - timed.startedAt);
      if (elQ) {
        if (timed.currentDone) elQ.textContent = fmtDur(timed.per[currentQuestionId()] || 0);
        else elQ.textContent = fmtDur(now - timed.qStartAt);
      }
      const chip = document.getElementById('timerChip');
      if (chip) chip.classList.toggle('paused', timed.paused);
      const pauseBtn = document.getElementById('chipPause');
      if (pauseBtn) pauseBtn.textContent = timed.paused ? '继续' : '暂停';
    }
    function togglePauseTimed() {
      if (!timed.active) return;
      if (!timed.paused) {
        timed.paused = true;
        timed.pausedAt = Date.now();
      } else {
        const delta = Date.now() - timed.pausedAt;
        timed.startedAt += delta;
        timed.qStartAt += delta;
        timed.paused = false;
        timed.pausedAt = 0;
      }
      updateTimerUI();
    }
    function startTimed(force) {
      if (timed.active) return;
      if (!force && Object.keys(state.answers).length && !window.confirm('开始计时练习会清空当前答题记录并从头开始，确定吗？')) return;
      clearInterval(timed.timerId);
      state.answers = {};
      state.visited = new Set();
      state.revealed = false;
      state.mode = 'answer';
      buildOrder(state.orderMode);
      timed.active = true;
      timed.paused = false;
      timed.pausedAt = 0;
      timed.startedAt = Date.now();
      timed.qStartAt = timed.startedAt;
      timed.qId = currentQuestionId();
      timed.currentDone = false;
      timed.endedAt = 0;
      timed.per = {};
      const btn = document.getElementById('timedStartBtn');
      btn.disabled = true;
      btn.textContent = '计时进行中…';
      render();
      timed.timerId = setInterval(updateTimerUI, 500);
      updateTimerUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function autoStartTimed() {
      if (timed.active) return;
      timed.active = true;
      timed.paused = false;
      timed.pausedAt = 0;
      timed.startedAt = Date.now();
      timed.qStartAt = timed.startedAt;
      timed.qId = currentQuestionId();
      timed.currentDone = false;
      timed.endedAt = 0;
      timed.per = {};
      const btn = document.getElementById('timedStartBtn');
      if (btn) { btn.disabled = true; btn.textContent = '计时进行中…'; }
      clearInterval(timed.timerId);
      timed.timerId = setInterval(updateTimerUI, 500);
      updateTimerUI();
    }
    function finishTimed() {
      if (!timed.active) return;
      if (timed.paused) {
        timedNoteCurrent();
        timed.endedAt = timed.pausedAt;
        timed.paused = false;
      } else {
        timedNoteCurrent();
        timed.endedAt = Date.now();
      }
      timed.active = false;
      clearInterval(timed.timerId);
      const btn = document.getElementById('timedStartBtn');
      btn.disabled = false;
      btn.textContent = '开始计时练习';
      render();
      showTimedReport();
    }
    function showTimedReport() {
      const total = Math.max(0, timed.endedAt - timed.startedAt);
      const rows = state.order.map((id) => {
        const q = questions[id];
        const rec = state.answers[id];
        return { id: id, q: q, time: timed.per[id] || 0, answered: !!rec, correct: !!rec && isCorrect(q, rec) };
      });
      const answered = rows.filter((r) => r.answered).length;
      const correct = rows.filter((r) => r.correct).length;
      const timedRows = rows.filter((r) => r.time > 0);
      const avg = timedRows.length ? timedRows.reduce((a, r) => a + r.time, 0) / timedRows.length : 0;
      const sorted = rows.slice().sort((a, b) => b.time - a.time);
      const visited = sorted.filter((r) => r.time > 0);
      const slowCount = Math.min(20, Math.max(3, Math.ceil(visited.length * 0.2)));
      let slowList = visited.filter((r) => r.time >= 2500).slice(0, slowCount);
      if (!slowList.length && visited.length) slowList = [visited[0]];
      const slowIds = new Set(slowList.map((r) => r.id));
      document.getElementById('reportSummary').innerHTML = [
        '<div class="report-stat"><strong>' + fmtClock(total) + '</strong><span>总用时</span></div>',
        '<div class="report-stat"><strong>' + answered + ' / ' + rows.length + '</strong><span>已答题目</span></div>',
        '<div class="report-stat"><strong>' + correct + '</strong><span>答对</span></div>',
        '<div class="report-stat"><strong>' + (answered ? Math.round(correct / answered * 100) + '%' : '—') + '</strong><span>正确率</span></div>',
        '<div class="report-stat"><strong>' + fmtDur(avg) + '</strong><span>平均每题用时</span></div>',
        '<div class="report-stat"><strong>' + (rows.length - answered) + '</strong><span>未作答</span></div>',
        '<div class="report-stat"><strong>' + slowIds.size + '</strong><span>不熟悉题目</span></div>'
      ].join('');
      const listed = sorted.filter((r) => r.time > 0 || r.answered);
      document.getElementById('reportList').innerHTML = listed.length ? listed.map((r, idx) => {
        const idxInOrder = state.order.indexOf(r.id);
        let badge;
        if (!r.answered) badge = '<span class="badge bad">未作答</span>';
        else if (!r.correct) badge = '<span class="badge bad">答错</span>';
        else if (slowIds.has(r.id)) badge = '<span class="badge">不熟·用时偏长</span>';
        else badge = '<span class="badge ok">正常</span>';
        return '<button type="button" class="report-row ' + (slowIds.has(r.id) ? 'slow' : '') + '" data-qid="' + r.id + '">' +
          '<span class="rank">' + (idx + 1) + '</span>' +
          '<span class="when">第 ' + (idxInOrder + 1) + ' 题 · ' + (r.q.topic || '') + '</span>' +
          '<span class="when">' + fmtDur(r.time) + '</span>' +
          badge + '</button>';
      }).join('') : '<div class="report-empty">本次没有作答记录，下次记得每题停一下再走～</div>';
      document.querySelectorAll('#reportList .report-row').forEach((el) => {
        el.addEventListener('click', () => {
          const qid = Number(el.dataset.qid);
          const idx = state.order.indexOf(qid);
          document.getElementById('reportMask').hidden = true;
          if (idx >= 0) { state.mode = 'recite'; goTo(idx); }
        });
      });
      document.getElementById('reportMask').hidden = false;
    }
    function closeTimedReport() {
      document.getElementById('reportMask').hidden = true;
    }

    function goTo(index) {
      if (index < 0 || index >= state.order.length) return;
      if (index !== state.current) state.visited.add(currentQuestionId());
      timedNoteCurrent();
      state.current = index;
      timedStartNewQuestion();
      state.revealed = false;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ---- 移动端左右滑动切题 ---- */
    function swipeNavigate(delta) {
      const target = state.current + delta;
      if (state.order.length < 2 || target < 0 || target >= state.order.length) return;
      goTo(target);
      const cls = delta > 0 ? 'swipe-anim-next' : 'swipe-anim-prev';
      questionCard.classList.remove('swipe-anim-next', 'swipe-anim-prev');
      void questionCard.offsetWidth;
      questionCard.classList.add(cls);
      setTimeout(() => questionCard.classList.remove(cls), 320);
    }

    (function bindSwipe() {
      let startX = 0, startY = 0, tracking = false;
      questionCard.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) { tracking = false; return; }
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });
      questionCard.addEventListener('touchmove', (e) => {
        if (!tracking) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx)) tracking = false; // 纵向滚动优先
      }, { passive: true });
      questionCard.addEventListener('touchend', (e) => {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        if (Math.abs(dx) < 60) return;
        if (Math.abs(dx) < Math.abs(dy) * 1.4) return;
        // 宽公式横向滚动时不切题
        const el = e.target && e.target.closest ? e.target.closest('mjx-container') : null;
        if (el && el.scrollWidth > el.clientWidth + 4) return;
        autoStartTimed();
        swipeNavigate(dx < 0 ? 1 : -1);
      }, { passive: true });
    })();

    document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', () => {
      if (btn.dataset.mode === state.mode) return;
      // 记住切换前题目卡片在视口中的位置，渲染后补回来，避免“位移感”
      pendingScrollAnchor = questionCard.getBoundingClientRect().top;
      state.mode = btn.dataset.mode;
      render();
    }));

    document.querySelectorAll('.order-btn').forEach(btn => btn.addEventListener('click', () => setOrder(btn.dataset.order)));

    document.getElementById('timedStartBtn').addEventListener('click', () => startTimed(false));

    let startPick = 'quiz';
    document.querySelectorAll('.start-module').forEach((b) => {
      b.addEventListener('click', () => {
        startPick = b.dataset.module;
        document.querySelectorAll('.start-module').forEach((x) => x.classList.toggle('active', x === b));
        const tip = document.getElementById('startTip');
        if (tip) {
          if (startPick === 'quiz') tip.textContent = '选择填空会计时 0s 起、每题单独记时，结束后生成用时报告。';
          else if (startPick === 'exam') tip.textContent = '真题卷是原卷图片：点开始后查看 5 页试卷，可双指放大。';
          else tip.textContent = '该模块为阅读复习：点开始后进入题目，可逐题「显示答案」。';
        }
      });
    });
    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('startMask').hidden = true;
      if (startPick === 'quiz') startTimed(true);
      else switchSection(startPick);
    });
    document.getElementById('reportCloseBtn').addEventListener('click', closeTimedReport);
    document.getElementById('reportDone').addEventListener('click', closeTimedReport);
    document.getElementById('reportRestart').addEventListener('click', () => { closeTimedReport(); startTimed(true); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('reportMask').hidden) closeTimedReport();
    });

    const favPracticeBtn = document.getElementById('favPracticeBtn');
    if (favPracticeBtn) favPracticeBtn.addEventListener('click', toggleFavPractice);
    const wrongPracticeBtn = document.getElementById('wrongPracticeBtn');
    if (wrongPracticeBtn) wrongPracticeBtn.addEventListener('click', toggleWrongPractice);
    const wrongClearBtn = document.getElementById('wrongClearBtn');
    if (wrongClearBtn) wrongClearBtn.addEventListener('click', clearWrongCollection);

    document.querySelectorAll('.top-tab').forEach((btn) => btn.addEventListener('click', () => switchSection(btn.dataset.section)));

    // 默认每次打开都是乱序（题目与选项一起打乱）
    buildOrder('random');

        document.getElementById('resetBtn').addEventListener('click', () => {
      if (!Object.keys(state.answers).length || window.confirm('确定清空全部答题记录吗？')) {
        state.answers = {};
        state.visited = new Set();
        state.mode = 'answer';
        state.orderMode = 'random';
        buildOrder('random');
        // 计时从 0 重新开始
        if (timed.active) {
          timed.paused = false;
          timed.pausedAt = 0;
          timed.startedAt = Date.now();
          timed.qStartAt = timed.startedAt;
          timed.endedAt = 0;
          timed.per = {};
        } else {
          autoStartTimed();
        }
        render();
        updateTimerUI();
      }
    });

    render();

    // 在线版 MathJax 异步加载：就绪后补渲染一次，确保公式显示
    (function ensureMathReady() {
      const t0 = Date.now();
      (function loop() {
        if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
          MathJax.startup.promise.then(() => { render(); }).catch(() => {});
          return;
        }
        const waitMs = Date.now() - t0;
        const tip = document.getElementById('mathLoadingText');
        if (tip && waitMs > 8000) tip.textContent = '公式引擎加载较慢，可刷新页面重试…';
        if (waitMs > 30000) {
          mathGaveUp = true;
          document.body.classList.add('math-ready');
          render();
          return;
        }
        setTimeout(loop, 100);
      })();
    })();
  </script>
</body>
