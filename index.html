<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动控制原理</title>
  <style>
    html { scrollbar-gutter: stable; }
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #17201e;
      --muted: #6c7774;
      --line: #e1e8e6;
      --green: #0b9f7a;
      --green-dark: #08775b;
      --green-soft: #e9f8f3;
      --red: #d84c4c;
      --red-soft: #fff0ef;
      --amber: #956410;
      --amber-soft: #fff7e6;
      --shadow: 0 12px 34px rgba(24, 52, 44, .07);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.75;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(11, 159, 122, .24); outline-offset: 3px; }
    .topbar {
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    h1 { font-size: 19px; line-height: 1.35; margin: 0; }
    .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .mode-switch {
      display: flex;
      padding: 4px;
      background: #edf1f0;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .mode-btn, .order-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }
    .mode-btn.active, .order-btn.active { background: var(--text); color: white; box-shadow: 0 3px 10px rgba(0,0,0,.12); }
    .order-switch[hidden] { display: none; }
    #orderSwitch { display: none !important; } /* 正序/乱序入口隐藏，默认乱序 */
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 26px 24px 42px;
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .layout { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: start; }
    .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }
    /* 防止背题模式的长公式把卡片撑宽（手机端横移/缩放感） */
    .layout > * { min-width: 0; }
    mjx-container[display="true"] { max-width: 100%; overflow-x: auto; overflow-y: hidden; }

    .question-card { padding: 28px; min-height: 570px; align-self: stretch; display: flex; flex-direction: column; }

    .timer-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 11px; border-radius: 999px;
      background: #f1f5f3; color: var(--muted); font-size: 12px; font-weight: 500;
      border: 1px solid #e6ecea;
    }
    .timer-chip .timer-dot { background: #a9c3ba; width: 6px; height: 6px; animation: none; }
    .timer-chip.paused { opacity: .55; }
    .timer-chip b { font-variant-numeric: tabular-nums; font-weight: 600; color: #55625e; }
    .timer-chip .timer-sep { opacity: .5; }
    .chip-finish {
      border: 1px solid #e1e8e6; border-radius: 999px; background: #fff; color: var(--muted);
      padding: 2px 13px; font-size: 12px; font-weight: 600; cursor: pointer; line-height: 1.5;
    }
    .chip-finish:hover { color: var(--text); border-color: #cbdcd6; }
    @media (max-width: 580px) {
      .timer-chip { font-size: 11px; padding: 1px 9px; gap: 5px; }
      .chip-finish { font-size: 11px; padding: 1px 10px; }
    }
    .question-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; row-gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .question-meta .tags { min-width: 0; }
    .question-meta .meta-right { flex: 0 0 auto; margin-left: auto; gap: 10px; }
    .tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tag { padding: 3px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); font-size: 12px; font-weight: 700; }
    .star-tag { background: #fff4d6; color: #a86a00; }
    .counter { color: var(--muted); font-size: 22px; font-weight: 600; white-space: nowrap; letter-spacing: .5px; }
    .counter strong { color: var(--text); font-size: 22px; font-weight: 800; margin-right: 2px; }
    .question-text { font-size: 18px; font-weight: 650; line-height: 1.85; margin: 0 0 24px; overflow-wrap: anywhere; }
    .options { display: grid; gap: 12px; }
    .option {
      width: 100%;
      min-height: 52px;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: white;
      color: var(--text);
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
    }
    .answer-mode .option:not(:disabled):hover { border-color: var(--green); background: #f8fcfa; transform: translateY(-1px); }
    .option:disabled { cursor: default; opacity: 1; }
    .option-letter {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #f0f3f2;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-weight: 700;
      font-family: Arial, sans-serif;
    }
    .option-content { flex: 1; min-width: 0; overflow: visible; padding: 3px 0; display: flex; align-items: center; }
    .option { min-width: 0; }
    .blank-ans {
      display: inline-block;
      color: var(--green-dark);
      font-weight: 700;
      background: var(--green-soft);
      border-bottom: 2px solid rgba(11, 159, 122, .55);
      border-radius: 4px 4px 2px 2px;
      padding: 0 4px;
      margin: 0 1px;
      line-height: 1.35;
      white-space: nowrap;
    }
    .option-content mjx-container, .question-text mjx-container { max-width: 100%; }
    .option-content mjx-container svg, .question-text mjx-container svg { max-width: 100%; height: auto; }
    .option-content { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .option-content::-webkit-scrollbar { display: none; }
    .option .option-content, .option .option-status { color: var(--text); }
    .option-status { font-size: 12px; font-weight: 700; white-space: nowrap; }
    .option.correct { background: var(--green-soft); border-color: var(--green); }
    .option.correct .option-letter { background: var(--green); color: white; }
    .option.wrong { background: var(--red-soft); border-color: var(--red); }
    .option.wrong .option-letter { background: var(--red); color: white; }
    .option.muted { opacity: 1; }
    .solution {
      margin-top: 24px;
      border-radius: 16px;
      background: #f5f8f7;
      border-left: 4px solid var(--green);
      padding: 18px 20px;
      animation: appear .22s ease-out;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .solution-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .answer-line { font-size: 16px; font-weight: 800; color: var(--green-dark); }
    .answer-line .user-wrong { color: var(--red); margin-left: 10px; font-weight: 500; }
    .redo { border: 0; background: white; color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .recall-panel { padding: 28px 20px; border-radius: 16px; background: #f5f8f7; text-align: center; color: var(--muted); }
    .recall-panel p { margin: 0 0 15px; font-size: 14px; }
    .recall-btn { border: 0; border-radius: 999px; background: var(--text); color: white; padding: 9px 24px; cursor: pointer; }
    .self-check { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 12px 0; padding: 12px 14px; background: white; border-radius: 12px; }
    .self-check span { color: var(--muted); font-size: 13px; }
    .self-check div { display: flex; gap: 8px; }
    .self-check button { border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    .self-check button[data-grade="correct"] { background: var(--green-soft); color: var(--green-dark); }
    .self-check button[data-grade="wrong"] { background: var(--red-soft); color: var(--red); }
    .fill-result { margin-left: 10px; font-weight: 500; }
    .fill-result.good { color: var(--green-dark); }
    .fill-result.bad { color: var(--red); }
    .solution h2 { font-size: 15px; margin: 10px 0 6px; }
    .solution p { margin: 7px 0; font-size: 14px; color: #45514e; }
    .formula-box { margin: 10px 0; padding: 10px 13px; background: white; border-radius: 10px; overflow-x: auto; color: #26332f; }
    .caution { margin-top: 12px; padding: 11px 13px; border-radius: 11px; background: var(--amber-soft); color: #785313; font-size: 13px; }
    .caution strong { display: block; margin-bottom: 3px; }
    .question-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 26px; }
    .nav-btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 22px;
      background: #edf1f0;
      color: var(--text);
      cursor: pointer;
    }
    .nav-btn.primary { background: var(--text); color: white; }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .sidebar { display: grid; gap: 16px; position: sticky; top: 98px; }
    .sidebar > .mode-switch { width: 100%; }
    .sidebar > .mode-switch .mode-btn, .sidebar > .mode-switch .order-btn { flex: 1; padding-left: 10px; padding-right: 10px; }
    .panel { padding: 20px; }
    .panel-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 14px; font-size: 14px; }
    .panel-title span { color: var(--muted); font-size: 12px; font-weight: 400; }
    .question-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 36px; gap: 8px; max-height: 212px; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: #b8c4c0 transparent; }
    .question-grid::-webkit-scrollbar { width: 5px; }
    .question-grid::-webkit-scrollbar-thumb { background: #b8c4c0; border-radius: 999px; }
    .question-grid::-webkit-scrollbar-track { background: transparent; }
    .q-num {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
    }
    .q-num.current { border-color: var(--text); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
    .q-num.done { background: var(--green-soft); color: var(--green-dark); border-color: transparent; }
    .q-num.error { background: var(--red-soft); color: var(--red); border-color: transparent; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; color: var(--muted); font-size: 11px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d8dfdd; }
    .dot.done { background: var(--green); }
    .dot.error { background: var(--red); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-bottom: 16px; }
    .stat strong { display: block; font-size: 22px; line-height: 1.4; }
    .stat span { color: var(--muted); font-size: 11px; }
    .progress-track { height: 7px; border-radius: 99px; background: #edf1f0; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: var(--green); border-radius: inherit; transition: width .1s linear; }
    .progress-text { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 7px; }
    .reset {
      width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 14px; background: #f4f7f6; color: var(--text);
      font-weight: 600; font-size: 14px; cursor: pointer; transition: .2s;
    }
    .reset:hover { background: #e9f1ee; border-color: #cdded8; }
    .tip { color: var(--muted); font-size: 12px; text-align: center; margin: 18px 0 0; }
    .math { font-family: "Times New Roman", "Cambria Math", serif; font-style: italic; white-space: nowrap; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.25; margin: 0 .16em; }
    .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .24em .08em; }
    .frac > span:last-child { padding: .08em .24em 0; }
    .sqrt { display: inline-flex; align-items: stretch; white-space: nowrap; }
    .sqrt > span { border-top: 1px solid currentColor; padding: 0 .12em; }
    sup .frac { font-size: .85em; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; grid-template-columns: 1fr 1fr; }
      .sidebar > .mode-switch { grid-column: 1 / -1; }
      .question-card { min-height: auto; }
    }
    @media (max-width: 580px) {
      .topbar-inner { padding: 12px 15px; gap: 10px; }
      h1 { font-size: 16px; }
      .brand p { display: none; }
      .mode-btn, .order-btn { padding: 6px 13px; font-size: 13px; }
      .wrap { padding: 16px 13px 30px; }
      .question-card { padding: 20px 16px; border-radius: 18px; }
      .question-text { font-size: 16px; }
      .option { padding: 11px 12px; gap: 10px; }
      .sidebar { grid-template-columns: 1fr; }
      .panel { padding: 17px; }
      .question-grid { grid-template-columns: repeat(10, 1fr); gap: 5px; max-height: none; overflow: visible; padding-right: 0; }
      .q-num { border-radius: 7px; font-size: 12px; }
      .solution { padding: 15px; }
    }
  
    /* ===== LaTeX 公式字号 ===== */
    mjx-container { font-size: 1.42em; }
    mjx-container[display="true"] { font-size: 1.28em; }
    .option-content mjx-container { font-size: 1.42em; }
    .question-text { line-height: 2.05; }

    /* ===== 收藏 ===== */
    .meta-right { display: flex; align-items: center; gap: 14px; }
    .fav-btn { white-space: nowrap; flex: 0 0 auto; }
    .fav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 11px 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s, transform .15s;
      z-index: 3;
    }
    .fav-btn .fav-icon { font-size: 15px; line-height: 1; color: #aab5b1; transition: color .15s; }
    .fav-btn:hover { border-color: var(--amber); color: var(--amber); background: #fffdf6; }
    .fav-btn:hover .fav-icon { color: var(--amber); }
    .fav-btn.on { background: #fffdf4; border-color: #f0c94a; color: var(--muted); }
    .fav-btn.on .fav-icon { color: #ffb400; }
    .fav-btn:active { transform: scale(.95); }
    .fav-switch {
      display: flex;
      padding: 4px;
      background: #edf1f0;
      border-radius: 999px;
    }
    .fav-toggle {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }
    .fav-toggle .fav-toggle-icon { font-size: 15px; line-height: 1; color: #b9c2bf; transition: color .15s; }
    .fav-toggle .fav-count {
      min-width: 20px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #e2e8e6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .fav-toggle:hover:not(:disabled) { background: rgba(255,255,255,.65); color: var(--text); }
    .fav-toggle.on { background: var(--green); color: #fff; box-shadow: 0 3px 10px rgba(11,159,122,.25); }
    .fav-toggle.on .fav-toggle-icon { color: #ffd54f; }
    .fav-toggle.on .fav-count { background: rgba(255,255,255,.24); color: #fff; }
    .fav-toggle:disabled { opacity: .45; cursor: not-allowed; }
    .q-num { position: relative; }
    .q-num.fav::after {
      content: '★';
      position: absolute;
      top: -7px;
      right: -5px;
      font-size: 9px;
      color: #f0b400;
      line-height: 1;
    }
    .wrong-switch {
      position: relative;
      display: flex;
      align-items: center;
      padding: 4px;
      background: #f6eeee;
      border-radius: 999px;
    }
    .wrong-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: .18s;
    }
    .wrong-clear:hover:not(:disabled) { background: var(--red-soft); color: var(--red); }
    .wrong-clear:disabled { opacity: .35; cursor: default; }
    .wrong-toggle {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }
    .wrong-toggle .wrong-icon { color: var(--red); font-weight: 700; }
    .wrong-count {
      min-width: 20px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #ead9d7;
      color: #8b4a44;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .wrong-toggle.on { background: var(--red); color: #fff; box-shadow: 0 3px 10px rgba(216, 76, 76, .28); }
    .wrong-toggle.on .wrong-icon { color: #fff; }
    .wrong-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #fdeceb;
      color: #b3261e;
      font-size: 12px;
      font-weight: 700;
    }

/* ---- 移动端左右滑动切题 ---- */
@keyframes swipeInFromRight { from { opacity:.35; transform: translateX(38px); } to { opacity:1; transform:none; } }
@keyframes swipeInFromLeft  { from { opacity:.35; transform: translateX(-38px); } to { opacity:1; transform:none; } }
.question-card.swipe-anim-next { animation: swipeInFromRight .26s ease-out; }
.question-card.swipe-anim-prev { animation: swipeInFromLeft .26s ease-out; }
.swipe-hint { display:none; }
@media (max-width: 820px) {
  .swipe-hint {
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:12px; font-size:12px; color:var(--muted); letter-spacing:.04em; user-select:none;
  }
  .swipe-hint::before, .swipe-hint::after { content:""; width:18px; height:1px; background:var(--line); }
}

    /* ================= 计时练习 ================= */
    .timed-start {
      width: 100%; margin-top: 14px; border: 0; border-radius: 12px;
      padding: 11px 14px; background: var(--green); color: #fff;
      font-weight: 650; cursor: pointer; transition: .2s;
    }
    .timed-start:hover { background: var(--green-dark); }
    .timed-start:disabled { opacity: .55; cursor: default; }
    .timer-bar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px 9px 16px; border-radius: 999px;
      background: rgba(20, 28, 26, .93); color: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .28);
      z-index: 70; font-size: 13px; white-space: nowrap;
    }
    .timer-bar[hidden] { display: none; }
    .timer-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; animation: timedPulse 1.4s infinite; }
    @keyframes timedPulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .timer-label { opacity: .65; font-size: 12px; }
    #timerTotal { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: .5px; }
    #timerQuestion { font-variant-numeric: tabular-nums; }
    .timer-sep { opacity: .35; }
    #timedFinishBtn {
      border: 0; border-radius: 999px; background: #fff; color: #16201d;
      padding: 6px 13px; font-weight: 650; cursor: pointer;
    }
    .report-mask {
      position: fixed; inset: 0; z-index: 90; padding: 20px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(12, 18, 16, .5); backdrop-filter: blur(3px);
    }
    .report-mask[hidden] { display: none; }
    .report-card {
      width: min(880px, 100%);
      max-height: 86vh;                       /* 老浏览器兜底 */
      max-height: calc(100dvh - 32px);        /* 手机动态视口，保证底部圆角可见 */
      overflow: auto;
      background: #fff; border-radius: 20px; padding: 26px; position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
    }
    .report-close {
      position: absolute; right: 16px; top: 14px; width: 32px; height: 32px;
      border: 0; border-radius: 50%; background: #eef2f1; font-size: 18px; cursor: pointer;
    }
    .report-card h2 { margin: 0 0 6px; font-size: 20px; }
    .report-sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .report-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-bottom: 16px; }

成是：<strong>信号线、方框、综合点（相加点）、引出点</strong>。</p><p>反馈是通过信号线、方框及综合点共同形成的连接关系，并不存在一种独立命名为“反馈点”的基本符号，因此选“反馈点”那一项。</p>"}, {"topic": "稳态误差", "stem": "Ⅱ型系统，输入为速度信号 <span class=\"math\">\\(r(t) = Vt\\)</span> 下的稳态误差 <span class=\"math\">\\(e_{ss}\\)</span> 等于（　）", "options": [["A", "无穷大"], ["B", "常数"], ["C", "0"], ["D", "随时间增大"]], "answer": "C", "analysis": "<p>系统型别就是开环传递函数中积分环节 <span class=\"math\">\\(\\frac{1}{s}\\)</span> 的个数。Ⅱ型系统含有两个积分环节，对斜坡（速度）输入的稳态跟随误差为 0。</p><div class=\"formula-box\">速度输入下：0 型系统误差为 ∞；Ⅰ型系统误差为非零常数；Ⅱ型系统误差为 0。</div><p>该结论以<strong>闭环系统稳定</strong>为前提。</p>"}, {"topic": "伯德图", "stem": "绘制伯德图，是改变什么参数（　）", "options": [["A", "系统增益"], ["B", "输入信号频率"], ["C", "阻尼比"], ["D", "时间常数"]], "answer": "B", "analysis": "<p>令 <span class=\"math\">\\(s = jω\\)</span>，不断改变输入正弦信号的角频率 <span class=\"math\">\\(ω\\)</span>，分别计算幅值 <span class=\"math\">\\(|G(jω)|\\)</span> 与相角 <span class=\"math\">\\(∠G(jω)\\)</span>，即可绘制对数幅频、相频特性曲线。</p><p>伯德图的横轴是按对数刻度的<strong>频率</strong>，系统本身的增益、阻尼比和时间常数在绘制某一给定系统的伯德图时保持固定。</p>"}, {"topic": "幅值裕度", "stem": "关于最小相位系统幅值裕度描述正确的是（　）", "options": [["A", "<span class=\"math\">\\(k_{g} &gt; 1\\)</span> 不稳定，<span class=\"math\">\\(k_{g} &lt; 1\\)</span> 稳定"], ["B", "<span class=\"math\">\\(k_{g} &gt; 1\\)</span> 稳定，<span class=\"math\">\\(k_{g} &lt; 1\\)</span> 不稳定"], ["C", "幅值裕度跟稳定性无关"], ["D", "幅值裕度越大稳定性越差"]], "answer": "B", "analysis": "<p>在相位穿越频率 <span class=\"math\">\\(ω_{x}\\)</span> 处，开环相角为 <span class=\"math\">\\(−180°\\)</span>，幅值裕度为：</p><div class=\"formula-box math\">\\[k_{g} = \\frac{1}{|G(jω_{x})H(jω_{x})|}\\]</div><p>按本题适用的最小相位系统常规判据，<span class=\"math\">\\(k_{g} &gt; 1\\)</span> 时增益还有增大余量，闭环稳定；<span class=\"math\">\\(k_{g} &lt; 1\\)</span> 时不稳定；<span class=\"math\">\\(k_{g} = 1\\)</span> 时处于临界状态。</p>"}, {"topic": "PID 校正", "stem": "PID 控制器是____在系统前向通道中的，因而起着串联校正的作用。", "options": [["A", "并联校正"], ["B", "串联校正"], ["C", "反馈校正"], ["D", "前馈校正"]], "answer": "B", "analysis": "<p>PID 控制器通常接在偏差信号之后、被控对象之前，与被控对象位于同一前向通道并依次串联，因此属于<strong>串联校正</strong>。</p><div class=\"formula-box math\">\\[G_{c}(s) = K_{p}(1 + \\frac{1}{T_{i}s} + T_{d}s)\\]</div><p>判断校正方式先看<strong>接入位置</strong>：前向通道串联为串联校正；包围局部环节形成内回路为反馈校正；沿扰动或输入另设补偿通道则可能是前馈校正。</p>"}, {"topic": "相角裕度", "stem": "控制系统一般要求相角裕度 <span class=\"math\">\\(γ\\)</span> 的工程范围是（　）", "options": [["A", "10°～30°"], ["B", "30°～60°"], ["C", "70°～90°"], ["D", "90°～120°"]], "answer": "B", "analysis": "<p>工程上通常取相角裕度 <strong>30°～60°</strong>，用于兼顾相对稳定性与动态响应速度。</p><div class=\"formula-box math\">\\[γ = 180° + ∠G(jω_{c})H(jω_{c})\\]</div><p>其中 <span class=\"math\">\\(ω_{c}\\)</span> 是幅值穿越频率。相角裕度过小，响应容易振荡、超调较大；过大则可能使响应迟缓。</p>"}, {"topic": "采样系统", "stem": "采样系统常用的采样保持器为（　）", "options": [["A", "零阶保持器"], ["B", "一阶保持器"], ["C", "二阶保持器"], ["D", "三阶保持器"]], "answer": "A", "analysis": "<p><strong>零阶保持器</strong>把当前采样值保持一个采样周期不变，结构最简单、易于实现，是采样系统中最常用的保持器（传递函数 <span class=\"math\">\\(G_{h}(s) = \\frac{1 − e^{−Ts}}{s}\\)</span>）。</p><p><strong>一阶保持器</strong>利用相邻两个采样值作线性外推，复现精度较高，但滞后更大、实现更复杂，实际应用远少于零阶保持器。</p>"}, {"topic": "线性系统性质", "stem": "线性系统具有________和________。", "options": [["A", "叠加性、齐次性"], ["B", "叠加性、因果性"], ["C", "齐次性、稳定性"], ["D", "能控性、能观性"]], "answer": "A", "analysis": "<p><strong>齐次性：</strong>输入扩大为原来的若干倍，输出也按相同比例变化；<strong>叠加性：</strong>多个输入共同作用产生的响应，等于各输入单独作用时响应的代数和。</p><p>同时满足齐次性与叠加性，也就是满足线性叠加原理。</p>"}, {"type": "fill", "topic": "二阶系统指标", "stem": "欠阻尼二阶系统超调量：<span class=\"math\">\\(σ\\% =\\)</span> ________；峰值时间：<span class=\"math\">\\(t_{p} =\\)</span> ________。", "answer": "σ%、tp 公式", "answerHtml": "<span class=\"math\">\\(σ\\% = e^{\\frac{−πξ}{\\sqrt{1 − ξ^{2}}}} × 100\\%\\)</span>；<span class=\"math\">\\(t_{p} = \\frac{π}{ω_{n}\\sqrt{1 − ξ^{2}}}\\)</span>", "analysis": "<p>两个公式都可由欠阻尼二阶系统的单位阶跃响应推导。超调量只由阻尼比 <span class=\"math\">\\(ξ\\)</span> 决定，峰值时间与阻尼振荡频率 <span class=\"math\">\\(ω_{d}\\)</span> 成反比。</p><div class=\"formula-box math\">\\[ω_{d} = ω_{n}\\sqrt{1 − ξ^{2}}，　t_{p} = \\frac{π}{ω_{d}}\\]</div><p>记忆时把超调量与“第一个峰值超出稳态值的程度”联系起来，把峰值时间与“第一次到达峰值的时刻”联系起来。</p>"}, {"topic": "极点与稳定性", "stem": "极点位于复平面________，系统不稳定。", "options": [["A", "右半平面"], ["B", "虚轴上"], ["C", "左半平面"], ["D", "单位圆内"]], "answer": "A", "analysis": "<p>连续时间线性定常系统：闭环极点全部在 <strong>左半平面</strong>（实部为负）时渐近稳定；只要有极点落在 <strong>右半平面</strong>，对应响应分量随时间发散，系统不稳定。</p><p>虚轴上的极点对应临界情况（等幅振荡），不能算“稳定”。本题问“系统不稳定”，应填右半平面。</p>"}, {"type": "fill", "topic": "典型环节频率特性", "stem": "积分环节幅频特性：<span class=\"math\">\\(A(ω) =\\)</span> ________；惯性环节幅频特性：<span class=\"math\">\\(A(ω) =\\)</span> ________。", "answer": "积分环节与惯性环节的幅频公式", "answerHtml": "积分环节：<span class=\"math\">\\(A(ω) = \\frac{1}{ω}\\)</span>；　惯性环节：<span class=\"math\">\\(A(ω) = \\frac{1}{\\sqrt{1 + ω^{2}T^{2}}}\\)</span>。", "analysis": "<p>令 <span class=\"math\">\\(s = jω\\)</span>，再取传递函数的模即可得到幅频特性。</p><div class=\"formula-box\">积分环节：<span class=\"math\">\\(G(s) = \\frac{1}{s}　→　|G(jω)| = \\frac{1}{ω}\\)</span><br>惯性环节：<span class=\"math\">\\(G(s) = \\frac{1}{Ts + 1}　→　|G(jω)| = \\frac{1}{\\sqrt{1 + ω^{2}T^{2}}}\\)</span></div><p>积分环节幅值随频率升高而减小；惯性环节在低频时幅值约为 1，高频时近似按 <span class=\"math\">\\(\\frac{1}{ωT}\\)</span> 衰减。</p>"}, {"type": "fill", "topic": "相角裕度", "stem": "相角裕度公式：<span class=\"math\">\\(γ =\\)</span> ________。", "answer": "180°+φ(ωc)", "answerHtml": "<span class=\"math\">\\(γ = φ(ω_{c}) + 180°\\)</span>", "analysis": "<p><span class=\"math\">\\(ω_{c}\\)</span> 是<strong>幅值穿越频率</strong>，此时开环幅频特性穿过 0 dB，即 <span class=\"math\">\\(|G(jω_{c})H(jω_{c})| = 1\\)</span>。</p><p>把该频率下的开环相角 <span class=\"math\">\\(φ(ω_{c})\\)</span> 与 <span class=\"math\">\\(−180°\\)</span> 临界相角比较，就得到 <span class=\"math\">\\(γ = φ(ω_{c}) + 180°\\)</span>。</p>"}, {"topic": "复极点与响应", "stem": "二阶系统闭环极点表达式中的 β 称为________，极点虚部代表系统输出相应的________。", "options": [["A", "阻尼角（β = arccos ζ）、振荡频率"], ["B", "调节时间、衰减速度"], ["C", "阻尼比、稳态误差"], ["D", "峰值时间、相位裕度"]], "answer": "A", "analysis": "<p>共轭复极点写作 <span class=\"math\">\\(s = −ζω_{n} ± jω_{n}\\sqrt{1 − ζ}^{2})\\)</span>：β 是极点向径与负实轴的夹角，即<strong>阻尼角</strong>，满足 <span class=\"math\">\\(β = arccos ζ\\)</span>，β 越大 ζ 越小、超调越大。</p><p><strong>虚部</strong> <span class=\"math\">\\(ω_{d} = ω_{n}\\sqrt{1 − ζ}^{2})\\)</span> 是阻尼振荡角频率，决定输出振荡的快慢；实部绝对值 <span class=\"math\">\\(ζω_{n}\\)</span> 反映衰减速度。</p>"}, {"topic": "伯德图", "stem": "伯德图对数幅频特性的纵坐标是（　）。", "options": [["A", "<span class=\"math\">\\(10 lg A(ω)\\)</span>"], ["B", "<span class=\"math\">\\(20 lg A(ω)\\)</span>"], ["C", "<span class=\"math\">\\(lg A(ω)\\)</span>"], ["D", "<span class=\"math\">\\(φ(ω)\\)</span>"]], "answer": "B", "analysis": "<p>这里指的是伯德图的<strong>对数幅频特性</strong>，纵坐标为 <span class=\"math\">\\(L(ω) = 20 lg A(ω)\\)</span>，单位是分贝（dB），横轴通常采用对数频率刻度。</p><p>注意伯德图还包括相频特性，其纵坐标是相角 <span class=\"math\">\\(φ(ω)\\)</span>，通常以度为单位。</p>"}, {"type": "fill", "topic": "根轨迹实轴区段", "stem": "某系统开环传递函数为 <span class=\"math\">\\(G(s)H(s) = \\frac{K}{s(s + 2)(s + 4)}\\)</span>（<span class=\"math\">\\(K &gt; 0\\)</span>），则其实轴上的根轨迹段为________。", "answer": "(−2,0) 与 (−∞,−4)", "analysis": "<p>实轴根轨迹段的判据：某点右侧开环实极点与实零点总数为<strong>奇数</strong>时，该点所在区段属于根轨迹。</p><p>极点为 <span class=\"math\">\\(0、−2、−4\\)</span>：在 <span class=\"math\">\\((−2,0)\\)</span> 内右侧只有 0（1 个，奇数）→ 是；在 <span class=\"math\">\\((−4,−2)\\)</span> 内右侧有 0、−2（2 个，偶数）→ 不是；在 <span class=\"math\">\\((−∞,−4)\\)</span> 内右侧有 0、−2、−4（3 个，奇数）→ 是。</p>", "answerHtml": "某系统开环传递函数为 <span class=\"math\">\\(G(s)H(s) = \\frac{K}{s(s + 2)(s + 4)}\\)</span>（<span class=\"math\">\\(K &gt; 0\\)</span>），则其实轴上的根轨迹段为<strong>(−2,0) 与 (−∞,−4)</strong>。"}, {"topic": "校正装置分类", "stem": "按校正装置的构成元件分类，校正装置可分为________、________。", "options": [["A", "串联、反馈"], ["B", "前馈、复合"], ["C", "比例、积分"], ["D", "有源、无源"]], "answer": "D", "analysis": "<p>按<strong>构成元件</strong>分类：由电阻、电容、电感等无源元件构成的是<strong>无源校正装置</strong>；含运算放大器等有源器件的是<strong>有源校正装置</strong>。</p><p>按<strong>连接方式</strong>分类则是串联校正、反馈校正、前馈校正与复合校正，注意不要与本题的分类维度混淆。</p>"}, {"topic": "离散系统", "stem": "离散系统数学描述为________。", "options": [["A", "微分方程"], ["B", "差分方程"], ["C", "代数方程"], ["D", "积分方程"]], "answer": "B", "analysis": "<p>连续时间系统通常用微分方程描述，离散时间系统通常用<strong>差分方程</strong>描述，它直接表达当前及过去输出与当前及过去输入之间的关系。</p><div class=\"formula-box math\">\\[y(k) + a_{1}y(k − 1) + ··· + a_{n}y(k − n) = b_{0}u(k) + ··· + b_{m}u(k − m)\\]</div><p>对差分方程作 Z 变换，还可进一步得到离散系统的脉冲传递函数。</p>"}, {"topic": "稳定性定义", "stem": "稳定性是指（　）。", "options": [["A", "系统受到外作用后，动态过程的振荡倾向和系统恢复平衡状态的能力"], ["B", "系统输出对输入响应的快慢以及动态过程持续时间的长短"], ["C", "系统在一定外部信号作用下所具有的稳态精度"], ["D", "系统对高频测量噪声的滤除能力"]], "answer": "A", "analysis": "<p><strong>稳定性</strong>关注系统受到扰动或其他外作用后，能否最终恢复平衡状态。对渐近稳定系统，扰动消失后，系统会随时间推移回到原来的平衡状态。</p><p>响应快慢属于快速性，稳态精度属于准确性，不要把三个基本性能指标混淆。</p>"}, {"topic": "快速性定义", "stem": "快速性是指（　）。", "options": [["A", "系统在一定外部信号作用下所具有的稳态精度"], ["B", "系统受到扰动后恢复原有平衡状态的能力"], ["C", "系统输出 c(t) 对输入 r(t) 响应的快慢，反映系统动态过程持续时间的长短"], ["D", "系统开环频率特性对高频噪声的衰减程度"]], "answer": "C", "analysis": "<p><strong>快速性</strong>描述系统响应输入或扰动的速度，也就是动态过程持续多长时间。上升时间、峰值时间和调节时间都是常用的快速性指标。</p><p>恢复平衡状态的能力主要对应稳定性，稳态误差大小则对应准确性。</p>"}, {"topic": "准确性定义", "stem": "准确性是指（　）。", "options": [["A", "系统输出对输入响应的快慢"], ["B", "系统受到扰动后恢复平衡状态的能力"], ["C", "系统动态过程中振荡程度的相对大小"], ["D", "系统在一定外部信号作用下所具有的稳态精度"]], "answer": "D", "analysis": "<p><strong>准确性</strong>主要用稳态误差衡量，即系统达到稳态后，期望输出与实际输出之间的偏差。</p><p>稳态误差越小，通常说明系统跟踪给定输入或抑制恒定扰动的稳态精度越高。</p>"}, {"topic": "超前校正", "stem": "超前校正是指（　）。", "options": [["A", "利用超前网络相角超前特性，提高相角裕度，改善系统动态性能"], ["B", "利用超前网络相角超前特性，主要增加系统型别并消除稳态误差"], ["C", "利用滞后网络相角滞后特性，缩短系统调节时间并提高响应速度"], ["D", "利用反馈网络高频衰减特性，直接改变输入信号的函数形式"]], "answer": "A", "analysis": "<p>超前校正装置在适当频段提供<strong>正的相角</strong>，可补偿原系统的相角滞后，提高相角裕度和阻尼，通常有利于减小超调并加快响应。</p><p>记忆主线是：<strong>相角超前 → 相角裕度提高 → 动态性能改善</strong>。改善稳态精度通常不是超前校正的主要目的。</p>"}, {"topic": "稳态误差影响因素", "stem": "系统的稳态误差主要由（　）共同确定。", "options": [["A", "阻尼比、无阻尼自然频率、输出初值"], ["B", "系统带宽、相角裕度、采样周期"], ["C", "闭环零点、极点实部、扰动方向"], ["D", "系统型别、开环增益、输入信号形式"]], "answer": "D", "analysis": "<p>稳态误差的三条判断主线是：<strong>系统型别、开环增益、输入信号形式</strong>。系统型别决定能无静差跟踪哪一类典型输入，开环增益影响误差的大小。</p><p>阶跃、斜坡、抛物线输入可分别结合位置、速度、加速度误差系数分析。</p>"}, {"topic": "连续系统稳定条件", "stem": "线性定常系统稳定的充分必要条件是闭环传递函数的所有极点必须在 s 平面的（　）。", "options": [["A", "右半平面"], ["B", "左半平面"], ["C", "虚轴上"], ["D", "单位圆内"]], "answer": "B", "analysis": "<p>对连续时间线性定常系统，<strong>全部闭环极点具有负实部</strong>，即都位于 s 平面左半平面，系统才是渐近稳定的。</p><p>右半平面极点会产生随时间增长的响应分量；“单位圆内”是离散系统 z 域稳定性的常用判据，不要混用。</p>"}, {"topic": "增益裕度", "stem": "当 <span class=\"math\">\\(K_{g} &gt; 1\\)</span> 时，系统是（　）。", "options": [["A", "不稳定"], ["B", "临界稳定"], ["C", "稳定"], ["D", "无法仅凭此条件判断"]], "answer": "C", "analysis": "<p>本题按常规负反馈、开环稳定系统判断。Kg 表示增益裕度：<span class=\"math\">\\(Kg &gt; 1\\)</span> 说明增益还有增大余量，闭环稳定；<span class=\"math\">\\(Kg &lt; 1\\)</span> 时闭环不稳定，<span class=\"math\">\\(Kg = 1\\)</span> 为临界状态。</p><p>严格说，频率域裕度判稳还需结合开环极点及 Nyquist 判据的使用前提，单独一个增益裕度数值并不能覆盖所有系统。</p>"}, {"topic": "线性系统性质", "stem": "关于线性系统的性质，下列说法正确的是（　）。", "options": [["A", "只满足叠加性，不满足齐次性"], ["B", "同时满足齐次性和叠加性"], ["C", "只满足齐次性，不满足叠加性"], ["D", "输出与输入幅值无关"]], "answer": "B", "analysis": "<p>线性系统必须同时满足<strong>齐次性</strong>与<strong>叠加性</strong>：输入扩大若干倍，输出也扩大相同倍数；多个输入共同作用的响应等于各输入单独作用时响应之和。</p><p>只满足其中一条或两条都不满足的系统都不是线性系统。</p>"}, {"topic": "根轨迹终点", "stem": "根轨迹的终点是（　）。", "options": [["A", "开环极点，所有分支均终止于有限极点"], ["B", "闭环极点，所有分支均终止于闭环极点"], ["C", "无穷零点，所有分支均终止于无穷远"], ["D", "有限零点，富余分支趋向无穷远"]], "answer": "D", "analysis": "<p>根轨迹从<strong>开环极点</strong>出发，终止于<strong>开环零点</strong>。若开环有 n 个极点、m 个有限零点且 n &gt; m，则有 m 条分支终止于有限零点，其余 n − m 条分支沿渐近线趋向无穷远。</p><p>因此可记为：“起点看极点，终点看零点，不够的分支去无穷远。”</p>"}, {"topic": "采样系统数学工具", "stem": "采样系统分析是以________作为数学模型，用________变换作为求解工具。", "options": [["A", "微分方程、拉普拉斯"], ["B", "差分方程、Z"], ["C", "差分方程、傅里叶"], ["D", "微分方程、Z"]], "answer": "B", "analysis": "<p>采样系统处理离散时刻的信号，通常以<strong>差分方程</strong>描述输入、输出序列之间的关系，并用 <strong>Z 变换</strong>求解和分析。</p><p>对应记忆：连续系统常用“微分方程＋拉普拉斯变换”，离散系统常用“差分方程＋Z 变换”。</p>"}, {"topic": "对数幅频特性", "stem": "对数幅频特性曲线的纵坐标为（　）。", "options": [["A", "<span class=\"math\">\\(φ(ω)\\)</span>"], ["B", "<span class=\"math\">\\(10 lg A(ω)\\)</span>"], ["C", "<span class=\"math\">\\(20 lg A(ω)\\)</span>"], ["D", "<span class=\"math\">\\(lg A(ω)\\)</span>"]], "answer": "C", "analysis": "<p>对数幅频特性定义为 <span class=\"math\">\\(L(ω) = 20 lg A(ω)\\)</span>，单位为分贝（dB）；其中 <span class=\"math\">\\(A(ω)\\)</span> 是幅频特性。</p><p><span class=\"math\">\\(φ(ω)\\)</span> 是相频特性；<span class=\"math\">\\(10 lg A(ω)\\)</span> 混淆了幅值与功率比取对数时的系数。</p>"}, {"type": "fill", "topic": "二阶系统动态指标", "stem": "二阶欠阻尼系统的超调量 <span class=\"math\">\\(σ\\% =\\)</span> ________；峰值时间 <span class=\"math\">\\(t_{p} =\\)</span> ________；上升时间 <span class=\"math\">\\(t_{r} =\\)</span> ________。", "answer": "σ%、tp、tr 三个公式", "answerHtml": "<span class=\"math\">\\(σ\\% = e^{\\frac{−πξ}{\\sqrt{1−ξ²}}} × 100\\%\\)</span><br><span class=\"math\">\\(t_{p} = \\frac{π}{ω_{n}\\sqrt{1−ξ²}}\\)</span><br><span class=\"math\">\\(t_{r} = \\frac{π−β}{ω_{n}\\sqrt{1−ξ²}}\\)</span>", "analysis": "<p>令阻尼振荡频率 <span class=\"math\">\\(ω_{d} = ω_{n}\\sqrt{1−ξ²}\\)</span>，则峰值时间为 <span class=\"math\">\\(t_{p} = \\frac{π}{ω_{d}}\\)</span>，上升时间为 <span class=\"math\">\\(t_{r} = \\frac{π−β}{ω_{d}}\\)</span>，其中 <span class=\"math\">\\(β = arccos ξ\\)</span>。</p><p>超调量只由阻尼比 ξ 决定；峰值时间和上升时间还受无阻尼自然频率 ω<sub>n</sub> 影响。</p>"}, {"topic": "奈奎斯特稳定判据", "stem": "在判别系统稳定性的方法中，（　）判据是在频率特性法中分析系统稳定性的判据。", "options": [["A", "劳斯"], ["B", "奈奎斯特"], ["C", "赫尔维茨"], ["D", "李亚普诺夫"]], "answer": "B", "analysis": "<p><strong>奈奎斯特稳定判据</strong>利用开环幅相频率特性曲线包围临界点 (−1, j0) 的情况，结合开环右半平面极点数判断闭环稳定性。</p><p>劳斯、赫尔维茨判据属于代数判据；李亚普诺夫方法基于状态空间和能量函数思想。</p>"}, {"topic": "Ⅱ型系统稳态误差", "stem": "稳定的单位负反馈系统中，输入单位抛物线信号 r(t) = <span class=\"math\">\\(\\frac{t^{2}}{2}\\)</span> 时，Ⅱ型系统的稳态误差为（　）。", "options": [["A", "<span class=\"math\">\\(0\\)</span>"], ["B", "<span class=\"math\">\\(\\frac{1}{K_{a}}\\)</span>"], ["C", "<span class=\"math\">\\(∞\\)</span>"], ["D", "<span class=\"math\">\\(\\frac{1}{1+K_{p}}\\)</span>"]], "answer": "B", "analysis": "<p>单位抛物线输入 <span class=\"math\">\\(r(t) = \\frac{t^{2}}{2}\\)</span> 的拉普拉斯变换为 <span class=\"math\">\\(R(s) = \\frac{1}{s^{3}}\\)</span>。定义加速度误差系数 <span class=\"math\">\\(K_{a} = lim_{s→0} s²G(s)\\)</span>。</p><div class=\"formula-box math\">\\[e_{ss} = \\frac{1}{K_{a}}\\]</div><p>Ⅱ型系统对阶跃、斜坡输入的稳态误差为 0，对抛物线输入为有限非零值。</p>"}, {"topic": "相位裕量", "stem": "相位裕量的表达式及工程中通常要求的范围分别是（　）。", "options": [["A", "<span class=\"math\">\\(γ = φ(ω_{c}) + 180°；30°～60°\\)</span>"], ["B", "<span class=\"math\">\\(γ = φ(ω_{c}) − 180°；30°～60°\\)</span>"], ["C", "<span class=\"math\">\\(γ = φ(ω_{c}) + 180°；0°～30°\\)</span>"], ["D", "<span class=\"math\">\\(γ = 180° − φ(ω_{c})；60°～90°\\)</span>"]], "answer": "A", "analysis": "<p>在增益截止频率 <span class=\"math\">\\(ω_{c}\\)</span> 处，开环幅值满足 <span class=\"math\">\\(A(ω_{c})=1\\)</span>。相位裕量定义为：</p><div class=\"formula-box math\">\\[γ = φ(ω_{c}) + 180°\\]</div><p>工程中通常要求 γ 在 <strong>30°～60°</strong>之间，以兼顾相对稳定性和动态响应速度。</p>"}, {"topic": "典型环节幅频特性", "stem": "惯性环节和积分环节的幅频特性分别是（　）。", "options": [["A", "惯性：<span class=\"math\">\\(\\frac{1}{\\sqrt{1+ω²T²}}\\)</span>；积分：<span class=\"math\">\\(\\frac{1}{ω}\\)</span>"], ["B", "惯性：<span class=\"math\">\\(\\frac{1}{1+ω²T²}\\)</span>；积分：<span class=\"math\">\\(\\frac{1}{ω²}\\)</span>"], ["C", "惯性：<span class=\"math\">\\(\\frac{1}{\\sqrt{1+ω²T²}}\\)</span>；积分：<span class=\"math\">\\(ω\\)</span>"], ["D", "惯性：<span class=\"math\">\\(\\sqrt{1+ω²T²}\\)</span>；积分：<span class=\"math\">\\(\\frac{1}{ω}\\)</span>"]], "answer": "A", "analysis": "<p>惯性环节 <span class=\"math\">\\(G(s) = \\frac{1}{Ts+1}\\)</span>，令 <span class=\"math\">\\(s=jω\\)</span> 后取模，得到 <span class=\"math\">\\(A(ω) = \\frac{1}{\\sqrt{1+ω²T²}}\\)</span>。</p><p>积分环节 <span class=\"math\">\\(G(s) = \\frac{1}{s}\\)</span>，其频率特性为 <span class=\"math\">\\(\\frac{1}{jω}\\)</span>，所以幅频特性为 <span class=\"math\">\\(A(ω) = \\frac{1}{ω}\\)</span>。</p>"}, {"topic": "反馈系统传递函数", "stem": "反馈控制系统的传递函数分为（　）三种。", "options": [["A", "开环传递函数、闭环传递函数、扰动传递函数"], ["B", "前向传递函数、反馈传递函数、误差传递函数"], ["C", "开环传递函数、误差传递函数、输出传递函数"], ["D", "开环传递函数、闭环传递函数、误差传递函数"]], "answer": "D", "analysis": "<p>本题按反馈控制系统的常用分类，三种传递函数为：<strong>开环传递函数、闭环传递函数、误差传递函数</strong>。</p><p>开环传递函数通常指回路断开后的 <span class=\"math\">\\(G(s)H(s)\\)</span>；闭环传递函数描述输出与输入的关系；误差传递函数描述误差信号与输入的关系。</p>"}, {"topic": "系统基本性能要求", "stem": "系统基本的性能要求包含（　）。", "options": [["A", "稳定性、能控性、能观性"], ["B", "快速性、准确性、因果性"], ["C", "稳定性、快速性、准确性"], ["D", "稳定性、准确性、最小相位性"]], "answer": "C", "analysis": "<p>控制系统的三项基本性能要求是<strong>稳定性、快速性、准确性</strong>，通常概括为“稳、快、准”。</p><p>稳定性是系统正常工作的前提，快速性描述动态响应速度，准确性描述稳态跟踪精度。</p>"}, {"topic": "改善稳态精度", "stem": "改善系统稳态精度的方法是（　）。", "options": [["A", "降低系统型别、减小开环增益"], ["B", "提高系统型别、增大开环增益"], ["C", "增加系统阻尼比、降低无阻尼自然频率"], ["D", "增大相角裕度、提高增益截止频率"]], "answer": "B", "analysis": "<p>提高系统型别，可以消除对更高阶典型输入的稳态误差；增大开环增益，可以减小有限稳态误差。因此答案是<strong>提高系统型别、增大开环增益</strong>。</p><p>实际校正中必须同时检查稳定性，不能为了减小稳态误差而无限增大增益。</p>"}, {"topic": "PID参数名称", "stem": "PID 控制器中，K<sub>p</sub>、T<sub>i</sub>、T<sub>d</sub> 分别称为（　）。", "options": [["A", "比例系数、微分时间常数、积分时间常数"], ["B", "比例系数、采样周期、积分时间常数"], ["C", "比例系数、积分时间常数、采样时间常数"], ["D", "比例系数、积分时间常数、微分时间常数"]], "answer": "D", "analysis": "<p><span class=\"math\">\\(K_{p}\\)</span> 是<strong>比例系数</strong>，<span class=\"math\">\\(T_{i}\\)</span> 是<strong>积分时间常数</strong>，<span class=\"math\">\\(T_{d}\\)</span> 是<strong>微分时间常数</strong>。</p><p>PID 的基本结构是比例、积分、微分三项作用的组合，可记为 P—K<sub>p</sub>、I—T<sub>i</sub>、D—T<sub>d</sub>。</p>"}, {"topic": "校正装置连接方式", "stem": "按照校正装置在系统中的连接方式，校正方法可分为（　）。", "options": [["A", "串联校正、反馈校正、滞后校正"], ["B", "串联校正、反馈校正、前馈补偿"], ["C", "超前校正、滞后校正、复合校正"], ["D", "串联校正、并联校正、PID 校正"]], "answer": "B", "analysis": "<p>按校正装置与原有系统的连接关系，通常分为<strong>串联校正、反馈校正和前馈补偿</strong>。</p><p>超前、滞后是按校正装置的相频特性或功能分类；PID 是具体控制规律，不属于这里要求的三种连接方式。</p>"}, {"topic": "前向与反馈通道", "stem": "闭环系统中，由给定值至被控量的通道称为（　）；由被控量至系统输入端的通道称为（　）。", "options": [["A", "反馈通道、前向通道"], ["B", "前向通道、前馈通道"], ["C", "前向通道、反馈通道"], ["D", "输入通道、输出通道"]], "answer": "C", "analysis": "<p>信号从给定值经控制器、执行机构和被控对象传到被控量，这条主信号通路称为<strong>前向通道</strong>。</p><p>被控量经检测元件返回输入比较端，与给定值形成偏差，这条返回通路称为<strong>反馈通道</strong>。</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "自动控制系统的三大性能指标是稳定性、<span>________</span>和<span>________</span>。", "answer": "快速性；准确性", "answerHtml": "自动控制系统的三大性能指标是稳定性、<strong>快速性</strong>和<strong>准确性</strong>。", "analysis": "<p><strong>记忆要点：</strong>稳—快—准：极点、时间、误差</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "线性系统必须同时满足<span>________</span>和<span>________</span>。", "answer": "齐次性（均匀性）；叠加性", "answerHtml": "线性系统必须同时满足<strong>齐次性（均匀性）</strong>和<strong>叠加性</strong>。", "analysis": "<p><strong>记忆要点：</strong>齐次看倍数、叠加看加法，两条缺一就不是线性</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "常规根轨迹起始于开环<span>________</span>，终止于开环<span>________</span>（或无穷远处）。", "answer": "极点；零点", "answerHtml": "常规根轨迹起始于开环<strong>极点</strong>，终止于开环<strong>零点</strong>（或无穷远处）。", "analysis": "<p><strong>记忆要点：</strong>极点出发、零点收口，多出 n−m 条奔无穷</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "实轴上某区段右侧实数开环零、极点总数为<span>________</span>时，该区段必为根轨迹段。", "answer": "奇数", "answerHtml": "实轴上某区段右侧实数开环零、极点总数为<strong>奇数</strong>时，该区段必为根轨迹段。", "analysis": "<p><strong>记忆要点：</strong>从右往左数，遇零极点就翻牌，奇数段是轨迹</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "对数幅频特性 L(ω)=<span>________</span>；当 A(ω)=1 时，L(ω)=<span>________</span> dB。", "answer": "20lgA(ω)；0", "answerHtml": "对数幅频特性 L(ω)=<strong>20lgA(ω)</strong>；当 A(ω)=1 时，L(ω)=<strong>0</strong> dB。", "analysis": "<p><strong>记忆要点：</strong>幅频用 20lg，功率才 10lg；A=1 即 0dB</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "惯性环节 <span class=\"math\">\\(\\frac{1}{Ts+1}\\)</span> 的转折频率为<span>________</span>，在该频率处其相角为<span>________</span>。", "answer": "1/T；−45°", "answerHtml": "惯性环节 <span class=\"math\">\\(\\frac{1}{Ts+1}\\)</span> 的转折频率为<strong><span class=\"math\">\\(\\frac{1}{T}\\)</span></strong>，在该频率处其相角为<strong><span class=\"math\">\\(-45^{\\circ}\\)</span></strong>。", "analysis": "<p><strong>记忆要点：</strong><span>\\(\\frac{1}{T}\\)</span> 处 −3dB、−45°，之后每十倍频降 20</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "相位裕量的定义式为 γ=<span>________</span>，其中 ωc 为截止频率。", "answer": "180°+φ(ωc)", "answerHtml": "相位裕量的定义式为 γ=<strong>180°+φ(ωc)</strong>，其中 ωc 为截止频率。", "analysis": "<p><strong>记忆要点：</strong>先让 A(ωc)=1 找到 ωc，再回代求 γ</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "工程上通常希望系统的相位裕量 γ 在<span>________</span>范围内。", "answer": "30°～60°", "answerHtml": "工程上通常希望系统的相位裕量 γ 在<strong>30°～60°</strong>范围内。", "analysis": "<p><strong>记忆要点：</strong>三十到六十，稳中带快</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "对最小相位系统，当幅值裕量 Kg&lt;1 时，闭环系统<span>________</span>。", "answer": "不稳定", "answerHtml": "对最小相位系统，当幅值裕量 Kg&lt;1 时，闭环系统<strong>不稳定</strong>。", "analysis": "<p><strong>记忆要点：</strong>最小相位看 Kg：大于 1 稳、等于 1 临界、小于 1 翻</p>"}, {"type": "fill", "topic": "预测卷一 · 填空", "stem": "一阶保持器采用<span>________</span>外推规律，零阶保持器采用<span>________</span>外推规律。", "answer": "线性；常值", "answerHtml": "一阶保持器采用<strong>线性</strong>外推规律，零阶保持器采用<strong>常值</strong>外推规律。", "analysis": "<p><strong>记忆要点：</strong>零阶走阶梯，一阶画折线</p>"}, {"topic": "预测卷一 · 单选", "stem": "线性定常系统稳定的充要条件是（　　）。", "options": [["A", "开环极点全部位于 s 左半平面"], ["B", "闭环极点全部位于 s 左半平面"], ["C", "开环零点全部位于 s 左半平面"], ["D", "闭环极点全部位于 s 右半平面"]], "answer": "B", "analysis": "<p><strong>正确选项：</strong>闭环极点全部位于 s 左半平面</p><p><strong>记忆要点：</strong>稳定看闭环，极点在左半平面；开环只作参考</p>"}, {"topic": "预测卷一 · 单选", "stem": "单位负反馈 II 型系统在单位斜坡输入 <span class=\"math\">\\(r(t)=t\\)</span> 作用下的稳态误差为（　　）。", "options": [["A", "0"], ["B", "<span class=\"math\">\\(\\frac{1}{K_{v}}\\)</span>"], ["C", "<span class=\"math\">\\(∞\\)</span>"], ["D", "<span class=\"math\">\\(\\frac{1}{(1+K_{p})}\\)</span>"]], "answer": "A", "analysis": "<p><strong>正确选项：</strong>0</p><p><strong>记忆要点：</strong>II 型打斜坡，误差归零</p>"}, {"topic": "预测卷一 · 单选", "stem": "线性系统的稳态误差由（　　）确定。", "options": [["A", "仅系统型别"], ["B", "仅开环增益"], ["C", "系统型别、开环增益和输入信号形式"], ["D", "仅输入信号形式"]], "answer": "C", "analysis": "<p><strong>正确选项：</strong>系统型别、开环增益和输入信号形式</p><p><strong>记忆要点：</strong>误差三来源：型别、增益、输入形</p>"}, {"topic": "预测卷一 · 单选", "stem": "其他条件不变，闭环极点与负实轴的夹角 β 增大时（　　）。", "options": [["A", "ζ 增大，超调量减小"], ["B", "ζ 减小，超调量增大"], ["C", "ζ 减小，超调量减小"], ["D", "ζ 与超调量均不变"]], "answer": "B", "analysis": "<p><strong>正确选项：</strong>ζ 减小，超调量增大</p><p><strong>记忆要点：</strong>β 大→ζ 小→超调大；极点贴虚轴就晃</p>"}, {"topic": "预测卷一 · 单选", "stem": "用实验法测取系统幅频特性时，一般通过改变输入正弦信号的（　　）逐点测 1}L_{3}\\)。</p><p>正确选项：\\(1,\\ 1-(L_{1}+L_{3})+L_{1}L_{3}\\)。</p>"}, {"topic": "28考点·结构图求参数", "stem": "单位负反馈系统的开环传递函数为 \\(G(s)=\\frac{K}{s(\\tau s+1)}\\)（\\(K>0\\)，\\(\\tau>0\\)）。要求超调量 \\(\\sigma\\%=16.3\\%\\)、调节时间 \\(t_{s}=2\\,\\mathrm{s}\\)（\\(\\Delta=5\\%\\)），则 \\(K\\)、\\(\\tau\\) 应为（　）。", "options": [["A", "\\(K=3,\\quad \\tau=\\frac{1}{3}\\)"], ["B", "\\(K=9,\\quad \\tau=\\frac{1}{3}\\)"], ["C", "\\(K=3,\\quad \\tau=3\\)"], ["D", "\\(K=3,\\quad \\tau=\\frac{2}{3}\\)"]], "answer": "A", "analysis": "<p>由 \\(\\sigma\\%=16.3\\%\\) 得 \\(\\zeta=0.5\\)；由 \\(t_{s}=\\frac{3}{\\zeta\\omega_{n}}=2\\) 得 \\(\\zeta\\omega_{n}=1.5\\)，故 \\(\\omega_{n}=3\\)。</p><p>比较标准式：\\(2\\zeta\\omega_{n}=\\frac{1}{\\tau}=3\\Rightarrow\\tau=\\frac{1}{3}\\)；\\(\\omega_{n}^{2}=\\frac{K}{\\tau}=9\\Rightarrow K=3\\)。</p><p>正确选项：\\(K=3,\\ \\tau=\\frac{1}{3}\\)。</p>"}, {"type": "fill", "topic": "28考点·结构图求参数", "stem": "承上题，取 \\(K=3\\)、\\(\\tau=\\frac{1}{3}\\)，单位斜坡输入 \\(r(t)=t\\) 作用下的稳态误差 \\(e_{ss}=\\)________。", "answer": "1/3", "answerHtml": "承上题，取 \\(K=3\\)、\\(\\tau=\\frac{1}{3}\\)，单位斜坡输入 \\(r(t)=t\\) 作用下的稳态误差 \\(e_{ss}=<strong>\\frac{1}{3}</strong>\\)。", "analysis": "<p>系统为Ⅰ型，速度误差系数 \\(K_{v}=\\lim_{s\\to0}sG(s)=\\lim_{s\\to0}\\frac{3}{\\frac{1}{3}s+1}=3\\)，故 \\(e_{ss}=\\frac{1}{K_{v}}=\\frac{1}{3}\\)。</p>"}, {"topic": "28考点·根轨迹绘图", "stem": "已知开环传递函数 \\(G(s)H(s)=\\frac{K_{r}}{s(s+3)(s+6)}\\)（\\(K_{r}>0\\)），根轨迹在实轴上的分离点为（　）。", "options": [["A", "\\(s=-3+\\sqrt{3}\\)"], ["B", "\\(s=-3-\\sqrt{3}\\)"], ["C", "\\(s=-3\\)"], ["D", "无分离点"]], "answer": "A", "analysis": "<p>由 \\(K_{r}=-s(s+3)(s+6)\\) 令 \\(\\frac{dK_{r}}{ds}=-(3s^{2}+18s+18)=0\\)，即 \\(s^{2}+6s+6=0\\)，得 \\(s=-3\\pm\\sqrt{3}\\)。</p><p>只有 \\(s=-3+\\sqrt{3}\\approx-1.268\\) 落在根轨迹段 \\((-3,0)\\) 上且对应 \\(K_{r}>0\\)，是分离点；另一根不在根轨迹段上，舍去。</p><p>正确选项：\\(s=-3+\\sqrt{3}\\)。</p>"}, {"topic": "28考点·根轨迹绘图", "stem": "同上系统 \\(G(s)H(s)=\\frac{K_{r}}{s(s+3)(s+6)}\\)，根轨迹与虚轴交点对应的临界增益 \\(K_{r}\\) 及振荡角频率 \\(\\omega\\) 为（　）。", "options": [["A", "\\(K_{r}=162,\\quad
